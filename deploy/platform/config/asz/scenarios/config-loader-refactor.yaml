          package grpc

          import "github.com/apache/skywalking-banyandb/pkg/cfgblock"

          type ConfigBinding struct {
          	loader *cfgblock.Loader
          	cfg    *cfgblock.Block
          }

          func (s *ConfigBinding) Init(path string) error {
          	loader, err := cfgblock.FromFile(path, "liaison")
          	if err != nil {
          		return err
          	}
          	s.loader = loader
          	loader.OnChange(func(b *cfgblock.Block) { s.cfg = b })
          	if s.cfg, err = loader.Load("grpc"); err != nil {
          		return err
          	}
          	return loader.WatchFile(path, "grpc")
          }

          // Reload re-reads this server's block only.
          func (s *ConfigBinding) Reload() error {
          	_, err := s.loader.Reload("grpc")
          	return err
          }

          // OnChange registers f with this server's Loader only.
          func (s *ConfigBinding) OnChange(f func()) {
          	s.loader.OnChange(func(*cfgblock.Block) { f() })
          }
