- input: "Defaults and validation in their own file too."
- call:
    text: "Writing defaults and validation. Only what the old loaders already did: a 20s timeout, and the endpoint check stream had; name stays optional because pkg/node's block has none."
    tool:
      name: Write
      input:
        file_path: pkg/cfgblock/defaults.go
        content: &w_defaults |
          package cfgblock

          import "time"

          // DefaultTimeout is the value four of the six old loaders hardcoded.
          const DefaultTimeout = 20 * time.Second

          // applyDefaults fills only what a module used to fill: an unset timeout.
          // Name stays optional and retries keep no default, as before.
          func applyDefaults(b *Block) {
          	if b.Timeout == 0 {
          		b.Timeout = DefaultTimeout
          	}
          	if b.Extra == nil {
          		b.Extra = map[string]string{}
          	}
          }

          // Validate applies stream's one rule, an endpoint, to every module.
          func Validate(b *Block) error {
          	if b.Endpoint == "" {
          		return &InvalidError{Field: "endpoint", Reason: "must not be empty"}
          	}
          	return nil
          }
      result: "written, 24 lines"
      changes:
      - path: pkg/cfgblock/defaults.go
        after: *w_defaults
