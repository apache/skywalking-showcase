    tool:
      name: Write
      input:
        file_path: banyand/liaison/reload_test.go
        content: &w_rtest |
          package liaison

          import (
          	"testing"

          	"github.com/apache/skywalking-banyandb/banyand/liaison/grpc"
          	"github.com/apache/skywalking-banyandb/banyand/liaison/http"
          )

          func TestServersReloadIndependently(t *testing.T) {
          	g, h := &grpc.ConfigBinding{}, &http.ConfigBinding{}
          	if err := g.Init("testdata/liaison.yaml"); err != nil {
          		t.Fatal(err)
          	}
          	if err := h.Init("testdata/liaison.yaml"); err != nil {
          		t.Fatal(err)
          	}
          	grpcFired, httpFired := 0, 0
          	g.OnChange(func() { grpcFired++ })
          	h.OnChange(func() { httpFired++ })
          	if err := g.Reload(); err != nil {
