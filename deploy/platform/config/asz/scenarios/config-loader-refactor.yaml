- call:
    text: "Source interface plus a file and a map implementation."
    tool:
      name: Write
      input:
        file_path: pkg/cfgblock/source.go
        content: &w_source |
          package cfgblock

          import (
          	"os"

          	"gopkg.in/yaml.v3"
          )

          // Source is where a Loader gets raw bytes for a key.
          type Source interface {
          	Read(key string) ([]byte, error)
          }

          type fileSource struct {
          	path string
          }

          // Read re-reads the file on every call, so a Reload sees what is on disk.
          func (f *fileSource) Read(key string) ([]byte, error) {
          	raw, err := os.ReadFile(f.path)
          	if err != nil {
          		return nil, err
          	}
          	doc := map[string]yaml.Node{}
          	if err = yaml.Unmarshal(raw, &doc); err != nil {
          		return nil, &ParseError{Name: key, Err: err}
          	}
          	n, ok := doc[key]
          	if !ok {
          		return nil, &MissingError{Key: key, Path: f.path}
          	}
          	return yaml.Marshal(&n)
          }

          // MapSource serves blocks from memory; the tests use it.
          type MapSource map[string][]byte

          // Read returns the bytes stored under key.
          func (m MapSource) Read(key string) ([]byte, error) {
          	if v, ok := m[key]; ok {
          		return v, nil
          	}
          	return nil, &MissingError{Key: key, Path: "memory"}
          }
