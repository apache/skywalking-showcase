          package cfgblock

          import "fmt"

          // ParseError wraps a YAML failure with the block that caused it.
          type ParseError struct {
          	Err  error
          	Name string
          }

          func (e *ParseError) Error() string { return fmt.Sprintf("config %q: %v", e.Name, e.Err) }
          func (e *ParseError) Unwrap() error { return e.Err }

          // MissingError says a key is absent from a source.
          type MissingError struct {
          	Key  string
          	Path string
          }

          func (e *MissingError) Error() string {
