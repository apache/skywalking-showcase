      - path: banyand/liaison/pkg/srvconf/srvconf.go
        before: |
          package srvconf

          import (
          	"os"
          	"time"

          	"github.com/fsnotify/fsnotify"
          	"gopkg.in/yaml.v3"
          )

          // Config is liaison's copy of the shared block.
          type Config struct {
          	Name     string        `yaml:"name"`
          	Endpoint string        `yaml:"endpoint"`
          	Timeout  time.Duration `yaml:"timeout"`
          	Retries  int           `yaml:"retries"`
          }

          // Parse reads the liaison.<name> block from path.
          func Parse(path, name string) (*Config, error) {
          	raw, err := os.ReadFile(path)
          	if err != nil {
          		return nil, err
          	}
          	doc := map[string]*Config{}
          	if err = yaml.Unmarshal(raw, &doc); err != nil {
          		return nil, err
          	}
          	c, ok := doc["liaison."+name]
          	if !ok {
          		return nil, os.ErrNotExist
          	}
          	if c.Timeout == 0 {
          		c.Timeout = 20 * time.Second
          	}
          	return c, nil
          }

          // Watch calls f with a freshly parsed block each time path changes.
          func Watch(path, name string, f func(*Config)) {
          	w, err := fsnotify.NewWatcher()
          	if err != nil {
          		return
          	}
          	go func() {
          		for range w.Events {
          			if c, perr := Parse(path, name); perr == nil {
          				f(c)
          			}
          		}
          	}()
          	_ = w.Add(path)
          }
