- call:
    thinking: "Loader first, source behind an interface so the tests need no files."
    text: "Writing the loader."
    tool:
      name: Write
      input:
        file_path: pkg/cfgblock/loader.go
        content: &w_loader |
          package cfgblock

          import (
          	"fmt"
          	"os"
          	"sync"
          	"time"

          	"gopkg.in/yaml.v3"
          )

          // Block is the shape every module used to parse on its own.
          type Block struct {
          	Extra    map[string]string `yaml:"extra"`
          	Name     string            `yaml:"name"`
          	Endpoint string            `yaml:"endpoint"`
          	Timeout  time.Duration     `yaml:"timeout"`
          	Retries  int               `yaml:"retries"`
          }

          // Loader resolves one Block from a Source and memoises it.
          type Loader struct {
          	src     Source
          	cache   map[string]*Block
          	prefix  string
          	watches []func(*Block)
          	mu      sync.RWMutex
          }

          // New returns a Loader reading src under the given key prefix.
          func New(src Source, prefix string) *Loader {
          	return &Loader{src: src, prefix: prefix, cache: map[string]*Block{}}
          }

          // Load resolves the named block, applying defaults and validation.
          func (l *Loader) Load(name string) (*Block, error) {
          	l.mu.RLock()
          	b, ok := l.cache[name]
          	l.mu.RUnlock()
          	if ok {
          		return b, nil
          	}
          	raw, err := l.src.Read(l.key(name))
          	if err != nil {
          		return nil, err
          	}
          	b = &Block{}
          	if err = yaml.Unmarshal(raw, b); err != nil {
          		return nil, &ParseError{Name: name, Err: err}
          	}
          	applyDefaults(b)
          	if err = Validate(b); err != nil {
          		return nil, err
          	}
          	l.mu.Lock()
          	l.cache[name] = b
          	l.mu.Unlock()
          	return b, nil
          }

          func (l *Loader) key(name string) string {
          	if l.prefix == "" {
          		return name
          	}
          	return l.prefix + "." + name
          }

          // FromFile returns a Loader over the YAML file at path.
          func FromFile(path, prefix string) (*Loader, error) {
          	if _, err := os.Stat(path); err != nil {
          		return nil, fmt.Errorf("config file %s: %w", path, err)
          	}
          	return New(&fileSource{path: path}, prefix), nil
          }

          // LoadFile is FromFile then Load, for a caller that never reloads.
          func LoadFile(path, prefix, name string) (*Block, error) {
          	l, err := FromFile(path, prefix)
          	if err != nil {
          		return nil, err
          	}
          	return l.Load(name)
          }
      result: "written, 83 lines"
      changes:
      - path: pkg/cfgblock/loader.go
        after: *w_loader
