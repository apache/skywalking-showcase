- call:
    text: "Reload, OnChange, and a WatchFile that drives Reload from fsnotify, in their own file."
    tool:
      name: Write
      input:
        file_path: pkg/cfgblock/watch.go
        content: &w_watch |
          package cfgblock

          import "github.com/fsnotify/fsnotify"

          // Reload drops the memoised block, re-reads it and notifies watchers.
          func (l *Loader) Reload(name string) (*Block, error) {
          	l.mu.Lock()
          	delete(l.cache, name)
          	l.mu.Unlock()
          	b, err := l.Load(name)
          	if err != nil {
          		return nil, err
          	}
          	l.mu.RLock()
          	watches := append([]func(*Block){}, l.watches...)
          	l.mu.RUnlock()
          	for _, w := range watches {
          		w(b)
          	}
          	return b, nil
          }

          // OnChange registers a watcher fired on every successful Reload.
          func (l *Loader) OnChange(f func(*Block)) {
          	l.mu.Lock()
          	l.watches = append(l.watches, f)
          	l.mu.Unlock()
          }

          // WatchFile calls Reload(name) on every event for path, as srvconf.Watch did.
          func (l *Loader) WatchFile(path, name string) error {
          	w, err := fsnotify.NewWatcher()
          	if err != nil {
          		return err
          	}
          	go func() {
          		for range w.Events {
          			_, _ = l.Reload(name)
          		}
          	}()
          	return w.Add(path)
          }
