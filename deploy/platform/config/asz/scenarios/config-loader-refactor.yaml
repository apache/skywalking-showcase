- input: "Typed errors, not fmt.Errorf strings."
- call:
    text: "Three error types, all unwrappable. FromFile keeps one %w wrap around the os error, which errors.Is still sees through."
    tool:
      name: Write
      input:
        file_path: pkg/cfgblock/errors.go
        content: &w_errors |
          package cfgblock

          import "fmt"

          // ParseError wraps a YAML failure with the block that caused it.
          type ParseError struct {
          	Err  error
          	Name string
          }

          func (e *ParseError) Error() string { return fmt.Sprintf("config %q: %v", e.Name, e.Err) }
          func (e *ParseError) Unwrap() error { return e.Err }

          // MissingError says a key is absent from a source.
          type MissingError struct {
          	Key  string
          	Path string
          }

          func (e *MissingError) Error() string {
          	return fmt.Sprintf("config key %q not found in %s", e.Key, e.Path)
          }

          // InvalidError is a failed validation rule.
          type InvalidError struct {
          	Field  string
          	Reason string
          }

          func (e *InvalidError) Error() string {
          	return fmt.Sprintf("config field %s %s", e.Field, e.Reason)
          }
      result: "written, 32 lines"
