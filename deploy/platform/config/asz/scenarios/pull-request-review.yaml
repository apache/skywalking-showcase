      usage: {in: 7400, out: 200, cache_read: 26000}
  - call: {text: "Four areas: the BanyanDB plugin (19 files, two of them unit tests), the GraphQL query plugin (9), server-core (9: seven query services and two analysis classes for the new column), and a new end-to-end case (2 files). The docs are two one-line edits.", usage: {in: 7900, out: 340, cache_read: 27000}}
  - input: "Show me the storage plugin part."
  - call:
