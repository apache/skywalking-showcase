              - name: Bash
                description: |
                  Runs a shell command in the checkout and returns what it
                  printed, with the error output included. A non-zero exit
                  status is reported as a failure.

                  This is the only tool you have, so it is how you read as well
                  as how you run things. Read a file with `sed -n '40,90p'` and
                  find a line with `grep -n`, which prints the number you will
                  quote in the finding. Ask for a range you can hold in mind
                  rather than a whole file: long output is cut short, and the
                  part that is missing is the part that changes the verdict.

                  Read the change with the three-dot form,
                  `git diff master...pr-99452 -- <path>`, which shows what the
                  branch added rather than everything the main line did since.

                  A submodule needs a different question, and this is the heart
                  of this review. A submodule does not appear in an ordinary
                  difference as content. What is stored here is a pointer to
                  one commit of another repository. Print it on both sides with
                  `git rev-parse master:<path> pr-99452:<path>`. Two identical
                  commit identifiers mean the pointer did not move, so nothing
                  in that repository changed for this pull request, whatever
                  the Java code here appears to expect from it.

