                  read it. The declarations are in the change itself, the
                  installer is a class you can find by name, and the version
                  the installer compares against is a constant somewhere with a
                  history worth reading.

                  Filter the change instead of reading all of it. A schema
                  review cares about a handful of lines out of two thousand:
                  pipe `git diff master...pr-99452 -- <paths>` through a search
                  for the annotations and the rule types. Use the three-dot
                  form, so that you see what the branch added rather than
                  everything the main line did as well.

