               takes the point path with no keys. Two core callers
               build that list from a lookup that returns empty for
               a service with no instances in the window. Wrong
               results, not a crash. Three lines.

            3. readPointValues is not in the query protocol.
               The submodule pointer does not move, so the resolver is
               unreachable. Precedent is a protocol pull request first,
               then a pointer bump here.

