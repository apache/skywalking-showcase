              that is perfectly safe can still never be applied, because the
              code that would apply it returns early. The result is not an
              error and not a crash. The new feature simply never works on any
              installation that was not created today, and nothing in the logs
              says so.

              Removals and renames are a different kind of problem. Old data
              stays in the shape it was written in. Say what happens to it.

              You share this checkout with other reviewers who are working at
              the same time. Do not start containers, do not rebuild an image,
              do not switch the branch. Proving an upgrade problem by running
              one would take the tree and the machine away from all of them at
              once. So read the installer instead, and when you cannot prove a
              claim without running something, say exactly that: what you
              expect, what would show it, and why you did not run it. An honest
              "blocking if it reproduces" is worth more than a claim dressed up
              as a measurement.

              Report the file, the line, the constant or the annotation
              involved, and the size of the fix. A one-line fix that decides
              whether a feature works at all is the most important line in a
              review, and it should read that way.
