# A multi-agent review of a large incoming pull request: a short parent,
# four reviewers dispatched together in one workflow batch, and almost no
# writes -- the only file the session leaves behind is its review notes.
session: 7e1c0000-0000-4a00-8a00-000000000012
project: -Users-dev-oap-review
title: review the storage-plugin pull request
interval: 10s
steps:
  - input: "A contributor has opened a pull request touching the BanyanDB storage plugin and the query layer. Review it for correctness and for anything that duplicates code we already have, and tell me what actually needs changing before merge."
  - system: {subtype: model_change, fields: {content: "model set to the review profile: read-only tools, no writes without asking"}}
  - call:
      thinking: unavailable
      text: "Pulling the pull request down first."
      tool:
        name: Bash
        input: {command: "gh pr view 99452 --json title,author,additions,deletions,changedFiles,body", description: "Read the pull request metadata"}
