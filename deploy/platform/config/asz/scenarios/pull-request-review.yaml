                  type: object
                  properties:
                    command:
                      type: string
                      description: "The command to run, from the root of the checkout."
                    description:
                      type: string
                      description: "What this command is for, in a few plain words."
                    timeout:
                      type: integer
                      description: "Milliseconds to wait. A module's tests take minutes."
