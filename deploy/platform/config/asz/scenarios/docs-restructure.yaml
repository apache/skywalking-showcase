  with open(path, encoding='utf-8') as f:\n        return FENCE.sub('', f.read())\n\n\ndef ids(path):\n    body, seen, out = text(path), {}, []\n    for heading in HEADING.findall(body):\n        slug = re.sub(r'[^\\w\\- ]', '', heading.lower()).replace(' ', '-')\n        n = seen.get(slug, 0)\n        seen[slug] = n + 1\n        out.append(slug if n == 0 else f'{slug}-{n}')\n    return out + EXPLICIT.findall(body)\n\n\ndef pages(paths):\n    seen = set()\n    for path in paths:\n        found = [path] if os.path.isfile(path) else [\n            os.path.join(top, name)\n            for top, _, names in os.walk(path)\n            for name in sorted(names) if name.endswith('.md')]\n        for src in found:\n            if src not in seen:\n                seen.add(src)\n                yield src\n\n\ndef check(paths):\n    bad = 0\n    for src in pages(paths):\n        top = os.path.dirname(src)\n        own = ids(src)\n        for dup in sorted({i for i in own if own.count(i) > 1}):\n            print(f'duplicate id: {src} #{dup}')\n            bad = 1\n        for m in LINK.finditer(text(src)):\n            target = m.group(1) or m.group(2)\n            if re.match(r'[a-z][a-z0-9+.-]*:', target):\n                continue\n            file, _, frag = target.partition('#')\n            path = os.path.normpath(os.path.join(top, file)) if file else src\n            if not os.path.exists(path):\n                print(f'missing file: {src} -> {target}')\n                bad = 1\n            elif frag and (os.path.isdir(path) or frag not in ids(path)):\n                print(f'missing anchor: {src} -> {target}')\n                bad = 1\n    return bad\n\n\nif __name__ == '__main__':\n    sys.exit(check(sys.argv[1:] or ['docs']))\n"}, result: "Created check-doc-links.py (91 lines).", changes: [{path: tools/check-doc-links.py, after: *chk1}]}, usage: {in: 10628, out: 640, cache_read: 51661}}
