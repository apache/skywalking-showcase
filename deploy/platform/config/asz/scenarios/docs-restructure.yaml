200 | SW_STORAGE_ES_CLUSTER_NODES |\n| user | | SW_ES_USER |\n| password | | SW_ES_PASSWORD |\n| indexShardsNumber | 1 | SW_STORAGE_ES_INDEX_SHARDS_NUMBER |\n| flushInterval | 5 | SW_STORAGE_ES_FLUSH_INTERVAL |\n\n## Storage: PostgreSQL\n\n| Name | Default | Environment Variable |\n|---|---|---|\n| jdbcUrl | jdbc:postgresql://localhost:5432/skywalking | SW_JDBC_URL |\n| dataSource.user | postgres | SW_DATA_SOURCE_USER |\n| maxSizeOfBatchSql | 2000 | SW_STORAGE_MAX_SIZE_OF_BATCH_SQL |\n| asyncBatchPersistentPoolSize | 4 | SW_STORAGE_ASYNC_BATCH_PERSISTENT_POOL_SIZE |\n| dataSource.password | | SW_DATA_SOURCE_PASSWORD |\n\n## Storage: H2\n\n| Name | Default | Environment Variable |\n|---|---|---|\n| url | jdbc:h2:mem:skywalking-oap-db | SW_STORAGE_H2_URL |\n| user | sa | SW_STORAGE_H2_USER |\n| password | | SW_STORAGE_H2_PASSWORD |\n\n## Storage: InfluxDB\n\n| Name | Default | Environment Variable |\n|---|---|---|\n| url | http://localhost:8086 | SW_STORAGE_INFLUXDB_URL |\n| database | skywalking | SW_STORAGE_INFLUXDB_DATABASE |\n| batchEnabled | true | SW_STORAGE_INFLUXDB_BATCH_ENABLED |\n| fetchTaskLogMaxSize | 5000 | SW_STORAGE_INFLUXDB_FETCH_TASK_LOG_MAX_SIZE |\n\n## Receiver: trace\n\n| Name | Default | Environment Variable |\n|---|---|---|\n| traceSamplingPolicySettingsFile | trace-sampling-policy-settings.yml | SW_TRACE_SAMPLING_POLICY_SETTINGS_FILE |\n| slowDBAccessThreshold | default:200 | SW_SLOW_DB_THRESHOLD |\n| forceSampleErrorSegment | true | SW_FORCE_SAMPLE_ERROR_SEGMENT |\n| sampleRate | 10000 | SW_RECEIVER_TRACE_SAMPLE_RATE |\n\n## Receiver: OpenTelemetry\n\n| Name | Default | Environment Variable |\n|---|---|---|\n| enabledHandlers | otlp-traces,otlp-metrics,otlp-logs | SW_OTEL_RECEIVER_ENABLED_HANDLERS |\n| enabledOtelMetricsRules | about thirty rule sets | SW_OTEL_RECEIVER_ENABLED_OTEL_METRICS_RULES |\n\n## Receiver: log\n\n| Name | Default | Environment Variable |\n|---|---|---|\n| lalFiles | eleven bundled scripts, ending with default | SW_LOG_LA