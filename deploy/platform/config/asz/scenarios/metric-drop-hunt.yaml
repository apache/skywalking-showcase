  - call: {text: "Twelve entities before 08:12, eleven after, in a segment no lifecycle stage has touched. The store never got the twelfth. Hypothesis two is disproved; the drop is on the write side.", usage: {in: 10100, out: 300, cache_read: 21900}}
  - input: "Good. That is one thing I can stop worrying about."
