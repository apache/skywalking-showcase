session: 7e1c0000-0000-4a00-8a00-000000000011
project: -Users-dev-oap-drop
title: metrics missing after a receiver restart
interval: 10s
steps:
  - input: "The service_resp_time metric stops appearing about ten minutes after the OAP restarts, but only for one service, shop::cart-service. Nothing in the logs. Can you work out where it is being dropped?"
  - call:
      thinking: unavailable
      text: "First, is it missing from storage or only from the query? Checking what the query layer returns."
      tool: {name: Bash, input: {command: "swctl --display json metrics linear --name service_resp_time --service-name 'shop::cart-service' --start '2026-09-10 0800' --end '2026-09-10 0859'"}, result: "60 buckets; IsEmptyValue is true in every one from 0812 on"}
      usage: {in: 6100, out: 190, cache_read: 19000, cache_write: 3300}
  - call: {text: "The same window for a healthy service, as a control.", tool: {name: Bash, input: {command: "swctl --display json metrics linear --name service_resp_time --service-name order-service --start '2026-09-10 0800' --end '2026-09-10 0859'"}, result: "60 buckets, all with values, 180 to 340"}, usage: {in: 6300, out: 120, cache_read: 20000}}
  - call: {text: "The query path works; one service has no data after 08:12. Always the same one?", usage: {in: 6600, out: 210, cache_read: 20500}}
  - input: "Always the same one. The other eleven keep reporting."
  - call: {text: "That rules out anything global. Checking the OAL that defines the metric.", tool: {name: Bash, input: {command: "grep -rn 'service_resp_time' oap-server/server-starter/src/main/resources/oal"}, result: "oap-server/server-starter/src/main/resources/oal/core.oal:20:service_resp_time = from(Service.latency).longAvg().decorator(\"ServiceDecorator\");"}, usage: {in: 6900, out: 170, cache_read: 21200}}
  - call: {text: "One definition, no filter, only a decorator. Nothing there singles out a service.", usage: {in: 7100, out: 150, cache_read: 21800}}
  - input: "Right. And restarting brings it back, but only for about ten minutes."
  - call: {text: "Ten minutes is suspiciously round. Looking for anything in core that expires.", tool: {name: Bash, input: {command: "grep -rn 'expireAfter' oap-server/server-core/src/main/java --include='*.java'"}, result: "5 hits: expireAfterWrite of one minute in the three profiling task caches, and of ten minutes in EndpointNameGrouping and WriteSessionCache"}, usage: {in: 7400, out: 200, cache_read: 22600}}
  - call: {text: "Two ten-minute caches. A miss normally means a reload, not a drop. Seeing what each holds.", tool: {name: Bash, input: {command: "git grep -n -A2 'expireAfterWrite(Duration.ofMinutes(10))\\|expireAfterWrite(10' -- '*/EndpointNameGrouping.java' '*/WriteSessionCache.java'"}, result: "EndpointNameGrouping: unformatted HTTP URIs per service, behind a CacheLoader; WriteSessionCache: a plain map, no loader"}, usage: {in: 7700, out: 230, cache_read: 23400}}
  - call: {text: "Two candidates. I will walk the pipeline backwards from storage and let the evidence choose.", usage: {in: 8000, out: 160, cache_read: 24000}}
  - input: "Fine, but be systematic. I have been guessing at this for two days."
  - call:
      text: "Understood. Writing the pipeline down so we can cross stages off."
      tool: {name: TodoWrite, input: {todos: [{content: "confirm rows are absent in storage, not just in query", status: in_progress}, {content: "check the OAL dispatcher", status: pending}, {content: "check L1 aggregation", status: pending}, {content: "check L2 persistence and the session cache", status: pending}, {content: "check the storage DAO write path", status: pending}]}, result: "5 todos recorded"}
      usage: {in: 8300, out: 320, cache_read: 24800}
  - call: {text: "Stage one: absent, or stored under an id the query does not match? Counting minute rows per entity for the hour.", tool: {name: Bash, input: {command: "bydbctl measure query --start 2026-09-10T08:00:00Z --end 2026-09-10T09:00:00Z -f - <<< '{name: service_resp_time_minute, groups: [sw_metricsMinute], tagProjection: {tagFamilies: [{name: storage-only, tags: [entity_id]}]}, limit: 1000}' | yq '.dataPoints[].tagFamilies[0].tags[0].value.str.value' | sort | uniq -c | sed 's/^ *//'"}, result: "12 lines: 60 rows for each of eleven entity ids, 12 rows for c2hvcDo6Y2FydC1zZXJ2aWNl.1"}, usage: {in: 8600, out: 240, cache_read: 25500}}
  - call: {text: "Genuinely absent: twelve minute rows for that entity, then nothing. The drop is upstream of the write.", usage: {in: 8800, out: 140, cache_read: 26000}}
  - input: "Could the agent just have stopped sending?"
  - call: {text: "Worth eliminating first. Looking for traces from it after the metric stopped.", tool: {name: Bash, input: {command: "swctl --display json trace ls --service-name 'shop::cart-service' --start '2026-09-10 0820' --end '2026-09-10 0830' | jq '.traces | length'"}, result: "15"}, usage: {in: 9100, out: 160, cache_read: 26700}}
  - call: {text: "A full page of fifteen, as many as trace ls returns at once. The agent still reports after 08:12; only the aggregated metric disappears.", usage: {in: 9300, out: 230, cache_read: 27200}}
  - input: "That is what I thought. So it is inside the OAP."
  - call: {text: "Yes. Next stage: the dispatcher OAL generates for that metric.", tool: {name: Bash, input: {command: "find oap-server -name 'ServiceDispatcher*.java'"}, result: "(no output)"}, usage: {in: 9600, out: 150, cache_read: 27900}}
  - call: {text: "No source for it. Checking how OAL produces its classes.", tool: {name: Bash, input: {command: "grep -rln 'javassist.ClassPool' oap-server/oal-rt/src/main/java"}, result: "oap-server/oal-rt/src/main/java/org/apache/skywalking/oal/v2/generator/OALClassGeneratorV2.java"}, usage: {in: 9800, out: 170, cache_read: 28400}}
  - call: {text: "The dispatchers are generated in memory with Javassist at boot, from FreeMarker templates. The template is the next best thing to a source.", usage: {in: 10000, out: 140, cache_read: 28900}}
  - input: "There is a distribution built in ../oap-build if that helps."
  - call: {text: "It will for the loaded script. For the dispatcher, the template is what counts.", tool: {name: Bash, input: {command: "ls oap-server/oal-rt/src/main/resources/code-templates-v2/dispatcher"}, result: "dispatch.ftl\ndoMetrics.ftl\ndoMetricsWithDebug.ftl"}, usage: {in: 10300, out: 130, cache_read: 29600}}
  - call: {text: "Reading the per-metric method.", tool: {name: Read, input: {file_path: "oap-server/oal-rt/src/main/resources/code-templates-v2/dispatcher/doMetrics.ftl"}, result: "33 lines"}, usage: {in: 10600, out: 150, cache_read: 30300}}
  - call: {text: "doMetrics applies the OAL filters, builds the metrics object, copies the source fields including the entity id, and hands it to MetricsStreamProcessor. With no filter on service_resp_time, nothing here picks out one service.", usage: {in: 10900, out: 250, cache_read: 31000}}
  - input: "What about the OAL engine itself? It reads the script at startup."
  - call: {text: "Once, to generate classes. A per-service drop ten minutes in cannot come from a one-off parse.", usage: {in: 11100, out: 190, cache_read: 31600}}
  - input: "Humour me and check that the script it actually loaded matches the file."
  - call: {text: "Fair. Comparing the script the distribution ships in config/oal with the source one.", tool: {name: Bash, input: {command: "tar -xOzf ../oap-build/dist/apache-skywalking-apm-bin.tar.gz apache-skywalking-apm-bin/config/oal/core.oal | diff - oap-server/server-starter/src/main/resources/oal/core.oal"}, result: "(no output)"}, usage: {in: 11400, out: 180, cache_read: 32300}}
  - call: {text: "Identical. The loaded script is the one on disk.", usage: {in: 11600, out: 110, cache_read: 32800}}
  - input: "Alright. Next."
  - call: {text: "MAL next: meter rules can produce service metrics too and could shadow the OAL one.", tool: {name: Bash, input: {command: "grep -rln 'service_resp_time' oap-server/server-starter/src/main/resources/"}, result: "2 files: alarm-settings.yml and oal/core.oal"}, usage: {in: 11900, out: 170, cache_read: 33500}}
  - call: {text: "The alarm rules only read it, and no MAL rule produces it. No second writer.", usage: {in: 12100, out: 130, cache_read: 34000}}
  - input: "Could a meter rule be deleting it?"
  - call: {text: "MAL only emits. Checking anyway for anything that removes stored data.", tool: {name: Bash, input: {command: "grep -rn 'deleteHistory\\|delete(' oap-server/server-core/src/main/java/org/apache/skywalking/oap/server/core/storage --include='*.java'"}, result: "4 hits: the TTL keeper and its history-delete DAO, and the runtime-rule management delete"}, usage: {in: 12400, out: 220, cache_read: 34800}}
  - call: {text: "Only the TTL keeper deletes metric rows, by time bucket, never by service. The other hit removes runtime rules. Parking that.", usage: {in: 12600, out: 180, cache_read: 35300}}
  - input: "Hold on. Is cart-service special in any way? Different agent version?"
  - call: {text: "Checking what its instances report.", tool: {name: Bash, input: {command: "swctl --display json instance ls --service-name 'shop::cart-service' | jq '.[].attributes'"}, result: "3 instances, the same agent build as the other eleven"}, usage: {in: 12900, out: 160, cache_read: 36100}}
  - call: {text: "Same agent as the healthy eleven. Not the agent.", usage: {in: 13100, out: 120, cache_read: 36600}}
  - input: "What is different about it then? It is the only one we deploy with a service group, if that matters."
  - call:
      thinking: unavailable
      text: "It may. EndpointNameGrouping, one of the two ten-minute caches, keys by service name, and a group prefix is exactly what it would see differently. Reading the cache."
      tool: {name: Bash, input: {command: "git grep -n -A6 'unformattedHttpUrisCache =' -- '*/EndpointNameGrouping.java'"}, result: "a LoadingCache from service name to its unformatted URIs, expireAfterWrite(Duration.ofMinutes(10)), loader returning an empty set"}
      usage: {in: 13500, out: 340, cache_read: 37400}
  - call: {text: "Hypothesis one: the grouped name falls through that cache in a way that costs the service its rows, and the expiry matches ten minutes.", usage: {in: 13800, out: 280, cache_read: 38000}}
  - input: "That would fit. Prove it."
  - call: {text: "Where is the cache used?", tool: {name: Bash, input: {command: "git grep -n 'unformattedHttpUrisCache' -- '*/EndpointNameGrouping.java'"}, result: "2 hits: the declaration, and getUnchecked(serviceName) inside format()"}, usage: {in: 14100, out: 130, cache_read: 38700}}
  - call: {text: "Only inside format(). Who calls that?", tool: {name: Bash, input: {command: "grep -rn 'endpointNameGrouping.format(' oap-server --include='*.java' | grep -v /test/"}, result: "1 hit: NamingControl.java:116, in formatEndpointName()"}, usage: {in: 14400, out: 200, cache_read: 39400}}
  - call: {text: "One caller, formatting endpoint names. Reading what a miss or a full cache does to the name.", tool: {name: Bash, input: {command: "git grep -n -A11 'unformattedUrisOfService =' -- '*/EndpointNameGrouping.java'"}, result: "records the URI as unformatted; past maxHttpUrisNumberPerService, 3000 by default, it returns ABANDONED_ENDPOINT_NAME instead"}, usage: {in: 14700, out: 160, cache_read: 40000}}
  - input: "So it can rename an endpoint. Can it lose a service metric?"
  - call: {text: "No. At worst an endpoint is renamed to the abandoned name; nothing there returns null or touches a Service source, and service_resp_time is service scope.", usage: {in: 15000, out: 210, cache_read: 40800}}
  - input: "Keep going, do not drop it yet."
  - call: {text: "Last thing that could matter: what an expiry costs.", tool: {name: Bash, input: {command: "git grep -n -A4 'new CacheLoader' -- '*/EndpointNameGrouping.java'"}, result: "load(service) returns ConcurrentHashMap.newKeySet()"}, usage: {in: 15600, out: 150, cache_read: 42100}}
  - call: {text: "Hypothesis one is dead. An expired entry comes back as an empty set, so expiry costs remembered URIs, never a metric, and it would hit every service with HTTP endpoints.", usage: {in: 15900, out: 300, cache_read: 42800}}
  - input: "Agreed. That is the same wall I hit yesterday."
  - call: {text: "Then one layer in, to where the metric object lives between the dispatcher and the write.", usage: {in: 16400, out: 140, cache_read: 44000}}
  - input: "Which layer is that?"
  - call: {text: "L1 aggregation, then whatever sits in front of persistence. Sizing the worker package.", tool: {name: Bash, input: {command: "cd oap-server/server-core/src/main/java/org/apache/skywalking/oap/server/core/analysis/worker && ls *.java | wc -l | sed 's/^ *//' && cat *.java | wc -l | sed 's/^ *//'"}, result: "23\n2712"}, usage: {in: 16700, out: 170, cache_read: 44600}}
  - input: "Read the aggregate worker."
  - call: {text: "Reading it.", tool: {name: Read, input: {file_path: "oap-server/server-core/src/main/java/org/apache/skywalking/oap/server/core/analysis/worker/MetricsAggregateWorker.java"}, result: "218 lines"}, usage: {in: 17000, out: 120, cache_read: 45300}}
  - call: {text: "It merges into a MergableBufferedData keyed on storage id and hands the batch on at most every l1FlushPeriod, 500 ms by default. Nothing service specific.", usage: {in: 17300, out: 200, cache_read: 45900}}
  - input: "What is the metric id made of?"
  - call: {text: "Checking.", tool: {name: Bash, input: {command: "git grep -n 'id0' -- '*/analysis/metrics/Metrics.java'"}, result: "2 hits: id() caches id0(), which every metrics class implements"}, usage: {in: 17600, out: 160, cache_read: 46600}}
  - call: {text: "The OAL template appends the time bucket, then the entity id; a service's entity id comes from IDManager.", usage: {in: 17900, out: 190, cache_read: 47200}}
  - input: "Is that stable? Base64 of the name, or of the name plus layer?"
  - call: {text: "Checking.", tool: {name: Bash, input: {command: "git grep -h -A5 'public static String buildId(String name, boolean isNormal)' -- '*/analysis/IDManager.java'"}, result: "return encode(name) + Const.SERVICE_ID_CONNECTOR + BooleanUtils.booleanToValue(isNormal);"}, usage: {in: 18200, out: 180, cache_read: 47900}}
  - call: {text: "Base64 of the full name, group included, then .1 for a normal service. No layer, stable across restarts. Not the id.", usage: {in: 18400, out: 130, cache_read: 48400}}
  - input: "Try the receiver side. Maybe the segments for that service never reach the analysis at all."
  - call: {text: "The traces argue against it, but confirming the analysis listener fires.", tool: {name: Bash, input: {command: "grep -rln 'class RPCAnalysisListener' oap-server/server-receiver-plugin/skywalking-trace-receiver-plugin/src/main/java"}, result: "(no output)"}, usage: {in: 18700, out: 200, cache_read: 49100}}
  - call: {text: "Wrong module. Locating it.", tool: {name: Bash, input: {command: "find oap-server -name 'RPCAnalysisListener.java'"}, result: "oap-server/analyzer/agent-analyzer/src/main/java/org/apache/skywalking/oap/server/analyzer/provider/trace/parser/listener/RPCAnalysisListener.java"}, usage: {in: 18900, out: 130, cache_read: 49700}}
  - call: {text: "It lives in the agent analyzer. Reading the part that emits service latency.", tool: {name: Bash, input: {command: "git grep -n 'public void parseEntry\\|public void build\\|sourceReceiver.receive' -- '*/RPCAnalysisListener.java'"}, result: "parseEntry queues one traffic builder per entry span; build() sends toService() and the instance and relation sources for each"}, usage: {in: 19200, out: 230, cache_read: 50400}}
  - input: "So it does emit. Fine."
  - call: {text: "Unconditionally, once per entry span. The source is produced.", usage: {in: 19400, out: 140, cache_read: 51000}}
  - input: "This is going nowhere. Take a different angle: what changed? It did not do this in the last release."
  - call: {text: "A better question than mine. Which two versions?", usage: {in: 19700, out: 120, cache_read: 51600}}
  - input: "It was fine on 10.98.0, it does this on 10.99.0."
  - call: {text: "Listing what touched the metrics path between the tags.", tool: {name: Bash, input: {command: "git log --oneline v10.98.0..v10.99.0 -- oap-server/server-core/src/main/java/org/apache/skywalking/oap/server/core/analysis | wc -l | sed 's/^ *//'"}, result: "31"}, usage: {in: 20000, out: 190, cache_read: 52300}}
  - call: {text: "31 in the analysis package. Narrowing to the worker package, where persistence decisions are made.", tool: {name: Bash, input: {command: "git log --oneline v10.98.0..v10.99.0 -- oap-server/server-core/src/main/java/org/apache/skywalking/oap/server/core/analysis/worker | wc -l | sed 's/^ *//'"}, result: "6"}, usage: {in: 20300, out: 170, cache_read: 53000}}
  - input: "Six is a list I can read. Show me them with the stats."
  - call: {text: "With line counts.", tool: {name: Bash, input: {command: "git log --stat --oneline v10.98.0..v10.99.0 -- oap-server/server-core/src/main/java/org/apache/skywalking/oap/server/core/analysis/worker | head -50"}, result: "6 commits; the largest adds WriteSessionCache, SessionFlushWorker and SessionWarmupTimer"}, usage: {in: 20600, out: 210, cache_read: 53700}}
  - call: {text: "One of the six puts a WriteSessionCache in front of persistence, one of the two ten-minute caches. The first thing that has lined up twice.", usage: {in: 20900, out: 260, cache_read: 54400}}
  - input: "Now we are somewhere. What does it cache?"
  - call: {text: "Reading the commit.", tool: {name: Bash, input: {command: "git show --stat $(git log --format=%H -1 --grep 'session cache' v10.98.0..v10.99.0) | tail -1 | sed 's/^ *//'"}, result: "4 files changed, 212 insertions(+), 38 deletions(-)"}, usage: {in: 21200, out: 150, cache_read: 55100}}
  - call: {text: "It opens a write session per service and lets the flush worker write a service's metrics only while it is open, to hold back rows for services not yet registered. A held-back row is exactly our bug's shape: no error, no log, no row.", usage: {in: 21500, out: 280, cache_read: 55800}}
  - input: "Show me that class."
  - call: {text: "Reading it.", tool: {name: Read, input: {file_path: "oap-server/server-core/src/main/java/org/apache/skywalking/oap/server/core/analysis/worker/WriteSessionCache.java"}, result: "47 lines"}, usage: {in: 21800, out: 110, cache_read: 56500}}
  - call: {text: "Small: an expiring map of open sessions keyed by service id, an open() that puts, and an isActive() the flush worker calls before it writes.", usage: {in: 22000, out: 210, cache_read: 57100}}
  - input: "Before it writes? So if isActive says no, nothing is written at all?"
  - call: {text: "That is what the caller does. Confirming.", tool: {name: Bash, input: {command: "git grep -n -B2 -A3 'isActive' -- '*/SessionFlushWorker.java'"}, result: "1 call site, inside prepareBatch, a continue when false"}, usage: {in: 22300, out: 180, cache_read: 57800}}
  - call: {text: "A continue with no log and no counter. A service-scope metric that fails isActive vanishes without trace, which matches every symptom.", usage: {in: 22600, out: 240, cache_read: 58400}}
  - input: "Then why would it fail for one service?"
  - call: {text: "That I cannot answer yet. The check looks harmless.", usage: {in: 22800, out: 130, cache_read: 59000}}
  - input: "Do not skip past it. What exactly does the check look at?"
  - call: {text: "Reading it.", tool: {name: Bash, input: {command: "git grep -h -A2 'boolean isActive' -- '*/WriteSessionCache.java'"}, result: "public boolean isActive(String serviceId) { return sessions.containsKey(serviceId); }"}, usage: {in: 23100, out: 200, cache_read: 59700}}
  - call: {text: "A plain lookup by service id. So the real question is why the key would be missing for one service.", usage: {in: 23400, out: 180, cache_read: 60300}}
  - input: "Missing? It is a ten minute cache. It would go missing for every service, not one."
  - call: {text: "Unless something keeps re-opening eleven of them. A session exists only while something opens it.", usage: {in: 23700, out: 240, cache_read: 61000}}
  - input: "So who opens them?"
  - call: {text: "That is what I need to establish before I believe any of this.", usage: {in: 23900, out: 150, cache_read: 61600}}
  - reset: {summary: "Why service_resp_time stops for shop::cart-service ten minutes after an OAP restart. Ruled out: query path, OAL script and dispatcher template, MAL, trace analysis, the agent, TTL deletes, EndpointNameGrouping's ten-minute cache. Lead: SessionFlushWorker.prepareBatch drops a service-scope metric with a bare continue when WriteSessionCache.isActive(serviceId) is false; sessions expire after ten minutes. Next: who opens sessions, and why one would be missing."}
  - input: "Right, who opens the sessions?"
  - call: {text: "Every caller of open().", tool: {name: Bash, input: {command: "grep -rn 'sessionCache.open(' oap-server/server-core/src/main/java --include='*.java'"}, result: "2 hits, both in SessionWarmupTimer.java"}, usage: {in: 7200, out: 130, cache_read: 15000, cache_write: 3000}}
  - call: {text: "Only the warm-up timer. When does it run?", tool: {name: Bash, input: {command: "git grep -n 'void start\\|void warm\\|schedule' -- '*/SessionWarmupTimer.java'"}, result: "line 34, start(); line 39, scheduleWithFixedDelay(this::warm, 10, 10, TimeUnit.SECONDS); line 42, warm()"}, usage: {in: 7500, out: 170, cache_read: 15800}}
  - input: "So every persisted service gets a session at boot?"
  - call: {text: "start() opens one per persisted ServiceTraffic row. Checking cart-service is persisted, so start() would see it.", tool: {name: Bash, input: {command: "swctl --display json service ls | jq '.[] | select(.name == \"shop::cart-service\") | .group'"}, result: "\"shop\""}, usage: {in: 7800, out: 160, cache_read: 16400}}
  - call: {text: "Persisted, in group shop, so start() opens its session at every boot. That would explain the good ten minutes after each restart.", usage: {in: 8100, out: 210, cache_read: 17100}}
  - input: "And after that?"
