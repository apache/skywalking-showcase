            package org.apache.skywalking.oap.server.core.analysis.worker;

            import java.util.ArrayList;
            import java.util.Collection;
            import java.util.List;
            import lombok.extern.slf4j.Slf4j;
            import org.apache.skywalking.oap.server.core.analysis.metrics.Metrics;
            import org.apache.skywalking.oap.server.core.analysis.metrics.MetricsMetaInfo;
            import org.apache.skywalking.oap.server.core.analysis.metrics.WithMetadata;
            import org.apache.skywalking.oap.server.core.source.DefaultScopeDefine;
            import org.apache.skywalking.oap.server.core.worker.AbstractWorker;
            import org.apache.skywalking.oap.server.library.module.ModuleDefineHolder;
            import org.apache.skywalking.oap.server.telemetry.TelemetryModule;
            import org.apache.skywalking.oap.server.telemetry.api.CounterMetrics;
            import org.apache.skywalking.oap.server.telemetry.api.MetricsCreator;
            import org.apache.skywalking.oap.server.telemetry.api.MetricsTag;

            @Slf4j
            public class SessionFlushWorker extends AbstractWorker<Metrics> {
                private final WriteSessionCache sessionCache;
                private final AbstractWorker<Metrics> nextWorker;
                private final CounterMetrics reopened;
                private final List<Metrics> buffer = new ArrayList<>();

                SessionFlushWorker(ModuleDefineHolder moduleDefineHolder, WriteSessionCache sessionCache,
                                   AbstractWorker<Metrics> nextWorker) {
                    super(moduleDefineHolder);
                    this.sessionCache = sessionCache;
                    this.nextWorker = nextWorker;
                    MetricsCreator metricsCreator = moduleDefineHolder.find(TelemetryModule.NAME)
                                                                      .provider()
                                                                      .getService(MetricsCreator.class);
                    this.reopened = metricsCreator.createCounter(
                        "write_session_reopened", "The number of write sessions re-opened by the flush worker.",
                        MetricsTag.EMPTY_KEY, MetricsTag.EMPTY_VALUE);
                }

                @Override
                public synchronized void in(Metrics metrics) {
                    buffer.add(metrics);
                }

                synchronized void flush() {
                    prepareBatch(buffer);
                    buffer.clear();
                }

                void prepareBatch(Collection<Metrics> batch) {
                    for (Metrics metrics : batch) {
                        String serviceId = serviceIdOf(metrics);
                        if (serviceId != null && !sessionCache.isActive(serviceId)) {
                            log.debug("no write session for {}, re-opening it", serviceId);
                            sessionCache.open(serviceId);
                            reopened.inc();
                        }
                        nextWorker.in(metrics);
                    }
                }

                private static String serviceIdOf(Metrics metrics) {
                    if (!(metrics instanceof WithMetadata)) {
                        return null;
                    }
                    MetricsMetaInfo meta = ((WithMetadata) metrics).getMeta();
                    return meta.getScope() == DefaultScopeDefine.SERVICE ? meta.getId() : null;
                }
            }
