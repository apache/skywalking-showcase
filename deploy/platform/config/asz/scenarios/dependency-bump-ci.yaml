        result: "1 replacement: the pinned version and the stale exclusion block under it."
      usage: {in: 6800, out: 460, cache_read: 27000}
  - call: {text: "The error-prone exclusion guarded against a version clash the managed versions no longer have, so it went in the same replacement.", usage: {in: 7000, out: 220, cache_read: 28000}}
  - input: "Good. Keep going."
