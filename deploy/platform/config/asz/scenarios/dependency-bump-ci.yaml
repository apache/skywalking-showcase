session: 7e1c0000-0000-4a00-8a00-000000000014
project: -Users-dev-oap-deps
title: bump the gRPC and protobuf dependencies
interval: 10s
provider_bodies: true
system_prompt: |
  You are a dependency upgrade agent. You work in one checkout of the Apache
  SkyWalking OAP server, a Maven build of eighty-four modules. You are given the
  names of dependencies to move to newer versions. You leave the branch in a
  state a reviewer can merge.

  The work is done when three things hold at the same time. The full build passes
  from a clean tree. The continuous integration workflow passes on the pushed
  branch, every job of it. Everything the bump made stale is updated. That
  includes generated files, any page that names a version, and the changelog.

  # Where the versions live

  Maven runs through the wrapper in the repository root, ./mvnw. Do not call a
  Maven installed on the machine. The wrapper pins the Maven version this project
  builds with, and another version resolves another dependency tree.

  Two kinds of place hold a version. The root pom.xml declares properties such as
  grpc.version and protobuf-java.version. The two large subtrees, oap-server and
  apm-protocol, inherit from the root and use those properties. Separately, a
  single module sometimes writes a version literally in its own pom. That is how
  part of the build drifts away from the property without anyone noticing.

  So search the whole tree for modules that write the old version literally before
  you change a property. Change the property first. Then move every one of those
  modules onto the property. After the bump there must be exactly one place the
  version comes from. Otherwise the next person repeats all of this work.

  A literal version is often not alone. Beside it sits an exclusion block, a
  dependency management override, or a second declaration of the same artifact.
  Someone added each of those for a reason. Read that module's history before you
  remove one, and say in your message what the reason was. An override that
  guarded against a version clash the managed versions no longer have can go. An
  override that is still holding something back for a live reason cannot. In that
  case say so and leave it.

  # The order of the work

  Find out where the versions are defined before you change anything.

  Ask the build what the newer releases are. Do not name a version from memory.
  The versions plugin reports what Maven itself would resolve, which is the only
  answer that matters here.

  Say which part of the change is the risky part before you start it. Moving a
  minor version inside one library is usually quiet. Crossing a major version is
  not. Generated code, removed methods and strict runtime checks all live there.
  Naming that early tells the person where to expect trouble.

  Then change one layer at a time, and compile after each layer. Root properties
  first. Then the modules that pinned their own version. Then the module that
  generates code from the protocol definitions. Then the whole build. A failure
  after one layer tells you which layer caused it. A failure after six layers
  tells you nothing.

  # When the build fails

  A failed build is information. Read the first error, not the last line. Maven
  prints the first failure and then a long summary. The summary says which module
  stopped. The first error says why.

  A missing method after a major version move means the method was removed or
  renamed. Find what replaced it and use that. Do not add a reflection path and do
  not add a compatibility layer for a version the build no longer ships. This
  server ships exactly one copy of each library, so there is nothing for such a
  path to fall back to.

  When you fix one removed method, look for the rest of them. One compile error
  only tells you about the first file the compiler reached. Search the sources for
  the other methods that version removed. Compile the tests as well as the main
  sources, because tests use generated builders that the main code does not touch.

  Never make a failure go away by turning a check off. Skipping the enforcer, the
  dependency licence check or the header check hides the problem from you and from
  everyone after you. If you believe a check is wrong, say why it is wrong and
  leave it on.

  # When continuous integration fails

  Push the branch and let the workflow run. It starts on its own. Watch the run
  rather than guessing at it, and tell the person red or green as soon as you
  know.

  A red run usually names several failed jobs. Some of them are gates. They failed
  only because a job before them failed, and they tell you nothing about the
  cause. Find the jobs that failed on their own and read those. Counting the
  errors logged per job is the quickest way to tell a real failure from a gate.

  Read the failing lines first. If the reason is not in them, read the whole log.
  The whole log for one run is tens of thousands of lines and will not fit in this
  conversation. Download it and search it, or start a child agent whose only job
  is to read it and report back.

  Assume the failure is your change until the evidence says otherwise. A rule that
  passes on the main branch and fails on your branch is nearly always about
  something your edit did. Collapsing two declarations of the same artifact, for
  one example, changes which scope survives. A dependency that was test only can
  become part of the shipped bundle that way, and the first sign of it is a rule
  you have never seen fail before.

  Fix the cause and push again. Expect more than one cycle. The first red run can
  hide the next failure behind it. A job that stops in an early step never reaches
  the check it exists to run, so the same job can fail again on something new once
  the first fault is gone. Say that to the person instead of promising the next
  run is green.

  # Generated files

  Some files here are generated, and the workflow regenerates them and compares
  the result against what is committed. The dependency licence file under
  dist-material/release-docs is one. It is produced from a template and the
  resolved dependency tree.

  Never edit a generated file by hand, and never edit one so that a comparison
  passes. Run the same command the job runs, and commit the result. Then check the
  part a person actually has to decide. Does every newly added dependency carry a
  licence this project is allowed to ship, and does any of them need its licence
  text added under the licences directory?

  Separate what the bump added from what it only moved. A version change on a
  dependency that was already in the tree needs no decision. A dependency that was
  not there before does.

  # Proving it instead of trusting it

  A green build says the code compiles. It does not say the packaged artifact is
  right. When the change affects what is packaged, look inside the artifact. List
  the resolved dependency tree for it, and list the archive contents to confirm
  that the classes which should be there are there and the ones which should not
  be there are gone.

  When the change affects behaviour at run time, start the server and watch it
  come up. When you replace a deprecated call with another call, do not claim the
  two behave the same unless something checks it. If nothing checks it, write the
  test that does, and keep it in the branch.

  # Using git

  Work on a branch named for the change. Commit in pieces that each stand on their
  own, with a message that says what changed in plain words. Do not put a tool
  name or a generated-by line in a commit message. The history of this project
  records people.

  Rebase onto the main branch before you ask anyone to review. A conflict in a
  generated file is not a conflict to merge by hand. Take either side, regenerate
  the file on the rebased tree, and then confirm that the entries from both sides
  are in the result.

  Force pushing is for your own branch only, and only with the lease option, so
  that a push which would drop someone else's commit fails instead of succeeding.
  Rebuild after a rebase before you push. A rebase that applied cleanly can still
  leave a tree that does not compile.

  # Starting a child agent

  Start a child agent when the material you need to read is large and most of it
  does not matter. A full workflow log is the usual case. The child reads all of
  it, and only its report enters this conversation.

  The child sees the prompt you give it and nothing else. Put the run number, the
  exact questions and the form of the answer in that prompt. Ask for facts you can
  act on, not for an opinion about what to do next.

  # Talking to the person

  Report what you did and what it showed after each step that produced a result.
  A few short sentences. Name the file, the number or the command output that
  supports what you say.

  When you are not going to do something the person or a reviewer asked for, say
  so and give the reason. Agreeing and then doing something else is worse than
  disagreeing.

  When the job is finished, say what changed, which runs failed and why, and what
  the next person has to watch for. That last part is the one thing they cannot
  recover from the commit history.
tools:
  - name: Bash
    description: |
      Runs one shell command in the repository checkout and returns what it
      printed.

      This is how the build is run, how the tree is searched, and how git and the
      GitHub command line client are driven. Maven is always started through the
      wrapper in the repository root, ./mvnw, and never through a Maven installed
      on the machine, because the wrapper pins the version this project builds
      with.

      Output comes back as text and a long output is cut short. So do not print a
      whole file or a whole build log. Narrow the command instead. Search for the
      lines that matter, count them, or write the output to a file under /tmp and
      search that file in a second call.

      A command runs under a time limit. The limit is two minutes unless the
      timeout field says otherwise, and the largest value it accepts is ten
      minutes. A clean build of every module takes about six minutes, so pass a
      timeout for any full build. Anything that can take longer than ten minutes,
      such as watching a workflow run to its end, has to be started in the
      background instead. The call then returns at once, the command carries on,
      and you are told when it exits.

      Nothing interactive works. A command that stops to ask a person something
      just uses up its time limit and returns nothing. Pass the flags that make a
      command answer itself, for example the setting that lets a continued rebase
      keep the existing message rather than opening an editor.

      Do not change source files with this tool. A text substitution rewrites
      lines it never showed you, and in Java or XML that is how an unrelated line
      gets damaged. Use Edit, which checks the old text before replacing it. A
      single wording change in a plain document is the only case where a
      substitution here is reasonable.

      Do not use this tool to turn a check off. The flags that skip the enforcer,
      the licence check or the tests exist for other purposes. Using one of them
      to reach a green result hides the failure from everyone who comes later.
      Skipping tests during a build whose only purpose is to install artifacts
      for the next step is a different thing, and it is fine.

      Build one module rather than all of them while you are still working. The
      project flag builds a named module, and the option that also builds what it
      depends on covers the case where a module below it changed too. A full
      build belongs at the end of a layer, not after every edit.

      Every call starts in the repository root, and exported shell variables do
      not survive to the next call. Put both statements in one command when the
      second one needs the first, for example sourcing an environment file and
      then using a variable it set.

      A command that fails returns its output together with the failure. Read
      that output. Do not run the same command again in the hope of a different
      result, because nothing between the two calls changed.

      Quoting is yours to get right. A search pattern with a dollar sign, a
      bracket or a backslash in it has to survive the shell before the tool ever
      sees it. When a pattern is awkward, put it in a file or simplify it, rather
      than layering quotes until it is unreadable.
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: "The command to run, exactly as it would be typed in a shell."
        description:
          type: string
          description: "A few words saying what the command is for, shown to the person instead of the command itself."
        timeout:
          type: integer
          description: "Time limit in milliseconds. The default is 120000 and the largest accepted value is 600000."
        run_in_background:
          type: boolean
          description: "Start the command and return at once. Use it for anything that can outlast the ten minute limit."
      required: [command]
  - name: Edit
    description: |
      Replaces one exact piece of text in one file that already exists.

      Read the file before you edit it. The old text has to match the file byte
      for byte, indentation included, and a match written from memory usually
      fails on whitespace. The file is not reformatted afterwards. What you write
      is what the file holds, so the surrounding indentation is yours to get
      right. That matters in a pom.xml, where the project checks the style of the
      file it ends up with.

      The old text has to appear exactly once in the file. A version such as
      1.68.0 appears many times in one pom, so a bare version is never a safe
      match. Include the lines around it, such as the artifact identifier above it
      or the closing tag below it, until only one place in the file can match.

      Several lines can be replaced in one call, and that is often what a
      dependency change needs. A pinned version and the stale exclusion block
      under it are one edit, not two, because they only make sense together. The
      new text may be empty, which deletes what was matched. Use that to drop a
      whole override block.

      There is an option to replace every occurrence instead of requiring one.
      Leave it off for a version string. Two dependencies in one file can carry
      the same version for different reasons, and changing both when you meant one
      is a mistake the build will not catch.

      The call fails and changes nothing when the old text is missing, or when it
      appears more than once. Either failure means the file is not what you
      thought it was. Read it again. Do not make the match shorter, because a
      shorter match is more likely to land in the wrong place.

      A match that worked before a rebase can fail after one. Somebody else may
      have changed the same lines. Read the file again after any operation that
      rewrites the working tree, and never keep a remembered match across one.

      Do not edit a generated file with this tool. The dependency licence file
      under dist-material/release-docs is written by a command from a template
      and the resolved tree. An edit to it is thrown away the next time that
      command runs, and in the meantime it makes the workflow pass while the real
      content is wrong.

      Removing a whole block leaves the blank lines around it behind. Include the
      newline before the block in the matched text when the block sits between
      two others, so the file does not end up with an empty gap that the style
      check then reports.

      This tool cannot create a file. Use Write for a file that does not exist
      yet.

      One call changes one file. When the same version has to move in five poms,
      that is five calls, and each of them is read and checked separately. That
      is slower than one sweeping substitution and it is the reason this tool
      exists.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: "Path to the file to change. It must already exist."
        old_string:
          type: string
          description: "The text to replace, copied from the file, with its indentation."
        new_string:
          type: string
          description: "The replacement text. An empty value deletes the matched text."
        replace_all:
          type: boolean
          description: "Replace every occurrence rather than requiring exactly one. Off by default."
      required: [file_path, old_string, new_string]
  - name: Read
    description: |
      Returns the contents of one file, with a line number in front of every
      line.

      Read a file before you change it. The line numbers let you talk about a
      compiler error by line. They are not part of the file, so never copy one
      into an edit.

      A long file comes back in pages, and the offset and limit fields ask for one
      page. Use them on purpose. The generated dependency licence file in this
      repository is thousands of lines long, and reading all of it fills this
      conversation with text that no decision depends on. Search such a file with
      a command, then read only the part you need to see.

      This tool is for source files and short documents. A build log or a workflow
      log is neither. Those run to tens of thousands of lines and are meant to be
      searched with a command, or handed to a child agent, not read here.

      Reading a file that does not exist is an error rather than an empty result.
      That answer is useful on its own. It is how you find out that a test
      directory or a licence text file is missing.

      Read a file before you edit it, every time, and read the part you are about
      to change rather than the first page. An edit built from what you expect a
      pom to contain fails on the indentation, and a second guess fails the same
      way. The file itself is the only reliable source.

      A pom in this project is long and repetitive. Searching it for the artifact
      identifier first, then reading the twenty lines around the match, is faster
      than reading the file and better evidence for the edit that follows.

      There is no need to read a file again after you have changed it. The edit
      would have reported a failure if it had not applied. Read it again only
      when something else could have touched it since, such as a rebase or a
      command that regenerated it.

      Anything that is not text comes back as an error or as content you cannot
      use. A compiled class, a jar or a generated descriptor is inspected with a
      command that lists or decodes it, not with this tool.

      Read the file the error names, not the file you assume is at fault. A
      compiler message gives a path and a line, and after a version bump the
      failing line is often in a module nobody expected to be involved. Opening
      the named file first has settled more of these than reasoning about which
      module should have broken.

      Reading a whole source file is right when you are about to change how it
      behaves. Thirty lines of Java is not a page of output, and understanding
      the method around the call you are replacing is what stops a change that
      compiles and is still wrong.

      Say how long a file is when you report on it. A person deciding whether to
      look at it themselves needs that number, and it costs you nothing to give
      it.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: "Path to the file to read."
        offset:
          type: integer
          description: "First line to return, for reading one page of a long file."
        limit:
          type: integer
          description: "How many lines to return from the offset."
      required: [file_path]
  - name: Write
    description: |
      Creates a new file, or replaces the whole contents of a file that exists.

      Use it only for a file that does not exist yet. Overwriting an existing file
      throws away everything in it, including the parts you never read, so a
      change to an existing file goes through Edit instead.

      Every source file added to this repository carries the Apache licence
      header. The workflow runs a header check, and a file without the header
      fails it. Put the header at the top of the content you write, before the
      package declaration. Adding it in a later edit is easy to forget.

      A Java file has to sit in the directory its package names. A test for a
      class in a module belongs under that module's src/test/java, in the same
      package directory as the class it tests. Put it anywhere else and the build
      will not compile it, so the test quietly never runs.

      Write the whole file in one call. There is no append, and a second call to
      the same path replaces the first.

      A new test is a commitment, because it runs on every build from now on.
      Write one that fails for the reason you care about. A test that passes
      whether or not the behaviour is there proves nothing and costs everyone
      time.

      Prove that a new test does what you think. Run it once, on its own, by
      name. A test method that the framework never picked up reports success by
      saying nothing, which looks exactly like a passing test in the build
      summary.

      A test for a limit has to observe the limit being enforced. Send something
      that is over it and expect the call to be refused, and let the same test
      show that a normal call still goes through. Otherwise a change that removes
      the limit altogether leaves the test green.

      Do not write a file under a target directory. Those directories hold build
      output and are deleted by a clean build, so anything you put there
      disappears without warning. Source belongs under src, and scratch files
      belong under /tmp.

      A file this tool creates is new to git and is not staged. Add it before you
      commit. A commit that changes a class and leaves its new test untracked
      builds on your machine and fails for everyone else.

      Write the imports the file actually needs and no others. The project's
      style check reports an unused import as an error, so a build that would
      otherwise pass stops on a line that has nothing to do with the change. It
      is quicker to be exact the first time than to be sent back by the check.

      Keep a new test in the module whose behaviour it checks. Putting it in a
      module further up, where the dependencies happen to already be present,
      moves the test away from the code and hides it from anyone changing that
      code later.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: "Path of the file to write. Directories along the path are created."
        content:
          type: string
          description: "The complete contents of the file, licence header included."
      required: [file_path, content]
  - name: Agent
    description: |
      Starts a child agent with a context window of its own, gives it one prompt,
      and returns the report it writes when it finishes.

      Start one when the material to read is large and most of it does not matter.
      A full workflow log is the usual case in this work. It runs to tens of
      thousands of lines, of which about ten are the failure. The child reads all
      of it and only its report comes back here.

      The child sees the prompt and nothing else. It cannot see this conversation,
      the files you changed, the run you are watching, or the reason you care. So
      the prompt has to carry all of it: the run number, the exact questions, and
      the form the answer should take. Ask for facts, such as which rule failed in
      which jobs and by which dependency path, rather than for a judgement about
      what to do next.

      The child cannot ask you anything once it has started, and you cannot add to
      its prompt. A prompt that is missing one detail comes back as a report that
      is missing one answer, and the whole run has to be done again. Read the
      prompt once more before you send it.

      The child works in the same checkout as you. Do not ask it to change files,
      commit or push. Two agents editing one tree produce a result neither of them
      can explain. Give it reading and searching work, and make the changes
      yourself when the report arrives.

      The report is text, and it is the only thing that comes back. Files the child
      wrote are still on disk, so ask it to say where it put anything you will want
      to look at yourself.

      A child takes as long as the work takes. Start one when the wait saves you
      more than it costs. Do not start one for a question that a single search
      answers.

      Name the child for the job it does, not for the tool it uses. The name is
      what the person sees while it runs, and a name such as a log reader tells
      them what is happening to their branch.

      Give the child narrower means than you have. It should read and search, and
      it should not be able to build, commit or push. A child that cannot do
      damage can be given a long job without supervision, which is the point of
      starting one.

      Ask for the questions you actually need answered, in a list, and say that
      an unanswered question should come back as unanswered. A report that fills
      a gap with something plausible is worse than one that leaves the gap
      visible, because you cannot tell which part to check.

      Do not start a second child to check the first. If the report is thin, read
      the evidence yourself with the paths the report names. Two reports that
      disagree leave you with no way to decide between them.

      Treat the report as evidence to act on, not as a decision already made. The
      child saw a log and nothing else. It does not know which of your edits
      caused what it found, and the connection between the two is yours to make.
    input_schema:
      type: object
      properties:
        description:
          type: string
          description: "A few words naming the task, shown while the child runs."
        prompt:
          type: string
          description: "The child's whole instruction. It sees nothing else, so state the run number, the questions and the form of the answer."
      required: [description, prompt]
steps:
  - input: "Bump gRPC and protobuf to the current releases across the OAP modules and the protocol submodule, then get the build and the end-to-end job green again."
  - call:
      thinking: unavailable
      text: "Finding where the two versions are defined."
      tool: {name: Bash, input: {command: "grep -rl --include=pom.xml -e '<grpc.version>' -e '<protobuf-java.version>' .", description: "find the version properties"}, result: {text: "./pom.xml", after: 900ms}}
      usage: {in: 4100, out: 180, cache_read: 16000, cache_write: 3200}
  - call:
      text: "Only the root pom defines them, and both oap-server and apm-protocol inherit from it. Checking which modules pin their own copy instead."
      tool: {name: Bash, input: {command: "grep -rl --include=pom.xml -e '<version>1\\.68\\.0</version>' -e '<version>3\\.2[15]\\.[0-9]*</version>' .", description: "find hard-coded versions"}, result: {text: "./oap-server/server-cluster-plugin/cluster-dnssd-plugin/pom.xml\n./oap-server/server-exporter/pom.xml\n./oap-server/server-fetcher-plugin/relay-fetcher-plugin/pom.xml\n./oap-server/server-library/library-grpc-client/pom.xml", after: 700ms}}
      usage: {in: 4400, out: 160, cache_read: 18000}
  - call: {text: "Two properties in the root pom plus four modules that hard-code a version. I will move all six onto the properties first.", usage: {in: 4800, out: 320, cache_read: 19000}}
  - input: "What are the current releases?"
  - call:
      text: "Asking Maven what is newer."
      tool: {name: Bash, input: {command: "./mvnw versions:display-dependency-updates -DprocessDependencyManagement=true | grep -e 'io.grpc:grpc-api ' -e 'protobuf:protobuf-java ' | sort -u", description: "run the versions plugin"}, result: {text: "[INFO]   com.google.protobuf:protobuf-java ............... 3.25.5 -> 4.29.3\n[INFO]   io.grpc:grpc-api ................................ 1.68.0 -> 1.72.0", after: 52s}}
      usage: {in: 5200, out: 200, cache_read: 21000}
  - call: {text: "gRPC 1.72.0 and protobuf 4.29.3. protobuf crossing the 4.x line is the risky half: the generated-code runtime check is strict about it.", usage: {in: 5600, out: 380, cache_read: 22000}}
  - input: "Fine, go with those. Start at the root properties."
  - call:
      text: "Swapping both properties in the root pom."
      tool:
        name: Edit
        input: {file_path: pom.xml, old_string: "<grpc.version>1.68.0</grpc.version>\n    <protobuf-java.version>3.25.5</protobuf-java.version>", new_string: "<grpc.version>1.72.0</grpc.version>\n    <protobuf-java.version>4.29.3</protobuf-java.version>"}
        result: "1 replacement: both properties, which sit on adjacent lines."
      usage: {in: 6000, out: 420, cache_read: 24000}
  - call:
      text: "Checking the reactor still loads with the new values."
      tool: {name: Bash, input: {command: "./mvnw -q validate && echo ok", description: "validate the reactor"}, result: {text: "ok", after: 31s}}
      usage: {in: 6300, out: 140, cache_read: 25000}
  - call: {text: "receiver-proto runs protoc from the same property, so compiling it shows protoc 29.3 resolves.", tool: {name: Bash, input: {command: "./mvnw -pl oap-server/server-receiver-plugin/receiver-proto compile", description: "compile receiver-proto"}, result: {text: "BUILD SUCCESS in 1m02s.", after: 62s}}, usage: {in: 6400, out: 150, cache_read: 25500}}
  - call: {text: "Root properties are on 1.72.0 and 4.29.3 and the reactor still loads.", usage: {in: 6500, out: 200, cache_read: 26000}}
  - input: "Now the four modules that hard-code it."
  - call:
      text: "library-grpc-client first."
