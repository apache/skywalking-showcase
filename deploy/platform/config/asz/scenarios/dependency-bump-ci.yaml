            package org.apache.skywalking.oap.server.library.server.grpc;

            import com.google.protobuf.Empty;
            import io.grpc.CallOptions;
            import io.grpc.ClientInterceptors;
            import io.grpc.ManagedChannel;
            import io.grpc.Metadata;
            import io.grpc.MethodDescriptor;
            import io.grpc.Server;
            import io.grpc.ServerServiceDefinition;
            import io.grpc.StatusRuntimeException;
            import io.grpc.netty.NettyChannelBuilder;
            import io.grpc.netty.NettyServerBuilder;
            import io.grpc.protobuf.ProtoUtils;
            import io.grpc.stub.ClientCalls;
            import io.grpc.stub.MetadataUtils;
            import io.grpc.stub.ServerCalls;
            import org.junit.jupiter.api.Test;

            import static org.junit.jupiter.api.Assertions.assertThrows;

            public class GRPCServerLimitsTest {
                private static final MethodDescriptor<Empty, Empty> PING = MethodDescriptor.<Empty, Empty>newBuilder()
                    .setType(MethodDescriptor.MethodType.UNARY)
                    .setFullMethodName("limits.Test/Ping")
                    .setRequestMarshaller(ProtoUtils.marshaller(Empty.getDefaultInstance()))
                    .setResponseMarshaller(ProtoUtils.marshaller(Empty.getDefaultInstance()))
                    .build();

                @Test
                public void oversizedMetadataIsRefused() throws Exception {
                    NettyServerBuilder builder = NettyServerBuilder.forPort(0)
                        .addService(ServerServiceDefinition.builder("limits.Test")
                            .addMethod(PING, ServerCalls.asyncUnaryCall((request, response) -> {
                                response.onNext(request);
                                response.onCompleted();
                            }))
                            .build());
                    GRPCServerLimits.apply(builder, 1 << 20, 1024);
                    Server server = builder.build().start();
                    ManagedChannel channel = NettyChannelBuilder.forAddress("127.0.0.1", server.getPort()).usePlaintext().build();
                    Metadata big = new Metadata();
                    big.put(Metadata.Key.of("x-pad", Metadata.ASCII_STRING_MARSHALLER), "x".repeat(4096));
                    try {
                        ClientCalls.blockingUnaryCall(channel, PING, CallOptions.DEFAULT, Empty.getDefaultInstance());
                        assertThrows(StatusRuntimeException.class, () -> ClientCalls.blockingUnaryCall(
                            ClientInterceptors.intercept(channel, MetadataUtils.newAttachHeadersInterceptor(big)),
                            PING, CallOptions.DEFAULT, Empty.getDefaultInstance()));
                    } finally {
                        channel.shutdownNow();
                        server.shutdownNow();
                    }
                }
            }
