            | sortMetrics service_sla, BanyanDB on tmpfs | 103 | 362    | 3.51  |

            v10.97.0 measures 124 ms, so the window is exactly one release.
            With a91c0e4 reverted on the v10.99.0 tag the ratio against v10.98.0 is 1.023
            (95% CI 0.99-1.06): nothing else in the release contributes.

