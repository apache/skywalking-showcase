            # Top-N query latency regression, v10.98.0 to v10.99.0

            ## Result

            | metric | v10.98.0 | v10.99.0 | ratio |
            |--------|----------|----------|-------|
            | p50 ms | 128      | 389      | 3.04  |
            | p95 ms | 212      | 659      | 3.11  |
            | p99 ms | 388      | 1104     | 2.85  |

            Ratio on p50 is 3.031 with a 95% bootstrap interval of 2.98 to 3.08,
            from 15 repeats per arm, 10,000 resamples.

            ## Cause

            Commit a91c0e4, "Memoise the top-n ordering comparator per query".
            One file, TopNSortPlanner.java, 46 insertions and 8 deletions.

            The comparator is memoised in a HashMap keyed by TopNSortKey, and the lookup
            runs inside compare(), with a new TopNSortKey built on every call. TopNSortKey
            declares neither equals nor hashCode, so the map keys on identity and never
            hits: each query's sort adds one entry per comparison, resizing as it goes.

            | evidence                                          | value  |
            |---------------------------------------------------|--------|
            | rows sorted per query                             | 20000  |
            | cache entries after one query's sort              | 276543 |
            | cache hit rate                                    | 0      |
            | live TopNSortKey instances under load             | 311402 |
            | CPU under comparatorFor: computeIfAbsent + resize | 31.3%  |
            | CPU under comparatorFor: identity hash codes      | 6.2%   |
            | CPU self time G1 evacuation                       | 5.9%   |

            ## Bracketing arms

            | arm                                     | p50 ms | p95 ms | p99 ms |
            |-----------------------------------------|--------|--------|--------|
            | a91c0e4, memoisation reverted           | 131    | 218    | 399    |
            | a91c0e4~1, memoisation cherry-picked in | 386    | 657    | 1098   |

            ## Candidate fixes, measured

            | variant                          | p50 ms | p95 ms | p99 ms |
            |----------------------------------|--------|--------|--------|
            | as-is                            | 389    | 659    | 1104   |
            | remove the cache                 | 127    | 211    | 384    |
            | value equals/hashCode on the key | 124    | 206    | 371    |
            | hoist the lookup out of the sort | 123    | 204    | 368    |

            All three fixes are within about 4% of each other and of the v10.98.0 baseline.
            The memoisation buys nothing measurable over having no cache at all.

            ## Scope

            | query                               | v10.98.0 | v10.99.0 | ratio |
            |-------------------------------------|----------|----------|-------|
            | sortMetrics service_sla top 5       | 128      | 389      | 3.04  |
