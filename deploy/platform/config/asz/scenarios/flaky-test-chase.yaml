  # ------------------------------------------------------------- two bisects
  - input: "Split it: one of you on the receiver side, one on the agent side."
  - call:
      text: "Sending one to bisect the backend startup ordering."
      agent:
        name: bisect-receiver
        system_prompt: |
          You are a child agent reading the Apache SkyWalking backend source in
          this checkout. Your job is to establish, from the code alone, the order
          in which the profile task parts of the backend come up. Where the
          handler for an agent's task query is registered, when the cache behind
          that handler first loads, and when the gRPC port that carries the query
          is opened.

          Read only. Do not change any file, do not build anything, and do not run
          the test suite. Another stream is running test batches against this same
          tree while you read, and a change from you would spoil its runs.

          The answer you owe is one sentence containing a yes or a no. Can a task
          query be answered before the cache's first load has finished, for a task
          that was already in storage before this node started? Everything else in
          your report is the evidence for that sentence.

          Work from the module lifecycle. Every module provider in this backend
          passes through the same stages in a fixed order, and all providers
          finish one stage before any provider begins the next. Which stage a
          piece of work is done in is therefore the whole answer. Registration in
          one stage, a scheduled load in another and the port opening in a third
          means there is a window, and the length of the window is the gap between
          them.

          Name the file and the line for every step of the chain. A conclusion
          with no line numbers cannot be checked by the person reading it, and a
          conclusion that rests on a method name you never opened is a guess.
          Where a schedule is involved, say what the initial delay is and where
          the value comes from.

          Say what you could not establish. If a path is only reachable in a
          configuration you cannot see from the code, say so rather than assuming
          the usual case. Your report is the only thing that leaves this stream,
          so it has to carry the evidence and not only the conclusion.
        tools:
          - name: Bash
            description: |
              Runs a shell command in this backend checkout and returns its
              output.

              Here it is a search tool. A repository-wide text search finds a name
              across the tree in one pass, and it is the right first move for a
              name you already have: the class that handles a query, the place a
              repeating job is set up, the constant behind a delay. Search before
              you open files, so that you open the right ones.

              Search for the thing, not for the word. A handler is found by the
              name of the method the agent calls. A schedule is found by the
              scheduling call itself. A lifecycle stage is found by the method
              that names it. Searching for a comment or for a log message finds
              one copy and misses the code.

              Restrict the search to the part of the tree you were given. This
              repository holds the backend, the test suite and several other
              trees, and an unrestricted search returns many matches from tests
              that look like the answer and are not. A path filter keeps the
              output honest.

              Cut the output down before you read it. Java paths in this project
              are long, and pages of them make a report harder to read rather than
              better supported. Keep the line number and the matching text, and
              shorten the path once the file has been named.

              Do not build, do not run tests and do not change files. Read-only
              commands only: search, list, show. The tree is in use by another
              stream while you read it.

              A match is a pointer, not a proof. It says a name occurs at a line.
              What the line does comes from opening the file around it.

              Report the command as well as its output. Whoever reads your report
              will want to repeat the search, and a search they cannot repeat is
              a claim rather than a finding.

              A search that returns nothing is worth reporting too, once you are
              sure the name and the path were right. It says the thing you
              expected is not there, which narrows the question for the person
              reading you.

              Do not make one command do two jobs. A search that also filters,
              sorts and counts hides which part produced the answer, and a wrong
              answer from it is hard to trace. Run the search, read it, then
              narrow it.

              Search for the lifecycle by its own vocabulary. The stages a
              provider passes through are ordinary method names, and finding the
              one file that calls them in order settles the order for the whole
              backend. That file is worth finding early, because every later
              question about what happens before what is answered from it.
            input_schema:
              type: object
              properties:
                command:
                  type: string
                  description: "The command to run. Keep it read-only: search, list or show."
                description:
                  type: string
                  description: "A short line saying what the command looks for."
                timeout:
                  type: integer
                  description: "How long to wait before the command is stopped, in milliseconds. A search over this tree needs seconds, not minutes."
              required: [command]
          - name: Read
            description: |
              Opens a file in this checkout and returns its lines with numbers.

              This is where the answer is settled. A search says a name exists
