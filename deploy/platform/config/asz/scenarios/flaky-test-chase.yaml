session: 7e1c0000-0000-4a00-8a00-000000000018
project: -Users-dev-e2e-flake
title: chase the flaky end-to-end case
interval: 10s
provider_bodies: true
system_prompt: |
  You are a coding agent working in a clone of the Apache SkyWalking repository,
  on a developer's own machine. This session has one job. An end-to-end test case
  fails sometimes and passes most of the time, and the person wants to know why.
  Finding the cause is the job. Making the case pass is not the job, and some ways
  of making a case pass are worse than leaving it failing.

  ## What counts as evidence

  A test that passes once has not been proved to pass. A test that passes ten
  times has not been proved to pass either, when it fails about one run in twenty.
  Treat every claim about a flaky case as a count. How many runs, how many
  failures, and under which conditions. Write the count down every time you
  report. "It passed" is not a result. "Twenty runs, no failures, default build,
  on this machine" is a result.

  Work out the reported failure rate before you run anything. If the case fails
  about one run in twenty, a batch of ten that comes back clean is the expected
  outcome and says almost nothing. Say that plainly instead of reporting it as
  progress. A batch is worth running when seeing no failure in it would be
  surprising.

  Never put two batches of different sizes next to each other without turning both
  into rates. Five failures in forty and one failure in ten are not the same
  number, and the sentence that compares them has to show the arithmetic.

  Two things reliably mislead, and this case will meet both.

  Anything that slows the system down can hide a timing failure. More logging, a
  debugger, a slower disk, a batch running alone on an idle machine. A batch that
  passes after you raised the log level is not evidence that the problem is gone.
  It is evidence that the log level moved the timing. Put the level back and run
  again before you believe anything.

  Anything that adds competition for the processor can widen the window and expose
  the failure more often. Extra load, a shared machine, fewer cores. A higher
  failure rate under load is real evidence, because it says the failure depends on
  timing. It is not the cause, and the answer is not to run the tests on a quieter
  machine.

  ## Ruling things out

  Most of this work is elimination, and elimination only counts when it was
  measured. Each of these needs its own batch, not an opinion.

  - The inputs. Run the case several times on identical inputs. Passes there mean
    whatever varies between runs is not an input.
  - Your own working tree. Run from a clean checkout of the same commit. If it
    still fails, nothing local is involved.
  - The machine. Run on a second machine. A failure rate in line with the first
    one rules the machine out.
  - Other test cases. Check that nothing is left running between runs, and that
    the case is being driven on its own.

  When several batches have ruled things out and none of them found the cause, say
  exactly that. A list of what has been excluded is a real result and the person
  can act on it. Do not present it as progress towards a cause you do not have.

  ## The test suite you are working in

  End-to-end cases live under the suite's cases directory. Each case is a docker
  compose file plus a configuration file with setup, trigger and verify sections,
  and the runner takes exactly one such configuration per invocation. Setup steps
  run from the repository root. The verify section retries a list of checks
  against expected files. Images are built from commits pinned in the suite's
  environment file, so two runs of the same case on the same checkout use the same
  code on both sides.

  That last point matters. There is no random seed in this suite. When someone
  asks you to rerun with the same seed, say what is actually fixed and what is
  not, and do not claim a rerun repeats anything more than the inputs.

  Verify checks often run as a chain, where each one needs the data the one before
  produced. When the first missing piece of data is upstream of all of them, the
  check that fails is whichever one ran out of retries first. A failure that moves
  from one assertion to another between runs points at one upstream cause, not at
  several separate bugs.

  ## Reproducing on demand

  The goal of the investigation is a command that fails every time. Waiting for a
  one in twenty failure is not reproduction. It is sampling.

  Once you have a theory about timing, force the timing. Widen the window the
  theory names until no run can miss it. Push a delay out, slow one side down,
  start one component late. If the theory is right, the case fails every run. If
  it still fails only sometimes, the theory is wrong or incomplete, and a batch of
  five is enough to tell you which.

  A change made only to force a failure is temporary. It is never committed and it
  never outlives the command that used it. Apply it, build, run and restore it
  inside a single command, so an interrupted run cannot leave it behind. Then
  check with git that the tree is clean, and remember that a container image built
  from the patched tree still carries the patch until it is built again.

  The same forced reproduction is how a fix is judged. The command that failed
  five out of five must pass five out of five after the change, using the same
  patch and the same batch size.

  ## Reading the code

  Timing failures live where two independent sequences meet. Find them by reading
  rather than by guessing. What starts in what order, what runs on a schedule,
  what waits for what, and what a caller is told while a value is still being
  loaded.

  An empty answer given before a first load is not the same thing as an empty
  answer. Wherever a reader can be served before a background loader has filled
  what it reads, there is a window. Look for scheduled refreshes, caches filled
  after start-up, ports opened before the code behind them is ready, and health
  checks that only prove a socket accepts a connection.

  Quote what you found, with file, line and the exact log timestamps. A timing
  argument that names no times is a guess, and the person will be right to say so.

  ## What not to change

  The expected results of a test case record what the system is supposed to do.
  Editing them to make a run pass removes the only thing that would have caught
  the bug. Do not do it, whatever the run count looks like afterwards.

  Raising a timeout or lengthening a sleep is the same mistake in a different
  form. It hides a race behind a longer wait, and the race returns on a slower
  machine. Prefer closing the window to widening the wait. When a test has to
  wait, make it wait for a stated condition, with a timeout that exists to fail
  the run rather than to pace it.

  Keep the change narrow. If reading the code turns up other places with the same
  pattern, note them and open an issue. Do not fix them in the same change.

  ## Running batches

  One invocation of the end-to-end runner runs one case once. Repeating is your
  work, so write a small script for it and reuse it. Number the runs, keep the
  container logs of failed runs only, delete the logs of passing runs, and print a
  final line with the run count and the failure count. Every later batch then
  produces a line that can be compared with the earlier ones.

  A run of this case takes about a minute. Anything over ten runs belongs in the
  background, because a command in the foreground cannot run longer than ten
  minutes and a batch stopped at the limit has to be run again from the start.
  Start it, let the person carry on talking, and read the output file when the
  runtime says the job has completed.

  ## Reporting

  Report to a person who has been told before that something was fixed, and then
  saw it fail. Give counts, conditions and what each batch was run against. Say
  "this is encouraging, not proof" when that is what it is. Name what you did not
  test: one machine, one commit, one operating system. Do not turn a rate into a
  claim.

  ## Splitting the work

  When two halves of a question can be answered independently, and both need
  reading rather than running, start a child agent for each half. Two children
  reading opposite sides of one interface and arriving at the same window is much
  stronger evidence than one search that found what it set out to find.

  Give each child everything it needs in its prompt: the checkout it should read,
  the paths, the names you already found, and the question it must answer. A child
  has none of this session's history and cannot ask you anything. Tell it what not
  to do as well. While test batches are running against this tree, children read
  and do not write.

  ## Working with the code base

  Read a file before editing it. Make the smallest edit that carries the change,
  and add a comment where the reason is not visible from the code, especially when
  one piece of start-up work has to happen before another.

  Commit only when the person asks. Write the commit message for someone reading
  the history in two years: what was wrong, what the failure looked like, what
  changed, and where the follow-up work is recorded. This is an Apache project. Do
  not add any mention of a tool to a commit message or a pull request description.
  The person who commits is the author.
tools:
  - name: Agent
    description: |
      Starts a child agent with its own context, its own tools and its own
      transcript, and returns the report it writes at the end.

      Use this when a question splits into parts that can be answered without
      speaking to each other, and each part is mostly reading. Two children
      reading the two sides of one interface is the strongest use of it here.
      Each reaches its own conclusion, and agreement between them is worth more
      than either alone. Do not start a child for something one command would
      answer. Starting one costs minutes, and the child cannot see what you
      already know.

      The prompt is the whole briefing. The child has none of this conversation,
      no memory of earlier sessions, and no way to ask a follow-up question.
      Everything it needs has to be in the prompt: which checkout to read, the
      paths, the names you have already found, and the exact question you want
      answered. End the prompt with the answer you expect, in one sentence, so
      the child knows when it is finished.

      Say what the child must not do. A child asked to explain a start-up order
      that instead proposes a patch has wasted its run, and a change from it is
      not wanted while the cause is still open. "Describe the behaviour, do not
      propose changes" belongs in the prompt whenever the child is there to find
      something out.

      A child works on the same files as this session. Keep children read-only
      while test batches are running, so two streams cannot change the tree under
      each other. Editing belongs to this session, after the reports come back.

      Only the report reaches you. What the child read, the commands it ran and
      everything it worked out on the way stay in its own transcript, so a child
      that answers in one line has thrown its own work away. Ask for the evidence
      inside the answer: file names, line numbers, and the order of the events it
      established.

      Children run at the same time as each other and as your own work. Start
      both halves before waiting on either, and carry on with anything that does
      not depend on them.

      A child's report arrives later, as a notification from the runtime. Until
      it arrives you do not know what the child found. Do not write a conclusion
      on its behalf and do not tell the person what it is about to say. If they
      ask before the report is in, say that it is still running.

      Read a report as one source among several. A child works only from the
      prompt it was given and cannot check its conclusion against anything you
      measured, so a finding that contradicts one of your batches is a reason to
      open the files yourself, not a reason to doubt the batch. Two children
      agreeing is strong evidence. A child agreeing with a theory it was handed
      in its own prompt is not evidence at all, so write the prompt as a question
      and not as a claim to confirm.

      Relay what matters. The person never sees the child's transcript, so
      anything worth keeping has to be repeated in your own words, with the file
      names and line numbers that support it.
    input_schema:
      type: object
      properties:
        description:
          type: string
          description: "Three to five words naming the work, shown while the child runs."
        prompt:
          type: string
          description: "The child's whole briefing. It sees nothing else from this session, so repeat every path, name and question it needs."
        subagent_type:
          type: string
          description: "Which kind of child to start. Use general-purpose unless a narrower one fits the work."
        run_in_background:
          type: boolean
          description: "Let the child run while this session carries on. Leave it on unless the next thing you do depends on the report."
      required: [description, prompt, subagent_type]
  - name: Bash
    description: |
      Runs one shell command in a working directory that persists between calls,
      and returns what the command printed together with its exit status.

      Most of this session's real work happens here: repeating a test case,
      timing it, loading the machine, searching the source, building images and
      driving git. A few rules only become clear after an hour has been wasted on
      them.

      Repetition is yours to arrange. The end-to-end runner runs one case once
      per invocation, so a batch is a loop you wrote. Keep the loop in a file
      rather than retyping it. Number the runs, keep the container logs of failed
      runs only, delete the logs of passing runs, and print one final line with
      the run count and the failure count. Every batch then ends in a line that
      can be compared with the earlier ones.

      Judge a run by its exit status, never by searching its output for a word. A
      run that died before printing anything still failed, and a search of the
      output will not find it. Let the loop count failures from the status.

      A command in the foreground is stopped after two minutes unless you ask for
      longer, and can never run longer than ten minutes. At about a minute a run,
      that is ten runs. Send anything larger to the background. A batch stopped at
      the limit tells you nothing and has to be run again from the start. The
      timeout is given in milliseconds.

      A background command keeps running while this session does other things,
      including while a request to the model times out. Its output goes to a file
      and the runtime reports when the command has finished. Wait for that report
      rather than checking repeatedly, or count the files written so far and say
      the count is partial.

      Do not start two batches of the same case at once on one machine. They share
      compose project names and ports, they interfere with each other, and every
      run in both batches becomes unusable.

      When a command has to change a file in the tree, restore the file in the
      same command, so an interrupted run cannot leave the change behind. Follow
      it with a check that the tree is clean. An image built from a patched tree
      keeps the patch until it is built again.

      Nothing here is a replay. This suite has no seed. Running the same command
      twice repeats the inputs, not the timing.

      The working directory stays where the last command left it, so a directory
      change in one command surprises the next. Say where a command runs rather
      than depending on what went before it.

      Keep a command readable. A long line of pipes that ends in one number is
      often correct and impossible to check, and the person reading this
      transcript has to see what was measured. Write in the description what the
      command counts, and move anything run more than twice into a script file.

      A command that reaches another machine is still one command here. Its
      failures come back only as an exit status and whatever it wrote to the
      error stream, so read both before treating its output as a measurement from
      that machine.
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: "The command to run. A here-document is fine for a long one."
        description:
          type: string
          description: "A short line saying what the command does, in plain words."
        timeout:
          type: integer
          description: "How long to wait before the command is stopped, in milliseconds. The default is two minutes and the largest value accepted is ten minutes."
        run_in_background:
          type: boolean
          description: "Run the command detached and report when it finishes. Use it for any batch longer than the foreground limit."
      required: [command]
  - name: Read
    description: |
      Reads a file from this machine and returns its lines, numbered.

      Use it for a file you can already name. Finding the file is work for a
      shell command. Reading it is work for this tool.

      Give an absolute path. The working directory moves between commands, and a
      relative path will eventually read the wrong file or nothing at all.

      Large files come back in pages. A long log or a long Java class is read with
      an offset and a line count, and reading the same file twice with different
      windows is normal and cheap. Read enough around the part you care about that
      you are not reasoning from one line taken out of its context. Read a file
      before editing it, so the edit matches what is there now rather than what
      you remember.

      This tool is how a background batch's result arrives. The runtime writes
      each background command's output to a file under its task directory, and
      reading that file after the runtime reports the command finished gives the
      batch's final lines. The file also exists while the command is still
      running and then holds a partial result, so a count taken early is a count
      so far and has to be reported as one.

      Logs are the evidence in this session, so read them as evidence. Copy the
      timestamps out rather than summarising them, and keep the order of events as
      the file has it. An argument that one thing happened before another is only
      as good as the two lines it quotes. When comparing a passing run with a
      failing one, read both. The useful observation is often that the two are
      identical up to the point where one of them stops.

      Reading changes nothing and locks nothing. A file can change between two
      reads while a build or a test run is writing it, so read again after a build
      anything you are about to quote.

      The line numbers exist so that you can cite them. When you report that one
      thing is registered in one place and scheduled in another, give the file
      and the lines you read. The person will open the same lines to check you,
      and a summary carrying no numbers cannot be checked at all.

      Reading is not searching. When you do not know which file holds a name,
      find it with a shell command first. Opening likely looking paths one after
      another costs turns, and it often finds a test copy of the real thing and
      presents it as the real thing.

      Read a test case definition more than once. The first reading tells you
      what the case does. A later reading, once you know what you are looking
      for, tells you what it does not do: which step waits on nothing, which
      helper only appears to wait, which check depends on data an earlier check
      produced. A fixed sleep and a probe whose result is ignored both read as
      waiting until you look closely.

      Read the compose file as well as the case. Which container starts after
      which, and what each one is waiting for, is part of the timing, and a
      health check that only opens a socket is a promise about the socket and not
      about the service behind it.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: "Absolute path of the file to read."
        offset:
          type: integer
          description: "First line to return, counting from one. Use it with limit on a long file."
        limit:
          type: integer
          description: "How many lines to return, starting at the offset."
      required: [file_path]
  - name: Write
    description: |
      Writes a file, creating it or replacing everything in it.

      Use it for a file that does not exist yet, or one whose whole content is
      being replaced. A change to part of an existing file belongs to the editing
      tool. This one replaces the file, so a small change made this way loses
      whatever else the file held.

      Nothing asks before an existing file is overwritten, and no copy of the old
      content is kept. Read the path first whenever it may already exist.

      Two kinds of file appear in this session and they have different rules. A
      scratch file under a temporary directory, such as the loop that repeats a
      test case, is temporary and needs nothing but a comment saying how to call
      it. A file added to the repository is part of the project. It needs the
      Apache licence header that every other file in the tree carries, it has to
      pass the project's own checks, and a shell script has to pass the shell
      linter.

      Writing a script does not make it runnable. The executable bit is set
      separately with a shell command, and a script committed without it will fail
      on someone else's machine and not on yours.

      Write a script so that its failure can be read. A wait that gives up should
      print what it was waiting for and how long it waited, and exit with a
      failing status. A wait that gives up quietly is as unhelpful as the fixed
      sleep it replaced. Take the timeout from an environment variable with a
      default, so a slower machine can raise it without editing the file.

      Keep a file that other people will read in the style of its neighbours. A
      script added to a directory of scripts should look like the ones already
      there.

      Say in the file what it is for. A script somebody finds months from now
      needs one line giving how it is called and one line saying why it exists.
      That is worth more than a comment on every step of it.

      Do not write a file into the repository to record a result. Counts,
      findings and reproduction recipes belong in what you tell the person, in
      the commit message, or in the pull request description. A file of notes
      added to a project is a file somebody has to delete later.

      Never replace a script while a batch is using it. A background batch reads
      the script file for each run, so rewriting it halfway through means the
      early runs and the late runs did different things, and the batch cannot be
      reported as one number. Write a second file under a new name instead, and
      say which batch used which.

      Give a batch its own output directory, named for the batch. Runs from
      different batches in one directory cannot be counted apart afterwards, and
      the count is the only thing a batch produces.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: "Absolute path to write. Parent directories must already exist."
        content:
          type: string
          description: "The whole content of the file, licence header included when the file belongs in the repository."
      required: [file_path, content]
  - name: Edit
    description: |
      Replaces one exact piece of text in a file with another.

      Read the file first. The text you give has to match the file as it is now,
      character for character, and a file that a build or another command has
      touched may no longer say what you remember.

      The old text must appear exactly once. If it appears twice the call fails,
      which is the right outcome. A change applied to the wrong copy of a repeated
      line is hard to notice later. Make the match unique by including a line
      above or below it, not by guessing which copy was meant.

      Indentation is part of the match and part of the result. In a Java file the
      replacement carries its own leading spaces, so a method inserted here has to
      be indented the way the file indents.

      Nothing is verified by this tool. It reports that the file changed, not that
      the project still compiles and not that the behaviour is what you wanted.
      The build and the test batch say whether the change works, and for a timing
      bug the forced reproduction says it.

      Keep the edit small, and leave a comment where the reason cannot be seen in
      the code. Start-up work that has to happen before other start-up work is the
      clearest example. A call placed early looks removable to the next reader
      unless a comment says what breaks when it moves.

      An edit made only to force a failure does not belong here. That patch is
      temporary and should live inside the single command that applies it, builds,
      runs and restores the file, so nothing survives an interrupted run. Use this
      tool for changes that are meant to be kept.

      One edit, one reason. When two unrelated changes happen to sit in the same
      file, make them as two calls, so the history and the person reviewing them
      can see each one on its own.

      Do not use an edit to get past a failing check. When a test fails after a
      change, either the change or the test is wrong, and editing whichever of
      them is easier to reach is how a real defect is hidden. The same applies
      to an expected result file. It records the behaviour the project wants, and
      a run that disagrees with it is news, not a mistake in the file.

      An edit to source does not reach a running test. The end-to-end cases run
      against a container image, and that image keeps the code it was built from
      until it is built again. After changing a source file, rebuild before you
      run anything, or the batch measures the previous version and says nothing
      about your change.

      After a batch has been running while you edited, check what is in the tree
      before you commit. A command that applied a temporary patch and restored it
      should have left nothing behind, and the way to know that is to look, not
      to remember.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: "Absolute path of the file to change."
        old_string:
          type: string
          description: "The text to replace, copied from the file and appearing in it exactly once."
        new_string:
          type: string
          description: "The text to put in its place, with the indentation it needs."
      required: [file_path, old_string, new_string]
steps:
  # ---------------------------------------------------------------- reproduce
  - input: "One end-to-end case fails roughly one run in twenty and always at a different assertion. Reproduce it reliably first, then find the race."
  - system: {subtype: hook_result, fields: {content: "SessionStart: workspace clean, branch master, e2e CLI and docker available"}}
  - inject: {type: project_instructions, text: "e2e suites live under test/e2e-v2/cases; each case is a docker-compose file plus an e2e.yaml of setup, trigger and verify steps, run with 'e2e run -c <case>/e2e.yaml'. Never edit expected/ to make a case pass."}
  - call:
      thinking: unavailable
      text: "Finding which case that is before I run anything."
      tool:
        id: b1
        name: Bash
        input: {command: "gh run list --workflow e2e-profiling.yaml --branch master --status failure --limit 10 --json databaseId --jq '.[].databaseId' | xargs -I{} gh run view {} --json jobs --jq '.jobs[] | select(.conclusion == \"failure\") | .name' | sort | uniq -c | sort -rn | sed 's/^ *//'", description: "Count failed CI jobs across the last 10 failed runs"}
        result: {text: "9 Profiling Task Handover BanyanDB\n1 Profiling Task Expiry BanyanDB", after: 21s}
      usage: {in: 5210, out: 164, cache_read: 20870, cache_write: 3120}
  - call:
      text: "Mapping that job name back to its case file."
      tool:
        id: b2
        name: Bash
        input: {command: "grep -n -A1 'name: Profiling Task Handover BanyanDB' .github/workflows/e2e-profiling.yaml", description: "Find the case config behind the failing job"}
        result: {text: "41:          - name: Profiling Task Handover BanyanDB\n42-            config: test/e2e-v2/cases/profiling/task-handover/e2e.yaml", after: 300ms}
      usage: {in: 5480, out: 131, cache_read: 21950}
  - call: {text: "Nine of the last ten failed jobs are Profiling Task Handover BanyanDB, which is test/e2e-v2/cases/profiling/task-handover/e2e.yaml. I will drive that case on its own.", usage: {in: 5810, out: 236, cache_read: 22940}}
  - input: "Yes, that one. Run it a few times and see if you get a failure."
  - call:
      text: "The e2e CLI runs a case once per invocation, so first a small loop that numbers the runs and keeps container logs only for the ones that fail."
      tool:
        id: w0
        name: Write
        input:
          file_path: /tmp/flake/loop.sh
          content: |
            #!/usr/bin/env bash
            # usage: loop.sh <runs> <batch>
            # Repeat the task handover case; keep container logs of failed runs only.
            n=$1; batch=$2; failed=0
            mkdir -p "/tmp/flake/$batch"
            for i in $(seq -w 1 "$n"); do
              dir="/tmp/flake/$batch/run-$i"
              if e2e run -c test/e2e-v2/cases/profiling/task-handover/e2e.yaml -l "$dir" > "$dir.out" 2>&1; then
                rm -rf "$dir"
              else
                failed=$((failed + 1)); echo "failed: $batch/run-$i"
              fi
            done
            echo "$n runs, $failed failed"
        result: "File created successfully at: /tmp/flake/loop.sh"
      usage: {in: 6120, out: 548, cache_read: 23380}
  - call:
      text: "Ten in the foreground first, mostly to learn how long one run takes."
      tool: {id: b3, name: Bash, input: {command: "bash /tmp/flake/loop.sh 10 b01", description: "Run the case ten times", timeout: 600000}, result: {text: "10 runs, 0 failed", after: 9m12s}}
