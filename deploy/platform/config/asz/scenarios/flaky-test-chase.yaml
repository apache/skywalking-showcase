  - input: "Yes, that one. Run it a few times and see if you get a failure."
  - call:
      text: "The e2e CLI runs a case once per invocation, so first a small loop that numbers the runs and keeps container logs only for the ones that fail."
      tool:
        id: w0
        name: Write
        input:
          file_path: /tmp/flake/loop.sh
          content: |
            #!/usr/bin/env bash
            # usage: loop.sh <runs> <batch>
            # Repeat the task handover case; keep container logs of failed runs only.
            n=$1; batch=$2; failed=0
            mkdir -p "/tmp/flake/$batch"
            for i in $(seq -w 1 "$n"); do
              dir="/tmp/flake/$batch/run-$i"
              if e2e run -c test/e2e-v2/cases/profiling/task-handover/e2e.yaml -l "$dir" > "$dir.out" 2>&1; then
                rm -rf "$dir"
              else
                failed=$((failed + 1)); echo "failed: $batch/run-$i"
              fi
            done
            echo "$n runs, $failed failed"
        result: "File created successfully at: /tmp/flake/loop.sh"
      usage: {in: 6120, out: 548, cache_read: 23380}
  - call:
      text: "Ten in the foreground first, mostly to learn how long one run takes."
