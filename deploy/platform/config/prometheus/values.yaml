# Values for the `monitoring/prometheus` release, applied by the `prometheus` feature.
# The Alertmanager configuration and the Slack settings are in alertmanager/, the BanyanDB rules in rules/banyandb.yaml.
alertmanager:
  enabled: true
  # With the reloader the subchart drops the checksum/config pod annotation, and the config and templates (such as the
  # Slack channel) are reloaded in place, so changing them keeps the Pod and its silences. Changing the Secret volume
  # (extraSecretMounts, i.e. switching prometheus-slack on or off) still recreates the Pod once.
  configmapReload:
    enabled: true
  # The silences and the notification log are in the Pod's emptyDir volume `storage` and are lost when the Pod is recreated.
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  global:
    evaluation_interval: 30s
    scrape_interval: 30s
    scrape_timeout: 10s

serverFiles:
  prometheus.yml:
    # The whole scrape_configs block comes from extraScrapeConfigs, assembled from scrape/*.yaml by the Makefile.
    scrape_configs: null
  # The BanyanDB rules are added by the Makefile when the banyandb feature is on. The chart's default is `{}`.
  alerting_rules.yml:
    groups: []
