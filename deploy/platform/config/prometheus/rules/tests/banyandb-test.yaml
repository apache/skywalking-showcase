# promtool unit tests of rules/banyandb.yaml. Run from the repository root (needs docker):
#
#   docker run --rm -v $PWD/deploy/platform/config/prometheus/rules:/r -w /r/tests --entrypoint promtool prom/prometheus:v2.55.1 test rules banyandb-test.yaml
#
# Every rule has a non-empty `annotations.graph` (prints true; -e fails otherwise):
#
#   yq -e '[.groups[].rules[] | select((.annotations.graph // "") == "")] | length == 0' deploy/platform/config/prometheus/rules/banyandb.yaml
rule_files:
  - ../banyandb.yaml
evaluation_interval: 30s

tests:
  # 2 liaison and 5 data nodes (hot 2, warm 2, cold 1), every node advancing: nothing fires.
  - name: node-missing-healthy-2-liaison-5-data
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '7x40'}
    alert_rule_test:
      - {eval_time: 12m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 25m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 38m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # a single standalone node without the DNS discovery metric: nothing fires.
  - name: node-missing-healthy-standalone
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
    alert_rule_test:
      - {eval_time: 12m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 25m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 38m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # 3 data nodes without tiers: nothing fires.
  - name: node-missing-healthy-3-data
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '3x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '3x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '3x40'}
    alert_rule_test:
      - {eval_time: 25m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # 3 liaison and 9 data nodes: nothing fires, whatever the node count.
  - name: node-missing-healthy-12-nodes
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l2"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d5"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d5"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d6"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d6"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d7"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d7"}', values: '12x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d8"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d8"}', values: '12x40'}
    alert_rule_test:
      - {eval_time: 25m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # d4 froze at 10m (the container died, the FODC agent keeps exporting the last up time). It leaves the 3m changes() window
  # at 13m, is pending from then and fires after the 5m `for`. No DNS metric: only the per-pod term fires.
  - name: node-missing-frozen
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x10 1600x30'}
    alert_rule_test:
      - {eval_time: 15m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - eval_time: 25m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: d4, container_name: data}
            exp_annotations:
              summary: "BanyanDB data node d4 is missing"
              description: "The up time of BanyanDB data node d4 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d4",container_name="data"}'

  # d4 froze at 10m while every node reports 7 nodes (6 advancing): only the per-pod term fires; the cluster term stays
  # quiet while the per-pod term has a result.
  - name: node-missing-frozen-with-dns
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x10 1600x30'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '7x40'}
    alert_rule_test:
      - {eval_time: 15m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - eval_time: 25m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: d4, container_name: data}
            exp_annotations:
              summary: "BanyanDB data node d4 is missing"
              description: "The up time of BanyanDB data node d4 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d4",container_name="data"}'

  # d4 vanished at 10m (its series went stale), no DNS metric: it is no longer advancing from 13m (the 3m window holds
  # one sample), fires from 18m and goes quiet once the last sample leaves the 1h window.
  - name: node-missing-vanished
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x90'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x90'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x90'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x90'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x90'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x90'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x10 stale'}
    alert_rule_test:
      - eval_time: 25m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: d4, container_name: data}
            exp_annotations:
              summary: "BanyanDB data node d4 is missing"
              description: "The up time of BanyanDB data node d4 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d4",container_name="data"}'
      - eval_time: 60m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: d4, container_name: data}
            exp_annotations:
              summary: "BanyanDB data node d4 is missing"
              description: "The up time of BanyanDB data node d4 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d4",container_name="data"}'
      - {eval_time: 80m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # d4 was scaled away at 10m: the live nodes report 6 from then on, so only the per-pod term fires (until the 1h window ends).
  - name: node-missing-scale-down
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '7x10 6x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '7x10 6x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '7x10 6x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '7x10 6x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '7x10 6x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '7x10 6x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x10 stale'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '7x10 stale'}
    alert_rule_test:
      - eval_time: 25m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: d4, container_name: data}
            exp_annotations:
              summary: "BanyanDB data node d4 is missing"
              description: "The up time of BanyanDB data node d4 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d4",container_name="data"}'

  # d4 never reported (Prometheus started after the node was lost): there is no history for it, the live nodes report 7 nodes and
  # only 6 advance, so only the cluster term fires.
  - name: node-missing-no-history
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '7x40'}
    alert_rule_test:
      - {eval_time: 4m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - eval_time: 25m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "BanyanDB nodes are missing"
              description: "1 of the nodes BanyanDB itself counts (DNS discovery) neither advance nor have an alert of their own, for 5m."
              graph: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy"}'

  # d4 has been frozen since the first sample (7 reported, 6 advancing): only the per-pod term fires.
  - name: node-missing-frozen-from-start
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '7x40'}
