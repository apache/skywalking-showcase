    alert_rule_test:
      - {eval_time: 8m, alertname: BanyanDBQueryLatencyHigh, exp_alerts: []}
      - eval_time: 30m
        alertname: BanyanDBQueryLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: l0}
            exp_annotations:
              summary: "BanyanDB l0 p99 query latency is high"
              description: "p99 gRPC query latency on l0 is 2.48 s, above 1 s for 10m."
              graph: 'histogram_quantile(0.99, sum by (le) (rate(banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",status!~"canceled|deadline_exceeded",pod_name="l0"}[5m])))'
          - exp_labels: {severity: warning, pod_name: l1}
            exp_annotations:
              summary: "BanyanDB l1 p99 query latency is high"
              description: "p99 gRPC query latency on l1 is 9.95 s, above 1 s for 10m."
              graph: 'histogram_quantile(0.99, sum by (le) (rate(banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",status!~"canceled|deadline_exceeded",pod_name="l1"}[5m])))'
          - exp_labels: {severity: critical, pod_name: l1}
            exp_annotations:
              summary: "BanyanDB l1 p99 query latency is high"
              description: "p99 gRPC query latency on l1 is 9.95 s, above 5 s for 10m."
              graph: 'histogram_quantile(0.99, sum by (le) (rate(banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",status!~"canceled|deadline_exceeded",pod_name="l1"}[5m])))'

  # canceled requests are left out: l0 has slow canceled queries (5-10 s) and fast ok ones; the quantile of the ok ones
  # stays at 0.05 s and nothing fires. The same slow requests with status ok (l1) fire both the warning and the critical alert.
  - name: query-latency-canceled-requests-ignored
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="0.05"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="0.1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="0.25"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="0.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="2.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="30"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="60"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="canceled",le="+Inf"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.05"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.1"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.25"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.5"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="1"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="2.5"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="5"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="30"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="60"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="+Inf"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="0.05"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="0.1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="0.25"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="0.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="2.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="30"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="60"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="measure",status="ok",le="+Inf"}', values: '0+600x40'}
    alert_rule_test:
      - {eval_time: 30m, alertname: BanyanDBQueryLatencyHigh, exp_alerts: [{exp_labels: {severity: warning, pod_name: l1}, exp_annotations: {summary: "BanyanDB l1 p99 query latency is high", description: "p99 gRPC query latency on l1 is 9.95 s, above 1 s for 10m.", graph: 'histogram_quantile(0.99, sum by (le) (rate(banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",status!~"canceled|deadline_exceeded",pod_name="l1"}[5m])))'}}, {exp_labels: {severity: critical, pod_name: l1}, exp_annotations: {summary: "BanyanDB l1 p99 query latency is high", description: "p99 gRPC query latency on l1 is 9.95 s, above 5 s for 10m.", graph: 'histogram_quantile(0.99, sum by (le) (rate(banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",status!~"canceled|deadline_exceeded",pod_name="l1"}[5m])))'}}]}

  # a pod where 1% of the requests take 5-10 s and the rest 0.05 s has a p99 below 1 s: rare slow requests do not fire.
  - name: query-latency-p99-ignores-rare-slow-requests
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="0.05"}', values: '0+594x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="0.1"}', values: '0+594x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="0.25"}', values: '0+594x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="0.5"}', values: '0+594x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="1"}', values: '0+594x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="2.5"}', values: '0+594x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="5"}', values: '0+594x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="30"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="60"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="r1",service="measure",status="ok",le="+Inf"}', values: '0+600x40'}
    alert_rule_test:
      - {eval_time: 30m, alertname: BanyanDBQueryLatencyHigh, exp_alerts: []}
  # the lifecycle sidecar is not a BanyanDB node: its GC pauses do not alert, a data container's do.
  - name: gc-pause-ignores-lifecycle
    interval: 1m
    input_series:
      - {series: 'go_gc_duration_seconds_sum{job="fodc-proxy",pod_name="a",container_name="lifecycle"}', values: '0+30x40'}
      - {series: 'go_gc_duration_seconds_count{job="fodc-proxy",pod_name="a",container_name="lifecycle"}', values: '0+60x40'}
      - {series: 'go_gc_duration_seconds_sum{job="fodc-proxy",pod_name="a",container_name="data"}', values: '0+0.06x40'}
      - {series: 'go_gc_duration_seconds_count{job="fodc-proxy",pod_name="a",container_name="data"}', values: '0+60x40'}
      - {series: 'go_gc_duration_seconds_sum{job="fodc-proxy",pod_name="b",container_name="data"}', values: '0+30x40'}
      - {series: 'go_gc_duration_seconds_count{job="fodc-proxy",pod_name="b",container_name="data"}', values: '0+60x40'}
    alert_rule_test:
      - eval_time: 30m
        alertname: BanyanDBGCPauseHigh
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: b, container_name: data}
            exp_annotations:
              summary: "BanyanDB b GC pauses are long"
              description: "Average GC pause of data on b is 0.500s per GC cycle (5m average), above the 0.1s threshold for 15m."
              graph: 'rate(go_gc_duration_seconds_sum{job="fodc-proxy",pod_name="b",container_name="data"}[5m]) / rate(go_gc_duration_seconds_count{job="fodc-proxy",pod_name="b",container_name="data"}[5m])'

  # the scheduler panic metrics are gauges that exist from process start: one first appearing on a pod scraped for 20m is not a new-series event.
  - name: panic-scheduler-gauge-has-no-new-series-term
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '1000+30x120'}
      - {series: 'banyandb_measure_scheduler_tasks_panic{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '_x40 2x80'}
    alert_rule_test:
      - {eval_time: 21m, alertname: BanyanDBPanic, exp_alerts: []}

  # a process restart keeps the pod name: the second first-event of a counter (1 -> series gone -> 1) is reported late,
  # once 15m ago falls into the gap between the two series (36m); at 26m 15m ago still has the old series.
  - name: panic-second-event-after-process-restart-is-late
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '1000+30x39 0+30x60'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '_x10 1x29 stale _x9 1x50'}
    alert_rule_test:
      - {eval_time: 6m, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "1 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}
      - {eval_time: 26m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 36m, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "1 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}

  # a hot measure node averages 3s per merge for the whole window (threshold 2s): fires; the 0.5s node does not.
  - name: merge-latency-hot-measure-slow
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '0+30x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '0+10x60'}
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="hot"}', values: '0+5x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="hot"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, engine: measure, tier: hot_or_untiered, pod_name: a, node_type: hot}
            exp_annotations:
              summary: "BanyanDB a measure merge latency is high"
              description: "Average duration of one measure file merge on a (hot or untiered node) over the last 30m is 3.00s, above 2s for 15m."
              graph: 'sum(rate(banyandb_measure_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m])) / sum(rate(banyandb_measure_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m]))'

  # a warm measure node at 3s per merge is the normal case for large historical parts: nothing fires.
  - name: merge-latency-warm-measure-normal
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="warm"}', values: '0+30x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="warm"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts: []

  # one 25s merge on a cold node in the window is below the 60s threshold; a cold node averaging 70s fires.
  - name: merge-latency-cold-measure-single-merge
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="cold"}', values: '0x20 25x40'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="cold"}', values: '0x20 1x40'}
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="cold"}', values: '0+700x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="cold"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, engine: measure, tier: warm_cold, pod_name: b, node_type: cold}
            exp_annotations:
              summary: "BanyanDB b measure merge latency is high"
              description: "Average duration of one measure file merge on b (warm/cold node) over the last 30m is 70.00s, above 60s for 15m."
              graph: 'sum(rate(banyandb_measure_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="b"}[30m])) / sum(rate(banyandb_measure_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="b"}[30m]))'

  # no merge in the window: the denominator is 0, the result is empty and nothing fires.
  - name: merge-latency-no-merge-in-window
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '5x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '3x60'}
      - {series: 'banyandb_stream_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '5x60'}
      - {series: 'banyandb_stream_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '3x60'}
      - {series: 'banyandb_trace_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="fast"}', values: '5x60'}
      - {series: 'banyandb_trace_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="fast"}', values: '3x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts: []

  # trace's slow lane has one 40s merge while the fast lane merges 100 times a minute: the pod average stays far below 5s.
  - name: merge-latency-trace-slow-lane-is-averaged
    interval: 1m
    input_series:
      - {series: 'banyandb_trace_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="fast"}', values: '0+15x60'}
      - {series: 'banyandb_trace_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="fast"}', values: '0+100x60'}
      - {series: 'banyandb_trace_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="slow"}', values: '0x30 40x30'}
      - {series: 'banyandb_trace_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="slow"}', values: '0x30 1x30'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts: []

  # loop_started is 100 per minute against 1 merge of 6s per minute: the average is 6s and fires (divided by loop_started it would be 0.06s).
  - name: merge-latency-loop-started-does-not-dilute
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '0+6x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '0+1x60'}
      - {series: 'banyandb_measure_total_merge_loop_started{job="fodc-proxy",container_name="data",pod_name="a",node_type="hot"}', values: '0+100x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, engine: measure, tier: hot_or_untiered, pod_name: a, node_type: hot}
            exp_annotations:
              summary: "BanyanDB a measure merge latency is high"
              description: "Average duration of one measure file merge on a (hot or untiered node) over the last 30m is 6.00s, above 2s for 15m."
              graph: 'sum(rate(banyandb_measure_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m])) / sum(rate(banyandb_measure_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m]))'

  # hot stream (threshold 1s) fires at 1.5s per merge and hot trace (threshold 5s) fires at 6s per merge; 0.9s and 4s do not.
  - name: merge-latency-stream-and-trace-hot-thresholds
    interval: 1m
    input_series:
      - {series: 'banyandb_stream_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '0+15x60'}
      - {series: 'banyandb_stream_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot"}', values: '0+10x60'}
      - {series: 'banyandb_stream_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="hot"}', values: '0+9x60'}
      - {series: 'banyandb_stream_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="hot"}', values: '0+10x60'}
      - {series: 'banyandb_trace_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="fast"}', values: '0+60x60'}
      - {series: 'banyandb_trace_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a",node_type="hot",lane="fast"}', values: '0+10x60'}
      - {series: 'banyandb_trace_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="hot",lane="fast"}', values: '0+40x60'}
      - {series: 'banyandb_trace_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="b",node_type="hot",lane="fast"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, engine: stream, tier: hot_or_untiered, pod_name: a, node_type: hot}
            exp_annotations:
              summary: "BanyanDB a stream merge latency is high"
              description: "Average duration of one stream file merge on a (hot or untiered node) over the last 30m is 1.50s, above 1s for 15m."
              graph: 'sum(rate(banyandb_stream_tst_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m])) / sum(rate(banyandb_stream_tst_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m]))'
          - exp_labels: {severity: warning, engine: trace, tier: hot_or_untiered, pod_name: a, node_type: hot}
            exp_annotations:
              summary: "BanyanDB a trace merge latency is high"
              description: "Average duration of one trace file merge on a (hot or untiered node) over the last 30m is 6.00s, above 5s for 15m."
              graph: 'sum(rate(banyandb_trace_tst_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m])) / sum(rate(banyandb_trace_tst_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m]))'

  # panic_total and the plugin telemetry panics are registered at their first event: the event that creates the series is counted (one pod each).
  - name: panic-first-event-lazily-registered-counters
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n1"}', values: '1000+30x120'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="n1"}', values: '_x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n6"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_pipeline_plugin_telemetry_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="n6"}', values: '_x40 1x80'}
    alert_rule_test:
      - eval_time: 21m
        alertname: BanyanDBPanic
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: n1}
            exp_annotations: {summary: "BanyanDB n1 recovered from a panic", description: "1 panics were recovered on n1 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="n1"}'}
          - exp_labels: {severity: critical, pod_name: n6}
            exp_annotations: {summary: "BanyanDB n6 recovered from a panic", description: "1 panics were recovered on n6 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="n6"}'}

  # the pre-registered counters exist with value 0 from start-up: their first event (0 -> 1 at 20m, more than the 15m
  # window after the pods started) is a plain increase and counted once; the series appeared with its pod, so the
  # new-series term adds nothing.
  - name: panic-preregistered-counter-first-event
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="liaison",pod_name="n2"}', values: '1000+30x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n3"}', values: '1000+30x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n4"}', values: '1000+30x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n5"}', values: '1000+30x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n7"}', values: '1000+30x120'}
      - {series: 'banyandb_liaison_grpc_total_panic{job="fodc-proxy",instance="px",container_name="liaison",pod_name="n2"}', values: '0x40 1x80'}
      - {series: 'banyandb_measure_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="n3"}', values: '0x40 1x80'}
      - {series: 'banyandb_stream_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="n4"}', values: '0x40 1x80'}
      - {series: 'banyandb_trace_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="n5"}', values: '0x40 1x80'}
      - {series: 'banyandb_trace_tst_total_merge_panic_recovered{job="fodc-proxy",instance="px",container_name="data",pod_name="n7"}', values: '0x40 1x80'}
    alert_rule_test:
      - {eval_time: 19m, alertname: BanyanDBPanic, exp_alerts: []}
      - eval_time: 21m
        alertname: BanyanDBPanic
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: n2}
            exp_annotations: {summary: "BanyanDB n2 recovered from a panic", description: "1 panics were recovered on n2 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="n2"}'}
          - exp_labels: {severity: critical, pod_name: n3}
            exp_annotations: {summary: "BanyanDB n3 recovered from a panic", description: "1 panics were recovered on n3 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="n3"}'}
          - exp_labels: {severity: critical, pod_name: n4}
            exp_annotations: {summary: "BanyanDB n4 recovered from a panic", description: "1 panics were recovered on n4 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="n4"}'}
          - exp_labels: {severity: critical, pod_name: n5}
            exp_annotations: {summary: "BanyanDB n5 recovered from a panic", description: "1 panics were recovered on n5 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="n5"}'}
          - exp_labels: {severity: critical, pod_name: n7}
            exp_annotations: {summary: "BanyanDB n7 recovered from a panic", description: "1 panics were recovered on n7 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="n7"}'}
      - {eval_time: 40m, alertname: BanyanDBPanic, exp_alerts: []}

  # every panic counter and scheduler gauge has an increase term: a counter growing by 1 is counted (one pod each).
  - name: panic-increase-every-counter
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i1"}', values: '1000+30x120'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="i1"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i2"}', values: '1000+30x120'}
      - {series: 'banyandb_liaison_grpc_total_panic{job="fodc-proxy",instance="px",container_name="data",pod_name="i2"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i3"}', values: '1000+30x120'}
      - {series: 'banyandb_measure_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="i3"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i4"}', values: '1000+30x120'}
      - {series: 'banyandb_stream_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="i4"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i5"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="i5"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i6"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_pipeline_plugin_telemetry_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="i6"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i7"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_total_merge_panic_recovered{job="fodc-proxy",instance="px",container_name="data",pod_name="i7"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i8"}', values: '1000+30x120'}
      - {series: 'banyandb_observability_scheduler_tasks_panic{job="fodc-proxy",instance="px",container_name="data",pod_name="i8"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i9"}', values: '1000+30x120'}
      - {series: 'banyandb_measure_scheduler_tasks_panic{job="fodc-proxy",instance="px",container_name="data",pod_name="i9"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i10"}', values: '1000+30x120'}
      - {series: 'banyandb_stream_storage_scheduler_tasks_panic{job="fodc-proxy",instance="px",container_name="data",pod_name="i10"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="i11"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_storage_scheduler_tasks_panic{job="fodc-proxy",instance="px",container_name="data",pod_name="i11"}', values: '5x40 6x80'}
    alert_rule_test:
      - eval_time: 21m
        alertname: BanyanDBPanic
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: i1}
            exp_annotations: {summary: "BanyanDB i1 recovered from a panic", description: "1 panics were recovered on i1 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i1"}'}
          - exp_labels: {severity: critical, pod_name: i2}
            exp_annotations: {summary: "BanyanDB i2 recovered from a panic", description: "1 panics were recovered on i2 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i2"}'}
          - exp_labels: {severity: critical, pod_name: i3}
            exp_annotations: {summary: "BanyanDB i3 recovered from a panic", description: "1 panics were recovered on i3 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i3"}'}
          - exp_labels: {severity: critical, pod_name: i4}
            exp_annotations: {summary: "BanyanDB i4 recovered from a panic", description: "1 panics were recovered on i4 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i4"}'}
          - exp_labels: {severity: critical, pod_name: i5}
            exp_annotations: {summary: "BanyanDB i5 recovered from a panic", description: "1 panics were recovered on i5 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i5"}'}
          - exp_labels: {severity: critical, pod_name: i6}
            exp_annotations: {summary: "BanyanDB i6 recovered from a panic", description: "1 panics were recovered on i6 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i6"}'}
          - exp_labels: {severity: critical, pod_name: i7}
            exp_annotations: {summary: "BanyanDB i7 recovered from a panic", description: "1 panics were recovered on i7 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i7"}'}
          - exp_labels: {severity: critical, pod_name: i8}
            exp_annotations: {summary: "BanyanDB i8 recovered from a panic", description: "1 panics were recovered on i8 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i8"}'}
          - exp_labels: {severity: critical, pod_name: i9}
            exp_annotations: {summary: "BanyanDB i9 recovered from a panic", description: "1 panics were recovered on i9 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i9"}'}
          - exp_labels: {severity: critical, pod_name: i10}
            exp_annotations: {summary: "BanyanDB i10 recovered from a panic", description: "1 panics were recovered on i10 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i10"}'}
          - exp_labels: {severity: critical, pod_name: i11}
            exp_annotations: {summary: "BanyanDB i11 recovered from a panic", description: "1 panics were recovered on i11 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="i11"}'}

  # every counted result of the trace plugin metrics alerts, as an increase (f1-f4, f9) and as a new series (f5-f8): panic, length_mismatch, late,
  # circuit_open and sampler_load_failed. decide_error and timeout (pods n1-n4) and successes (n5) do not count.
  - name: trace-plugin-failures-every-result
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f1"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="f1",group="g",result="panic"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f2"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="f2",group="g",result="length_mismatch"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f3"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="f3",group="g",result="late"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f4"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",instance="px",container_name="data",pod_name="f4"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f5"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",instance="px",container_name="data",pod_name="f5"}', values: '_x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f6"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",instance="px",container_name="data",pod_name="f6",group="g",result="circuit_open"}', values: '_x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f7"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="f7",group="g",result="length_mismatch"}', values: '_x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f8"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="f8",group="g",result="late"}', values: '_x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="f9"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",instance="px",container_name="data",pod_name="f9",group="g",result="circuit_open"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n1"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="n1",group="g",result="decide_error"}', values: '5x40 9x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n2"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",instance="px",container_name="data",pod_name="n2",group="g",result="timeout"}', values: '5x40 9x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n3"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="n3",group="g",result="decide_error"}', values: '_x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n4"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",instance="px",container_name="data",pod_name="n4",group="g",result="timeout"}', values: '_x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="n5"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="n5",group="g",result="success"}', values: '5x40 9x80'}
    alert_rule_test:
      - eval_time: 21m
        alertname: BanyanDBTracePluginFailures
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: f1}
            exp_annotations: {summary: "BanyanDB f1 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f1 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f1"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f1"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f1"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f2}
            exp_annotations: {summary: "BanyanDB f2 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f2 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f2"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f2"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f2"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f3}
            exp_annotations: {summary: "BanyanDB f3 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f3 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f3"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f3"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f3"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f4}
            exp_annotations: {summary: "BanyanDB f4 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f4 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f4"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f4"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f4"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f5}
            exp_annotations: {summary: "BanyanDB f5 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f5 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f5"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f5"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f5"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f6}
            exp_annotations: {summary: "BanyanDB f6 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f6 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f6"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f6"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f6"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f7}
            exp_annotations: {summary: "BanyanDB f7 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f7 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f7"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f7"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f7"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f8}
            exp_annotations: {summary: "BanyanDB f8 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f8 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f8"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f8"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f8"}, "metric", "sampler_load_failed", "", "")'}
          - exp_labels: {severity: critical, pod_name: f9}
            exp_annotations: {summary: "BanyanDB f9 trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on f9 in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="f9"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="f9"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="f9"}, "metric", "sampler_load_failed", "", "")'}

  # a retry_exhausted counter that grows by 1 alerts (the increase term); another error_type growing does not.
  - name: queue-retry-exhausted-increase
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="liaison",pod_name="l1"}', values: '1000+30x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",instance="px",container_name="liaison",pod_name="l1",error_type="retry_exhausted"}', values: '5x40 6x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="liaison",pod_name="l2"}', values: '1000+30x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",instance="px",container_name="liaison",pod_name="l2",error_type="send_error"}', values: '5x40 9x80'}
    alert_rule_test:
      - eval_time: 21m
        alertname: BanyanDBQueueRetryExhausted
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: l1}
            exp_annotations: {summary: "BanyanDB l1 exhausted its queue publish retries", description: "l1 gave up 1 queue publishes after exhausting retries in the last 15m (threshold: > 0).", graph: 'banyandb_queue_pub_total_err{job="fodc-proxy",error_type="retry_exhausted",pod_name="l1"}'}

  # the stream and trace forced-retention counters exist with value 0 from start-up: the first deletion (0 -> 1 at 20m) is an increase (the measure one is in first-event-other-rules).
  - name: forced-retention-first-event-stream-and-trace
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="s"}', values: '1000+30x120'}
      - {series: 'banyandb_storage_retention_stream_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="s"}', values: '0x40 1x80'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="t"}', values: '1000+30x120'}
      - {series: 'banyandb_storage_retention_trace_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="t"}', values: '0x40 1x80'}
    alert_rule_test:
      - eval_time: 21m
        alertname: BanyanDBForcedRetentionDeletion
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: s}
            exp_annotations: {summary: "BanyanDB s deleted data early because the disk is nearly full", description: "1 segments were deleted by forced retention on s in the last 30m (threshold: > 0); stored data was lost.", graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="s"}'}
          - exp_labels: {severity: critical, pod_name: t}
            exp_annotations: {summary: "BanyanDB t deleted data early because the disk is nearly full", description: "1 segments were deleted by forced retention on t in the last 30m (threshold: > 0); stored data was lost.", graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="t"}'}

  # disk usage as a percentage of the used_percent ratio: 85% warns after 10m, 95% is critical after 5m (and warns too); another kind and a lower usage do not alert.
  - name: disk-usage-warning-and-critical
    interval: 1m
    input_series:
      - {series: 'banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="a",path="/data"}', values: '0.85x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="b",path="/data"}', values: '0.95x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",kind="free",pod_name="c",path="/data"}', values: '0.99x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="d",path="/data"}', values: '0.5x40'}
    alert_rule_test:
      - {eval_time: 4m, alertname: BanyanDBDiskUsageHigh, exp_alerts: []}
      - eval_time: 7m
        alertname: BanyanDBDiskUsageHigh
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: b}
            exp_annotations: {summary: "BanyanDB b disk usage is high", description: "The fullest storage path on b is 95.0% full, above 90% for 5m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark).", graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="b"}'}
      - eval_time: 15m
        alertname: BanyanDBDiskUsageHigh
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a}
            exp_annotations: {summary: "BanyanDB a disk usage is high", description: "The fullest storage path on a is 85.0% full, above 80% for 10m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark).", graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="a"}'}
          - exp_labels: {severity: critical, pod_name: b}
            exp_annotations: {summary: "BanyanDB b disk usage is high", description: "The fullest storage path on b is 95.0% full, above 90% for 5m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark).", graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="b"}'}
          - exp_labels: {severity: warning, pod_name: b}
            exp_annotations: {summary: "BanyanDB b disk usage is high", description: "The fullest storage path on b is 95.0% full, above 80% for 10m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark).", graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="b"}'}

  # memory protector usage against its limit: 70% warns after 10m, 85% is critical after 5m (and warns too); a zero limit does not divide.
  - name: memory-protector-warning-and-critical
    interval: 1m
    input_series:
      - {series: 'banyandb_memory_protector_usage{job="fodc-proxy",pod_name="a"}', values: '70x40'}
      - {series: 'banyandb_memory_protector_limit{job="fodc-proxy",pod_name="a"}', values: '100x40'}
      - {series: 'banyandb_memory_protector_usage{job="fodc-proxy",pod_name="b"}', values: '85x40'}
      - {series: 'banyandb_memory_protector_limit{job="fodc-proxy",pod_name="b"}', values: '100x40'}
      - {series: 'banyandb_memory_protector_usage{job="fodc-proxy",pod_name="c"}', values: '50x40'}
      - {series: 'banyandb_memory_protector_limit{job="fodc-proxy",pod_name="c"}', values: '0x40'}
      - {series: 'banyandb_memory_protector_usage{job="fodc-proxy",pod_name="d"}', values: '10x40'}
      - {series: 'banyandb_memory_protector_limit{job="fodc-proxy",pod_name="d"}', values: '100x40'}
    alert_rule_test:
      - {eval_time: 4m, alertname: BanyanDBMemoryProtectorHigh, exp_alerts: []}
      - eval_time: 7m
        alertname: BanyanDBMemoryProtectorHigh
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: b}
            exp_annotations: {summary: "BanyanDB b memory protector usage is high", description: "The memory protector on b is at 85.0% of its limit, above 80% for 5m.", graph: '100 * banyandb_memory_protector_usage{job="fodc-proxy",pod_name="b"} / banyandb_memory_protector_limit{job="fodc-proxy",pod_name="b"}'}
      - eval_time: 15m
        alertname: BanyanDBMemoryProtectorHigh
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a}
            exp_annotations: {summary: "BanyanDB a memory protector usage is high", description: "The memory protector on a is at 70.0% of its limit, above 65% for 10m.", graph: '100 * banyandb_memory_protector_usage{job="fodc-proxy",pod_name="a"} / banyandb_memory_protector_limit{job="fodc-proxy",pod_name="a"}'}
          - exp_labels: {severity: critical, pod_name: b}
            exp_annotations: {summary: "BanyanDB b memory protector usage is high", description: "The memory protector on b is at 85.0% of its limit, above 80% for 5m.", graph: '100 * banyandb_memory_protector_usage{job="fodc-proxy",pod_name="b"} / banyandb_memory_protector_limit{job="fodc-proxy",pod_name="b"}'}
          - exp_labels: {severity: warning, pod_name: b}
            exp_annotations: {summary: "BanyanDB b memory protector usage is high", description: "The memory protector on b is at 85.0% of its limit, above 65% for 10m.", graph: '100 * banyandb_memory_protector_usage{job="fodc-proxy",pod_name="b"} / banyandb_memory_protector_limit{job="fodc-proxy",pod_name="b"}'}

  # only canceled and stream_canceled errors grow (2 per minute each): a client hanging up is not an error. A flat
  # retry_exhausted series is quiet as well.
  - name: error-rate-canceled-only-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="canceled"}', values: '0+1x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="stream_canceled"}', values: '0+1x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="retry_exhausted"}', values: '7x120'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBErrorRateHigh"}
        eval_time: 8m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBErrorRateHigh"}
        eval_time: 20m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBErrorRateHigh"}
        eval_time: 60m
        exp_samples: []

  # a real error_type (retry_exhausted) next to the two cancel types: only it counts (1 per minute); pending after a
  # minute, firing once above 0 for 10m.
  - name: error-rate-other-error-type-fires
    interval: 1m
    input_series:
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="canceled"}', values: '0+1x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="stream_canceled"}', values: '0+1x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="retry_exhausted"}', values: '0+1x120'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBErrorRateHigh",alertstate="firing"}
        eval_time: 8m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBErrorRateHigh",alertstate="firing"}
        eval_time: 14m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBErrorRateHigh", alertstate="firing", severity="warning"}', value: 1}

  # liaison gRPC errors have no cancel types and still count; the queue-publisher counter with a cancel type next to it
  # does not add.
  - name: error-rate-grpc-error-and-cancel-types-mixed
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",service="measure",method="write"}', values: '0+1x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="canceled"}', values: '0+10x120'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBErrorRateHigh",alertstate="firing"}
        eval_time: 14m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBErrorRateHigh", alertstate="firing", severity="warning"}', value: 1}

  # a BydbQL request is counted again by the service it is dispatched to; its own `bydbql` series jumps from 20 to 100
  # req/s while the measure queries stay at 20 req/s: the rule does not read the bydbql series, so nothing fires.
  - name: query-rate-spike-only-bydbql-doubles
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",pod_name="l0",service="measure",method="query"}', values: '0+1200x190'}
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",pod_name="l0",service="bydbql",method="query"}', values: '0+1200x120 150000+6000x69'}
    alert_rule_test:
      - {eval_time: 125m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}
      - {eval_time: 160m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}
      - {eval_time: 185m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}

  # the measure queries go from 20 to 100 req/s while the bydbql series stays at 10 req/s: fires, and the value does not
  # include the bydbql series.
  - name: query-rate-spike-real-queries-with-bydbql-noise
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",pod_name="l0",service="measure",method="query"}', values: '0+1200x120 150000+6000x69'}
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",pod_name="l0",service="bydbql",method="query"}', values: '0+600x190'}
    alert_rule_test:
      - {eval_time: 125m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}
      - eval_time: 160m
        alertname: BanyanDBQueryRateSpike
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "BanyanDB query rate spiked"
              description: "The query rate is 100.00 group queries/s (a request is counted once per group), above 3x the median rate of the hour that ended one hour ago plus 5 group queries/s, for 15m."
              graph: 'sum(rate(banyandb_liaison_grpc_total_started{job="fodc-proxy",service!="bydbql",method="query"}[5m]))'

  # the real writes (800 points/s) stop at 130m, and BanyanDB keeps writing its own log stream (group _monitoring_log, 4
  # points/s) the whole time: WriteStalled still fires (150m) and WriteRateDrop fires (175m); the log stream neither
  # hides the stop nor counts for the baseline. Without the group filter the total would never be below 0.1 points/s.
  - name: write-stalled-only-monitoring-log-still-writing
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+48000x130 6240000x120'}
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="_monitoring_log"}', values: '0+240x250'}
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="d0",container_name="data",group="_monitoring_log"}', values: '0+240x250'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 125m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 150m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="firing", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBWriteRateDrop",alertstate="firing"}
        eval_time: 175m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteRateDrop", alertstate="firing", severity="warning"}', value: 1}

  # the real writes (800 points/s) stop at 130m while BanyanDB's native self-monitoring group _monitoring keeps writing
  # 100 points/s: WriteStalled fires (150m) and the recorded rate is 0 after the stop; the system group neither hides
  # the stop nor counts for the baseline.
  - name: write-stalled-only-monitoring-group-still-writing
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+48000x130 6240000x120'}
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="_monitoring"}', values: '0+6000x250'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    promql_expr_test:
      - expr: banyandb:write_rate:sum
        eval_time: 100m
        exp_samples:
          - {labels: 'banyandb:write_rate:sum', value: 800}
      - expr: banyandb:write_rate:sum
        eval_time: 150m
        exp_samples:
          - {labels: 'banyandb:write_rate:sum', value: 0}
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 125m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 150m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="firing", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBWriteRateDrop",alertstate="firing"}
        eval_time: 175m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteRateDrop", alertstate="firing", severity="warning"}', value: 1}

  # 1 liaison and 2 data nodes advance, each data node has an advancing lifecycle sidecar, and BanyanDB counts 4 nodes
  # (one data node that never reported): the sidecars are not counted as nodes, so the node nobody saw is still
  # reported (1 missing). Counting the sidecars as advancing nodes would hide it.
  - name: node-missing-sidecar-does-not-hide-unseen-node
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '4x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '4x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="lifecycle",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '4x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="lifecycle",pod_name="d1"}', values: '1000+60x40'}
    alert_rule_test:
      - {eval_time: 4m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - eval_time: 12m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "BanyanDB nodes are missing"
              description: "1 of the nodes BanyanDB itself counts (DNS discovery) neither advance nor have an alert of their own, for 5m."
              graph: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy"}'

  # the lifecycle sidecar of d0 stops advancing at 10m (its series keeps the last value) and the sidecar of d1 is gone
  # at 10m: neither is a node that BanyanDB discovers, so nothing fires; the nodes themselves keep advancing.
  - name: node-missing-sidecar-stopped-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x60'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '3x60'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x60'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '3x60'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="lifecycle",pod_name="d0"}', values: '1000+60x10 1600x50'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '1000+60x60'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d1"}', values: '3x60'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="lifecycle",pod_name="d1"}', values: '1000+60x10 stale'}
    alert_rule_test:
      - {eval_time: 20m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 40m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 58m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # after the real writes stop (130m) OAP still writes one row a minute (0.017 points/s, more than the largest idle
  # value of the verification cluster, 0.014): with the 0.1 points/s threshold WriteStalled fires at 150m. A rule that
  # needs the rate to be exactly 0 would never fire here.
  - name: write-stalled-idle-background-writes-still-fire
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+48000x130 6240000x120'}
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="sw_records"}', values: '0+1x250'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 125m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 150m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="firing", severity="critical"}', value: 1}

  # real writes of 120 points/s stop at 130m while the log stream keeps writing 100 points/s: including the log stream
  # the current rate (100) would stay above half of the real baseline (120), without it the current rate is 0 and
  # WriteRateDrop fires at 175m.
  - name: write-rate-drop-ignores-log-stream-volume
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+7200x130 936000x120'}
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="_monitoring_log"}', values: '0+6000x250'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteRateDrop"}
        eval_time: 125m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteRateDrop",alertstate="firing"}
        eval_time: 175m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteRateDrop", alertstate="firing", severity="warning"}', value: 1}

  # a quiet cluster that still writes 5 points/s (above 0.1) and a cluster at 800 points/s that only has BanyanDB's own log
  # stream (group _monitoring_log) next to it: neither WriteStalled nor WriteRateDrop fires. The baseline of WriteRateDrop without the log
  # stream is 5 points/s (below its 100 points/s margin), so the rule has nothing to compare against.
  - name: write-stalled-low-but-live-traffic-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="sw_records"}', values: '0+300x250'}
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="_monitoring_log"}', values: '0+48000x130 6240000x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 200m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteRateDrop"}
        eval_time: 200m
        exp_samples: []

  # several storage paths of one pod over the line (all on one filesystem: the same value): one alert per pod and
  # severity, not one per path. Pod `a` has four paths at 85% (warning only), pod `b` has three paths at 92% and one at
  # 50% (warning and critical), pod `c` has one path at 85% and one at 92% (the fullest one decides: warning and
  # critical). The alert carries no path label; the annotations are checked for pod `a` and `b`.
  - name: disk-usage-several-paths-one-alert-per-pod
    interval: 1m
    input_series:
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="a",path="/tmp/measure",kind="used_percent"}', values: '0.85x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="a",path="/tmp/stream",kind="used_percent"}', values: '0.85x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="a",path="/tmp/trace",kind="used_percent"}', values: '0.85x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="a",path="/tmp/property",kind="used_percent"}', values: '0.85x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="b",path="/tmp/measure",kind="used_percent"}', values: '0.92x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="b",path="/tmp/stream",kind="used_percent"}', values: '0.92x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="b",path="/tmp/trace",kind="used_percent"}', values: '0.92x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="b",path="/other",kind="used_percent"}', values: '0.5x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="c",path="/tmp/measure",kind="used_percent"}', values: '0.85x40'}
      - {series: 'banyandb_system_disk{job="fodc-proxy",pod_name="c",path="/data2",kind="used_percent"}', values: '0.92x40'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBDiskUsageHigh",alertstate="firing"}
        eval_time: 12m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBDiskUsageHigh", alertstate="firing", pod_name="a", severity="warning"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBDiskUsageHigh", alertstate="firing", pod_name="b", severity="warning"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBDiskUsageHigh", alertstate="firing", pod_name="b", severity="critical"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBDiskUsageHigh", alertstate="firing", pod_name="c", severity="warning"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBDiskUsageHigh", alertstate="firing", pod_name="c", severity="critical"}', value: 1}
    alert_rule_test:
      - eval_time: 12m
        alertname: BanyanDBDiskUsageHigh
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a}
            exp_annotations:
              summary: "BanyanDB a disk usage is high"
              description: "The fullest storage path on a is 85.0% full, above 80% for 10m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark)."
              graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="a"}'
          - exp_labels: {severity: warning, pod_name: b}
            exp_annotations:
              summary: "BanyanDB b disk usage is high"
              description: "The fullest storage path on b is 92.0% full, above 80% for 10m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark)."
              graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="b"}'
          - exp_labels: {severity: warning, pod_name: c}
            exp_annotations:
              summary: "BanyanDB c disk usage is high"
              description: "The fullest storage path on c is 92.0% full, above 80% for 10m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark)."
              graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="c"}'
          - exp_labels: {severity: critical, pod_name: b}
            exp_annotations:
              summary: "BanyanDB b disk usage is high"
              description: "The fullest storage path on b is 92.0% full, above 90% for 5m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark)."
              graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="b"}'
          - exp_labels: {severity: critical, pod_name: c}
            exp_annotations:
              summary: "BanyanDB c disk usage is high"
              description: "The fullest storage path on c is 92.0% full, above 90% for 5m (writes are rejected at 95% by default; liaison: *-max-disk-usage-percent, data: *-retention-high-watermark)."
              graph: '100 * banyandb_system_disk{job="fodc-proxy",kind="used_percent",pod_name="c"}'

  # shard 1 is stuck (age grows 60s per minute, above 300 from 6m on), shard 0 is healthy: the max over the shards fires. A rule that reads one series per pod (the sum of the shards, or an unaggregated gauge with a shard label) would be hidden by the healthy shard. Pending from 6m, firing from 11m (for: 5m).
  - name: write-queue-stuck-one-shard-of-two
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g",shard="0"}', values: '0x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g",shard="1"}', values: '0+60x60'}
    alert_rule_test:
      - {eval_time: 5m, alertname: BanyanDBWriteQueueStuck, exp_alerts: []}
      - {eval_time: 10m30s, alertname: BanyanDBWriteQueueStuck, exp_alerts: []}
      - eval_time: 11m
        alertname: BanyanDBWriteQueueStuck
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: l0}
            exp_annotations:
              summary: "BanyanDB l0 write queue is stuck"
              description: "The oldest part in the liaison write queue of l0 has waited 660s to be synced to the data nodes, above 300s and still growing for 5m; a data node may be frozen or unreachable."
              graph: 'max by (group, shard) ({__name__=~"banyandb_(measure|stream_tst|trace_tst)_oldest_unsynced_part_age_seconds",job="fodc-proxy",container_name="liaison",pod_name="l0"})'
      - eval_time: 20m
        alertname: BanyanDBWriteQueueStuck
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: l0}
            exp_annotations:
              summary: "BanyanDB l0 write queue is stuck"
              description: "The oldest part in the liaison write queue of l0 has waited 1200s to be synced to the data nodes, above 300s and still growing for 5m; a data node may be frozen or unreachable."
              graph: 'max by (group, shard) ({__name__=~"banyandb_(measure|stream_tst|trace_tst)_oldest_unsynced_part_age_seconds",job="fodc-proxy",container_name="liaison",pod_name="l0"})'

  # the age ramps 60s per minute, so the sample at 5m is exactly 300 (not above the threshold: no pending state at all at 5m) and the one at 6m is 360 (pending). `>= 300` would be pending at 5m.
  - name: write-queue-stuck-age-threshold
    interval: 1m
    input_series:
      - {series: 'banyandb_stream_tst_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="a",group="g",shard="0"}', values: '0+60x60'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck"}
        eval_time: 5m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck"}
        eval_time: 6m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteQueueStuck", alertstate="pending", pod_name="a", severity="critical"}', value: 1}

  # a series that FODC keeps exporting after the liaison dropped it stays at its last value. `frozen` is 400 for the whole hour (never grew): no pending, no firing. `thenfrozen` grows to 600 over 10m and is then flat: it fires at 11m (age above 300 and still +240 over the last 5m) and resolves once the 5m delta has fallen below 60, long before the hour is over. A rule without the delta condition would fire for `frozen` and never resolve `thenfrozen`.
  - name: write-queue-stuck-frozen-series-quiet-and-resolves
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="frozen",group="g",shard="0"}', values: '400x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="thenfrozen",group="g",shard="0"}', values: '0+60x10 600x50'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",pod_name="frozen"}
        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",pod_name="frozen"}
        eval_time: 59m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",pod_name="thenfrozen",alertstate="firing"}
        eval_time: 11m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteQueueStuck", alertstate="firing", pod_name="thenfrozen", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",pod_name="thenfrozen"}
        eval_time: 25m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",pod_name="thenfrozen"}
        eval_time: 59m
        exp_samples: []

  # the age is above 300 but grows only 5s per minute (+25s over 5m, below the 60s the rule needs; a queue stuck on one part grows 60s per minute): quiet.
  - name: write-queue-stuck-slow-drift-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g",shard="0"}', values: '400+5x60'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck"}
        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck"}
        eval_time: 50m
        exp_samples: []

  # a healthy shard whose age stays frozen at 400 next to a growing one in the same pod: the growing one alone makes the pod fire (the frozen series does not hide it and does not fire by itself).
  - name: write-queue-stuck-frozen-and-growing-in-one-pod
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="deleted",shard="0"}', values: '400x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="live",shard="0"}', values: '0+30x60'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck"}
        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",alertstate="firing"}
        eval_time: 25m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteQueueStuck", alertstate="firing", pod_name="l0", severity="critical"}', value: 1}

  # the age is above 300 from 6m. `short` grows to 540 (above 300 from 6m to 9m), then the queue is empty again (0): pending for 3m at most, never fires. `long` grows to 720 (above 300 from 6m to 12m): pending at 10m30s, firing at 11m (exactly for: 5m), resolved once the age is 0 again.
  - name: write-queue-stuck-for-boundary
    interval: 1m
    input_series:
      - {series: 'banyandb_trace_tst_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="short",group="g",shard="0"}', values: '0+60x9 0x50'}
      - {series: 'banyandb_trace_tst_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="long",group="g",shard="0"}', values: '0+60x12 0x50'}
    alert_rule_test:
      - {eval_time: 10m30s, alertname: BanyanDBWriteQueueStuck, exp_alerts: []}
      - {eval_time: 11m, alertname: BanyanDBWriteQueueStuck, exp_alerts: [{exp_labels: {severity: critical, pod_name: long}, exp_annotations: {summary: "BanyanDB long write queue is stuck", description: "The oldest part in the liaison write queue of long has waited 660s to be synced to the data nodes, above 300s and still growing for 5m; a data node may be frozen or unreachable.", graph: 'max by (group, shard) ({__name__=~"banyandb_(measure|stream_tst|trace_tst)_oldest_unsynced_part_age_seconds",job="fodc-proxy",container_name="liaison",pod_name="long"})'}}]}
      - {eval_time: 14m, alertname: BanyanDBWriteQueueStuck, exp_alerts: []}
      - {eval_time: 30m, alertname: BanyanDBWriteQueueStuck, exp_alerts: []}

  # three shards (and two groups) each waiting 200s: the sum is 600 but no single part has waited more than 300s, so nothing is pending. The alert is on the oldest part, not on a total.
  - name: write-queue-stuck-many-moderate-shards-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g",shard="0"}', values: '200x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g",shard="1"}', values: '200x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g",shard="2"}', values: '200x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g2",shard="0"}', values: '200x60'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck"}
        eval_time: 10m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck"}
        eval_time: 30m
        exp_samples: []

  # each engine alerts on its own pod; the same gauge on a data node (container_name="data") is ignored; a queue that is empty (0) is quiet. The ages grow 60s per minute.
  - name: write-queue-stuck-engines-and-containers
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="m",group="g",shard="0"}', values: '0+60x60'}
      - {series: 'banyandb_stream_tst_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="s",group="g",shard="0"}', values: '0+60x60'}
      - {series: 'banyandb_trace_tst_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="t",group="g",shard="0"}', values: '0+60x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="data",pod_name="d",group="g",shard="0"}', values: '0+60x60'}
      - {series: 'banyandb_measure_oldest_unsynced_part_age_seconds{job="fodc-proxy",container_name="liaison",pod_name="z",group="g",shard="0"}', values: '0x60'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",alertstate="firing"}
        eval_time: 20m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteQueueStuck", alertstate="firing", pod_name="m", severity="critical"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBWriteQueueStuck", alertstate="firing", pod_name="s", severity="critical"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBWriteQueueStuck", alertstate="firing", pod_name="t", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBWriteQueueStuck",pod_name=~"d|z"}
        eval_time: 20m
        exp_samples: []

  # the counter exists from group open with value 0 (10 samples), the first failure makes it 1: increase() sees it, no new-series term needed. Fires at once (for: 0m) and resolves once the increment leaves the 15m window.
  - name: sync-parts-failed-first-increment-from-zero
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g"}', values: '0x10 1x50'}
    alert_rule_test:
      - {eval_time: 9m, alertname: BanyanDBSyncPartsFailed, exp_alerts: []}
      - eval_time: 11m
        alertname: BanyanDBSyncPartsFailed
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: l0}
            exp_annotations:
              summary: "BanyanDB l0 dropped parts it could not sync"
              description: "l0 gave up syncing 1 parts to the data nodes in the last 15m (threshold: > 0): the sync retries ran out and the parts left the write queue. BanyanDB tries to copy them to the failed-parts directory and the copy can fail, check the liaison log."
              graph: 'sum({__name__=~"banyandb_(measure|stream_tst|trace_tst)_total_sync_failed_parts",job="fodc-proxy",container_name="liaison",pod_name="l0"})'
      - {eval_time: 24m, alertname: BanyanDBSyncPartsFailed, exp_alerts: [{exp_labels: {severity: critical, pod_name: l0}, exp_annotations: {summary: "BanyanDB l0 dropped parts it could not sync", description: "l0 gave up syncing 1 parts to the data nodes in the last 15m (threshold: > 0): the sync retries ran out and the parts left the write queue. BanyanDB tries to copy them to the failed-parts directory and the copy can fail, check the liaison log.", graph: 'sum({__name__=~"banyandb_(measure|stream_tst|trace_tst)_total_sync_failed_parts",job="fodc-proxy",container_name="liaison",pod_name="l0"})'}}]}
      - {eval_time: 27m, alertname: BanyanDBSyncPartsFailed, exp_alerts: []}
      - {eval_time: 50m, alertname: BanyanDBSyncPartsFailed, exp_alerts: []}

  # the three engines on the same pod with every label equal except __name__: no "same labelset" error, each engine counts once and the three add up (3 parts). A pod whose counters stay 0, and the same counter on a data node, stay quiet.
  - name: sync-parts-failed-three-engines-identical-labels
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g"}', values: '0x5 1x40'}
      - {series: 'banyandb_stream_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g"}', values: '0x5 1x40'}
      - {series: 'banyandb_trace_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l0",group="g"}', values: '0x5 1x40'}
      - {series: 'banyandb_measure_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l1",group="g"}', values: '0x45'}
      - {series: 'banyandb_stream_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l1",group="g"}', values: '0x45'}
      - {series: 'banyandb_trace_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l1",group="g"}', values: '0x45'}
      - {series: 'banyandb_measure_total_sync_failed_parts{job="fodc-proxy",container_name="data",pod_name="d0",group="g"}', values: '0x5 4x40'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed",alertstate="firing"}
        eval_time: 8m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBSyncPartsFailed", alertstate="firing", pod_name="l0", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed",pod_name=~"l1|d0"}
        eval_time: 8m
        exp_samples: []
      - expr: sum(increase({__name__=~"banyandb_(measure|stream_tst|trace_tst)_total_sync_failed_parts",container_name="liaison",pod_name="l0"}[15m]))
        eval_time: 8m
        exp_samples:
          - {labels: '{}', value: 3}

  # a failure in only one engine fires for its pod: measure on lm, stream on ls, trace on lt.
  - name: sync-parts-failed-each-engine-alone
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="lm",group="g"}', values: '0x5 1x40'}
      - {series: 'banyandb_stream_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="ls",group="g"}', values: '0x5 1x40'}
      - {series: 'banyandb_trace_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="lt",group="g"}', values: '0x5 1x40'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed",alertstate="firing"}
        eval_time: 8m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBSyncPartsFailed", alertstate="firing", pod_name="lm", severity="critical"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBSyncPartsFailed", alertstate="firing", pod_name="ls", severity="critical"}', value: 1}
          - {labels: 'ALERTS{alertname="BanyanDBSyncPartsFailed", alertstate="firing", pod_name="lt", severity="critical"}', value: 1}

  # a restart resets the counter to 0 (5 -> 0): increase() corrects the reset and reads 0; a series that disappears and comes back at 0 is not an event either.
  - name: sync-parts-failed-counter-reset-and-new-series
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="r",group="g"}', values: '5x10 0x40'}
      - {series: 'banyandb_stream_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="n",group="g"}', values: '5x10 stale _x2 0x37'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed"}
        eval_time: 9m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed"}
        eval_time: 11m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed"}
        eval_time: 13m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed"}
        eval_time: 30m
        exp_samples: []

  # a counter that FODC keeps exporting after the liaison dropped it stays at its last value (3 failed parts, flat for the whole hour): increase() is 0, nothing is pending or firing.
  - name: sync-parts-failed-frozen-series-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l0",group="deleted"}', values: '3x60'}
      - {series: 'banyandb_stream_tst_total_sync_failed_parts{job="fodc-proxy",container_name="liaison",pod_name="l0",group="deleted2"}', values: '7x60'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed"}
        eval_time: 1m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed"}
        eval_time: 30m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBSyncPartsFailed"}
        eval_time: 59m
        exp_samples: []

  # the counter exists with value 0 from start-up (service="stream", method="write"): the first failed write stream (0 -> 1 at 20m) is an increase, no new-series term and no up_time needed. Resolves once the increment leaves the 15m window (36m).
  - name: stream-write-errors-first-error-from-zero
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_stream_err{job="fodc-proxy",container_name="liaison",pod_name="l0",service="stream",method="write"}', values: '0x20 1x60'}
    alert_rule_test:
      - {eval_time: 19m, alertname: BanyanDBStreamWriteErrors, exp_alerts: []}
      - eval_time: 21m
        alertname: BanyanDBStreamWriteErrors
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: l0}
            exp_annotations:
              summary: "BanyanDB l0 write streams ended with an error"
              description: "1 write streams of l0 ended with an error in the last 15m (threshold: > 0); client cancellations and expired deadlines are not counted. Common causes: a client sent an invalid stream, or a data node stayed busy until the client deadline."
              graph: 'banyandb_liaison_grpc_total_stream_err{job="fodc-proxy",pod_name="l0"}'
      - eval_time: 30m
        alertname: BanyanDBStreamWriteErrors
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: l0}
            exp_annotations:
              summary: "BanyanDB l0 write streams ended with an error"
              description: "1 write streams of l0 ended with an error in the last 15m (threshold: > 0); client cancellations and expired deadlines are not counted. Common causes: a client sent an invalid stream, or a data node stayed busy until the client deadline."
              graph: 'banyandb_liaison_grpc_total_stream_err{job="fodc-proxy",pod_name="l0"}'
      - {eval_time: 40m, alertname: BanyanDBStreamWriteErrors, exp_alerts: []}

  # the series already exists (value 3) and grows by 2: increase() counts it (2 errors).
  - name: stream-write-errors-increase-on-existing-series
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_stream_err{job="fodc-proxy",container_name="liaison",pod_name="l0",service="stream",method="write"}', values: '3x30 5x30'}
    alert_rule_test:
      - {eval_time: 25m, alertname: BanyanDBStreamWriteErrors, exp_alerts: []}
      - eval_time: 31m
        alertname: BanyanDBStreamWriteErrors
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: l0}
            exp_annotations:
              summary: "BanyanDB l0 write streams ended with an error"
              description: "2 write streams of l0 ended with an error in the last 15m (threshold: > 0); client cancellations and expired deadlines are not counted. Common causes: a client sent an invalid stream, or a data node stayed busy until the client deadline."
              graph: 'banyandb_liaison_grpc_total_stream_err{job="fodc-proxy",pod_name="l0"}'

  # quiet: a pod without a stream_err series, a flat old series, and a series that first appears with a value of 1 (no 0 before): the rule reads increase() only, so it stays quiet.
  - name: stream-write-errors-quiet-cases
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="liaison",pod_name="a"}', values: '1000+60x80'}
      - {series: 'banyandb_liaison_grpc_total_stream_err{job="fodc-proxy",instance="px",container_name="liaison",pod_name="b",service="stream",method="write"}', values: '4x80'}
      - {series: 'banyandb_liaison_grpc_total_stream_err{job="fodc-proxy",instance="px",container_name="liaison",pod_name="c",service="stream",method="write"}', values: '_x20 1x60'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBStreamWriteErrors"}
        eval_time: 21m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBStreamWriteErrors"}
        eval_time: 30m
        exp_samples: []

  # a pre-registered counter whose first event (0 -> 1 at 5m) falls inside the 15m window after the pod started: counted
  # once.
  - name: panic-preregistered-first-event-within-window
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="liaison",pod_name="w1"}', values: '1000+30x120'}
      - {series: 'banyandb_liaison_grpc_total_panic{job="fodc-proxy",instance="px",container_name="liaison",pod_name="w1"}', values: '0x10 1x110'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="w2"}', values: '1000+30x120'}
      - {series: 'banyandb_measure_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="w2"}', values: '0x10 1x110'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="w3"}', values: '1000+30x120'}
      - {series: 'banyandb_stream_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="w3"}', values: '0x10 1x110'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="w4"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="w4"}', values: '0x10 1x110'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="w5"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_total_merge_panic_recovered{job="fodc-proxy",instance="px",container_name="data",pod_name="w5"}', values: '0x10 1x110'}
    alert_rule_test:
      - eval_time: 6m
        alertname: BanyanDBPanic
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: w1}
            exp_annotations: {summary: "BanyanDB w1 recovered from a panic", description: "1 panics were recovered on w1 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="w1"}'}
          - exp_labels: {severity: critical, pod_name: w2}
            exp_annotations: {summary: "BanyanDB w2 recovered from a panic", description: "1 panics were recovered on w2 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="w2"}'}
          - exp_labels: {severity: critical, pod_name: w3}
            exp_annotations: {summary: "BanyanDB w3 recovered from a panic", description: "1 panics were recovered on w3 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="w3"}'}
          - exp_labels: {severity: critical, pod_name: w4}
            exp_annotations: {summary: "BanyanDB w4 recovered from a panic", description: "1 panics were recovered on w4 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="w4"}'}
          - exp_labels: {severity: critical, pod_name: w5}
            exp_annotations: {summary: "BanyanDB w5 recovered from a panic", description: "1 panics were recovered on w5 in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="w5"}'}
      - {eval_time: 30m, alertname: BanyanDBPanic, exp_alerts: []}

  # the pre-registered forced retention counters (0 -> 1): the measure one 10m after the pod started (inside the 30m
  # window), the stream and trace ones 40m after (outside it); each is counted once.
  - name: forced-retention-preregistered-first-event-every-counter
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="fm"}', values: '1000+30x240'}
      - {series: 'banyandb_storage_retention_measure_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="fm"}', values: '0x20 1x220'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="fs"}', values: '1000+30x240'}
      - {series: 'banyandb_storage_retention_stream_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="fs"}', values: '0x80 1x160'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="ft"}', values: '1000+30x240'}
      - {series: 'banyandb_storage_retention_trace_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="ft"}', values: '0x80 1x160'}
    alert_rule_test:
      - eval_time: 12m
        alertname: BanyanDBForcedRetentionDeletion
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: fm}
            exp_annotations: {summary: "BanyanDB fm deleted data early because the disk is nearly full", description: "1 segments were deleted by forced retention on fm in the last 30m (threshold: > 0); stored data was lost.", graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="fm"}'}
      - eval_time: 42m
        alertname: BanyanDBForcedRetentionDeletion
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: fs}
            exp_annotations: {summary: "BanyanDB fs deleted data early because the disk is nearly full", description: "1 segments were deleted by forced retention on fs in the last 30m (threshold: > 0); stored data was lost.", graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="fs"}'}
          - exp_labels: {severity: critical, pod_name: ft}
            exp_annotations: {summary: "BanyanDB ft deleted data early because the disk is nearly full", description: "1 segments were deleted by forced retention on ft in the last 30m (threshold: > 0); stored data was lost.", graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="ft"}'}
      - {eval_time: 80m, alertname: BanyanDBForcedRetentionDeletion, exp_alerts: []}

  # a cluster that never had traffic (an idle docker single-node: the written counters stay at 0) is not reported as
  # stalled.
  - name: write-stalled-no-writes-ever-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0x300'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x400'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 30m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 90m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 250m
        exp_samples: []

  # OAP's idle writes (one row a minute, 0.017 points/s) stay far below the 0.1 points/s threshold: never
  # reported.
  - name: write-stalled-idle-writes-only-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="sw_records"}', values: '0+1x300'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x400'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 90m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 250m
        exp_samples: []

  # a cluster that wrote 0.5 points/s for 100m and then stopped is reported (0.5 is above 0.1 points/s): pending from
  # about 105m, firing from 115m.
  - name: write-stalled-low-traffic-then-stop-fires
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+30x100 3000x200'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x400'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 110m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 130m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="firing", severity="critical"}', value: 1}

  # 100 points/s until 130m, then nothing: pending from 135m, firing from 145m, and still firing 3h after the last write
  # (the 10-day look-back is far from over).
  - name: write-stalled-after-traffic-fires-and-keeps-firing
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+6000x130 780000x300'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x500'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="pending"}
        eval_time: 140m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="pending", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 140m
        exp_samples: []
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 150m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="firing", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 310m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="firing", severity="critical"}', value: 1}

  # the writes resume at 200m (100 points/s again): the alert is gone once the 5m rate is above 0.1 points/s.
  - name: write-stalled-resolves-when-writes-resume
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+6000x130 780000x70 780000+6000x100'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x400'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBWriteStalled",alertstate="firing"}
        eval_time: 199m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBWriteStalled", alertstate="firing", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBWriteStalled"}
        eval_time: 210m
        exp_samples: []

  # banyandb:write_rate:sum is recorded while a node reports its up time (here 0 writes, and the _monitoring_log group
  # excluded), and not at all when no up time series exists.
  - name: write-rate-recording-needs-up-time
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="g"}', values: '0+6000x60'}
      - {series: 'banyandb_stream_tst_total_written{job="fodc-proxy",pod_name="l0",container_name="liaison",group="_monitoring_log"}', values: '0+240x60'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x30 _x30'}
    promql_expr_test:
      - expr: banyandb:write_rate:sum
        eval_time: 20m
        exp_samples:
          - {labels: 'banyandb:write_rate:sum', value: 100}
      - expr: banyandb:write_rate:sum
        eval_time: 50m
        exp_samples: []

  # the same without any written counter: with an up time the rate is recorded as 0 (the idle docker single node);
  # without BanyanDB nothing is recorded.
  - name: write-rate-recording-zero-and-absent
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x30'}
    promql_expr_test:
      - expr: banyandb:write_rate:sum
        eval_time: 20m
        exp_samples:
          - {labels: 'banyandb:write_rate:sum', value: 0}
      - expr: banyandb:write_rate:sum{job="none"} or count(banyandb_system_up_time{pod_name="x"})
        eval_time: 20m
        exp_samples: []

  # d1 never reported and d0 froze at 10m (7 nodes counted by BanyanDB, 5 advancing): the per-pod term reports d0 and
  # the cluster term still reports the one node nobody else explains; before d0 froze only the cluster term fires.
  - name: node-missing-unexplained-node-and-frozen-node
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x10 1600x30'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '7x40'}
    alert_rule_test:
      - eval_time: 15m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "BanyanDB nodes are missing"
              description: "1 of the nodes BanyanDB itself counts (DNS discovery) neither advance nor have an alert of their own, for 5m."
              graph: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy"}'
      - eval_time: 25m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: d0, container_name: data}
            exp_annotations:
              summary: "BanyanDB data node d0 is missing"
              description: "The up time of BanyanDB data node d0 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d0",container_name="data"}'
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "BanyanDB nodes are missing"
              description: "1 of the nodes BanyanDB itself counts (DNS discovery) neither advance nor have an alert of their own, for 5m."
              graph: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy"}'

  # d1 never reported; d3 has no sample from 11m to 15m (a restart gap, shorter than the 5m `for` of its own term): the
  # cluster term keeps firing for d1 the whole time, d3 being listed by the per-pod term does not hide it.
  - name: node-missing-cluster-term-keeps-firing-while-another-node-restarts
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="liaison",pod_name="l1"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d2"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '1000+60x10 _x5 30+60x24'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d3"}', values: '7x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",container_name="data",pod_name="d4"}', values: '7x40'}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBNodeMissing",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBNodeMissing", alertstate="firing", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBNodeMissing",alertstate="firing"}
        eval_time: 14m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBNodeMissing", alertstate="firing", severity="critical"}', value: 1}
      - expr: ALERTS{alertname="BanyanDBNodeMissing",alertstate="firing"}
        eval_time: 30m
        exp_samples:
          - {labels: 'ALERTS{alertname="BanyanDBNodeMissing", alertstate="firing", severity="critical"}', value: 1}

  # the only node stops reporting at 10m (its series goes stale): pending until 21m, fires after the 10m `for`, and
  # resolves once the node reports again at 52m. The alert carries the job label of the selector.
  - name: metrics-absent-fires-and-recovers
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="banyandb"}', values: '1000+60x10 stale _x40 100+60x20'}
    alert_rule_test:
      - {eval_time: 15m, alertname: BanyanDBMetricsAbsent, exp_alerts: []}
      - {eval_time: 20m, alertname: BanyanDBMetricsAbsent, exp_alerts: []}
      - eval_time: 25m
        alertname: BanyanDBMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: critical, job: fodc-proxy}
            exp_annotations:
              summary: "BanyanDB metrics are absent"
              description: "No banyandb_system_up_time series from job fodc-proxy for 10m; BanyanDB or FODC is down, or the scrape is failing."
              graph: 'count(banyandb_system_up_time{job="fodc-proxy"})'
      - {eval_time: 60m, alertname: BanyanDBMetricsAbsent, exp_alerts: []}

  # a node that keeps reporting never triggers it.
  - name: metrics-absent-quiet-while-reporting
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="banyandb"}', values: '1000+60x60'}
    alert_rule_test:
      - {eval_time: 30m, alertname: BanyanDBMetricsAbsent, exp_alerts: []}
      - {eval_time: 60m, alertname: BanyanDBMetricsAbsent, exp_alerts: []}

  # an up time series of another job does not count as BanyanDB reporting.
  - name: metrics-absent-other-job-does-not-count
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="other",container_name="liaison",pod_name="banyandb"}', values: '1000+60x60'}
    alert_rule_test:
      - eval_time: 25m
        alertname: BanyanDBMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: critical, job: fodc-proxy}
            exp_annotations:
              summary: "BanyanDB metrics are absent"
              description: "No banyandb_system_up_time series from job fodc-proxy for 10m; BanyanDB or FODC is down, or the scrape is failing."
              graph: 'count(banyandb_system_up_time{job="fodc-proxy"})'

  # stream and trace on warm/cold nodes: one 25s merge in the window is below the 60s threshold, a node averaging 70s
  # fires (a warm node for stream, a cold node for trace; the trace series carry a lane label that the sum drops).
  - name: merge-latency-warm-cold-stream-and-trace
    interval: 1m
    input_series:
      - {series: 'banyandb_stream_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="sa",node_type="cold"}', values: '0x20 25x40'}
      - {series: 'banyandb_stream_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="sa",node_type="cold"}', values: '0x20 1x40'}
      - {series: 'banyandb_stream_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="sb",node_type="warm"}', values: '0+700x60'}
      - {series: 'banyandb_stream_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="sb",node_type="warm"}', values: '0+10x60'}
      - {series: 'banyandb_trace_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="ta",node_type="warm",lane="fast"}', values: '0x20 25x40'}
      - {series: 'banyandb_trace_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="ta",node_type="warm",lane="fast"}', values: '0x20 1x40'}
      - {series: 'banyandb_trace_tst_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="tb",node_type="cold",lane="fast"}', values: '0+700x60'}
      - {series: 'banyandb_trace_tst_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="tb",node_type="cold",lane="fast"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, engine: stream, tier: warm_cold, pod_name: sb, node_type: warm}
            exp_annotations:
              summary: "BanyanDB sb stream merge latency is high"
              description: "Average duration of one stream file merge on sb (warm/cold node) over the last 30m is 70.00s, above 60s for 15m."
              graph: 'sum(rate(banyandb_stream_tst_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="sb"}[30m])) / sum(rate(banyandb_stream_tst_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="sb"}[30m]))'
          - exp_labels: {severity: warning, engine: trace, tier: warm_cold, pod_name: tb, node_type: cold}
            exp_annotations:
              summary: "BanyanDB tb trace merge latency is high"
              description: "Average duration of one trace file merge on tb (warm/cold node) over the last 30m is 70.00s, above 60s for 15m."
              graph: 'sum(rate(banyandb_trace_tst_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="tb"}[30m])) / sum(rate(banyandb_trace_tst_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="tb"}[30m]))'

  # 3.8 of 4 CPUs (95% of GOMAXPROCS): above both thresholds, warning and critical fire.
  - name: cpu-high-critical
    interval: 1m
    input_series:
      - {series: 'process_cpu_seconds_total{job="fodc-proxy",pod_name="c",container_name="data"}', values: '0+228x40'}
      - {series: 'go_sched_gomaxprocs_threads{job="fodc-proxy",pod_name="c",container_name="data"}', values: '4x40'}
    alert_rule_test:
      - eval_time: 30m
        alertname: BanyanDBCPUHigh
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: c, container_name: data}
            exp_annotations:
              summary: "BanyanDB c CPU usage is high"
              description: "CPU usage of the data container on c is 95% of its GOMAXPROCS (go_sched_gomaxprocs_threads), above 90% for 15m. GOMAXPROCS is the CPU quota rounded down (at least 1) or the GOMAXPROCS setting, so it can differ from the container CPU limit."
              graph: 'max(rate(process_cpu_seconds_total{job="fodc-proxy",pod_name="c",container_name="data"}[5m])) / max(go_sched_gomaxprocs_threads{job="fodc-proxy",pod_name="c",container_name="data"})'
          - exp_labels: {severity: warning, pod_name: c, container_name: data}
            exp_annotations:
              summary: "BanyanDB c CPU usage is high"
              description: "CPU usage of the data container on c is 95% of its GOMAXPROCS (go_sched_gomaxprocs_threads), above 80% for 15m. GOMAXPROCS is the CPU quota rounded down (at least 1) or the GOMAXPROCS setting, so it can differ from the container CPU limit."
              graph: 'max(rate(process_cpu_seconds_total{job="fodc-proxy",pod_name="c",container_name="data"}[5m])) / max(go_sched_gomaxprocs_threads{job="fodc-proxy",pod_name="c",container_name="data"})'

  # two fodc-proxy instances export the same process (each reads 2 of 4 CPUs): the usage is 50%, not the sum of both.
  - name: cpu-high-same-process-from-two-instances
    interval: 1m
    input_series:
      - {series: 'process_cpu_seconds_total{job="fodc-proxy",instance="px1",pod_name="a",container_name="data"}', values: '0+120x40'}
      - {series: 'go_sched_gomaxprocs_threads{job="fodc-proxy",instance="px1",pod_name="a",container_name="data"}', values: '4x40'}
      - {series: 'process_cpu_seconds_total{job="fodc-proxy",instance="px2",pod_name="a",container_name="data"}', values: '0+120x40'}
      - {series: 'go_sched_gomaxprocs_threads{job="fodc-proxy",instance="px2",pod_name="a",container_name="data"}', values: '4x40'}
    alert_rule_test:
      - {eval_time: 30m, alertname: BanyanDBCPUHigh, exp_alerts: []}

  # a counter that appears together with its pod with a value of 5 (an agent reconnecting with the counter's history) is
  # old history, not an event: none of the counters read by the panic and forced retention rules fires, inside or
  # outside the window.
  - name: counters-appearing-with-their-pod-do-not-fire
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="liaison",pod_name="h1"}', values: '1000+30x120'}
      - {series: 'banyandb_liaison_grpc_total_panic{job="fodc-proxy",instance="px",container_name="liaison",pod_name="h1"}', values: '5x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="h2"}', values: '1000+30x120'}
      - {series: 'banyandb_measure_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="h2"}', values: '5x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="h3"}', values: '1000+30x120'}
      - {series: 'banyandb_stream_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="h3"}', values: '5x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="h4"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_metadata_total_panics{job="fodc-proxy",instance="px",container_name="data",pod_name="h4"}', values: '5x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="h5"}', values: '1000+30x120'}
      - {series: 'banyandb_trace_tst_total_merge_panic_recovered{job="fodc-proxy",instance="px",container_name="data",pod_name="h5"}', values: '5x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="g1"}', values: '1000+30x120'}
      - {series: 'banyandb_storage_retention_measure_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="g1"}', values: '5x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="g2"}', values: '1000+30x120'}
      - {series: 'banyandb_storage_retention_stream_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="g2"}', values: '5x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="g3"}', values: '1000+30x120'}
      - {series: 'banyandb_storage_retention_trace_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="g3"}', values: '5x120'}
    alert_rule_test:
      - {eval_time: 5m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 10m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 5m, alertname: BanyanDBForcedRetentionDeletion, exp_alerts: []}
      - {eval_time: 20m, alertname: BanyanDBForcedRetentionDeletion, exp_alerts: []}

  # # the current segment is refilled from 0 to the size of the previous one (2000 series, 1.0x at most): nothing fires.
  # - name: series-growth-stable-refill-quiet
  #   interval: 1m
  #   input_series:
  #     - {series: 'banyandb_measure_series_count{job="fodc-proxy",container_name="data",pod_name="d0",group="g",node_type="hot"}', values: '0+40x50 2000x70'}
  #     - {series: 'banyandb_measure_series_count_previous{job="fodc-proxy",container_name="data",pod_name="d0",group="g",node_type="hot"}', values: '2000x120'}
  #   alert_rule_test:
  #     - {eval_time: 30m, alertname: BanyanDBSeriesGrowthHigh, exp_alerts: []}
  #     - {eval_time: 100m, alertname: BanyanDBSeriesGrowthHigh, exp_alerts: []}

  # # the current segment holds 2600 series, 1.3x the 2000 of the previous one, from 10m on: pending, then firing after 15m.
  # - name: series-growth-above-previous-fires
  #   interval: 1m
  #   input_series:
  #     - {series: 'banyandb_measure_series_count{job="fodc-proxy",container_name="data",pod_name="d0",group="g",node_type="hot"}', values: '0+260x10 2600x60'}
  #     - {series: 'banyandb_measure_series_count_previous{job="fodc-proxy",container_name="data",pod_name="d0",group="g",node_type="hot"}', values: '2000x70'}
  #   alert_rule_test:
  #     - {eval_time: 20m, alertname: BanyanDBSeriesGrowthHigh, exp_alerts: []}
  #     - eval_time: 30m
