      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="60"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="+Inf"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="0.05"}', values: '0+600x40'}
