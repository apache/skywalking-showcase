  #             description: "The current measure segment of group g has 1.50x the series of the previous segment, summed over the data nodes (threshold: > 1.2x, previous segment > 1000 series) for 15m."
  #             graph: '{__name__=~"banyandb_measure_series_count(_previous)?",job="fodc-proxy",group="g"}'

  # the fodc-proxy is replaced while data node d0 restarts: the series of the old proxy ends at 20m (a stale marker, as
  # Prometheus writes when a target disappears), the series of the new proxy starts at 21m with a smaller up time. The
  # instance and pod labels differ, and the restart is still reported.
  - name: node-restarted-proxy-replaced
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '1000+60x20 stale'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '_x21 10+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d1"}', values: '1000+60x20 stale'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d1"}', values: '_x21 2260+60x40'}
    alert_rule_test:
      - {eval_time: 19m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - eval_time: 22m
        alertname: BanyanDBNodeRestarted
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: d0, container_name: data}
            exp_annotations:
              summary: "BanyanDB d0 restarted"
              description: "The up time of data on d0 became smaller within the last 15m: the process restarted."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d0",container_name="data"}'
      - {eval_time: 40m, alertname: BanyanDBNodeRestarted, exp_alerts: []}

  # the same replacement without a stale marker: the last value of the old proxy is held for the 5m staleness lookback,
  # so the drop is seen when the lookback ends (25m) and not before.
  - name: node-restarted-proxy-replaced-without-stale-marker
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '1000+60x20'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '_x21 10+60x40'}
    alert_rule_test:
      - {eval_time: 22m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - eval_time: 27m
        alertname: BanyanDBNodeRestarted
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: d0, container_name: data}
            exp_annotations:
              summary: "BanyanDB d0 restarted"
              description: "The up time of data on d0 became smaller within the last 15m: the process restarted."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d0",container_name="data"}'

  # two fodc-proxy instances export the same data node d0 from 10m on, the new one 15s of up time behind the old one;
  # the old one ends at 21m (stale marker). The maximum stays above the old value, so nothing is reported.
  - name: node-restarted-proxy-handover-with-small-lag
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '1000+60x20 stale'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '_x10 1585+60x50'}
    alert_rule_test:
      - {eval_time: 15m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - {eval_time: 22m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - {eval_time: 40m, alertname: BanyanDBNodeRestarted, exp_alerts: []}

  # two fodc-proxy instances export the same three nodes (l0, d0, d1) and BanyanDB itself counts 4: the cluster term
  # counts nodes, not series, so one node is missing and it fires with 1 (not 4 - 6 < 0).
  - name: node-missing-two-proxies-one-unseen-node
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '4x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '4x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '4x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '4x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d1"}', values: '4x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d1"}', values: '4x40'}
    alert_rule_test:
      - eval_time: 15m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "BanyanDB nodes are missing"
              description: "1 of the nodes BanyanDB itself counts (DNS discovery) neither advance nor have an alert of their own, for 5m."
              graph: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy"}'
    # the cluster term has no 3m change window: it is pending from the start and fires after its 5m `for`.
    promql_expr_test:
      - {expr: 'ALERTS{alertname="BanyanDBNodeMissing",alertstate="firing"}', eval_time: 4m, exp_samples: []}
      - {expr: 'ALERTS{alertname="BanyanDBNodeMissing",alertstate="firing"}', eval_time: 6m, exp_samples: [{labels: 'ALERTS{alertname="BanyanDBNodeMissing", alertstate="firing", severity="critical"}', value: 1}]}

  # the same three nodes through two proxies, BanyanDB counts 3: nothing is missing.
  - name: node-missing-two-proxies-healthy
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '3x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '3x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '3x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '3x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d1"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d1"}', values: '3x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d1"}', values: '3x40'}
    alert_rule_test:
      - {eval_time: 15m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 38m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # d1 stops advancing on both proxies at 10m (a frozen node): only the per-pod term fires, once for d1; the cluster
  # term is 3 - 2 - 1 = 0.
  - name: node-missing-two-proxies-frozen-node
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '3x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '3x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '1000+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '3x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '3x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d1"}', values: '1000+60x10 1600x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d1"}', values: '1000+60x10 1600x30'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d1"}', values: '3x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d1"}', values: '3x40'}
    alert_rule_test:
      - eval_time: 25m
        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: d1, container_name: data}
            exp_annotations:
              summary: "BanyanDB data node d1 is missing"
              description: "The up time of BanyanDB data node d1 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d1",container_name="data"}'

  # the fodc-proxy is replaced at 20m (the old series ends with a stale marker, the new one starts at 21m) and every node
  # keeps advancing: neither term fires.
  - name: node-missing-proxy-replaced-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '1000+60x20 stale'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '_x21 2260+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="liaison",pod_name="l0"}', values: '2x20 stale'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="liaison",pod_name="l0"}', values: '_x21 2x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '1000+60x20 stale'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '_x21 2260+60x40'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.1:17913",pod="proxy-a",container_name="data",pod_name="d0"}', values: '2x20 stale'}
      - {series: 'banyandb_metadata_dns_discovery_total_nodes_count{job="fodc-proxy",instance="10.0.0.2:17913",pod="proxy-b",container_name="data",pod_name="d0"}', values: '_x21 2x40'}
    alert_rule_test:
      - {eval_time: 19m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 25m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 38m, alertname: BanyanDBNodeMissing, exp_alerts: []}
      - {eval_time: 55m, alertname: BanyanDBNodeMissing, exp_alerts: []}

  # the 0.01-0.05 s requests are ok; the slow ones (5-10 s) have status deadline_exceeded (the server context hit the
  # client's deadline) and are left out like the canceled ones: nothing fires.
  - name: query-latency-deadline-exceeded-requests-ignored
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.05"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="1"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="+Inf"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="deadline_exceeded",le="0.05"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="deadline_exceeded",le="1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="deadline_exceeded",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="deadline_exceeded",le="+Inf"}', values: '0+600x40'}
    alert_rule_test:
      - {eval_time: 30m, alertname: BanyanDBQueryLatencyHigh, exp_alerts: []}
      - {eval_time: 39m, alertname: BanyanDBQueryLatencyHigh, exp_alerts: []}

  # BanyanDBHostMemoryHigh: pod a stays at 85% (warning after 10m), pod b at 95% (critical after 5m, warning after
  # 10m), pod c at 50%, pod d has a 3m peak at 95% and pod e is a data container that reports 85% beside the liaison
  # of the same pod a name (one alert per container_name).
  - name: host-memory-warning-and-critical
    interval: 1m
    input_series:
      - {series: 'banyandb_system_memory_state{job="fodc-proxy",pod_name="a",container_name="data",kind="used_percent"}', values: '0.85x40'}
      - {series: 'banyandb_system_memory_state{job="fodc-proxy",pod_name="a",container_name="data",kind="used"}', values: '5e10x40'}
      - {series: 'banyandb_system_memory_state{job="fodc-proxy",pod_name="b",container_name="liaison",kind="used_percent"}', values: '0.95x40'}
      - {series: 'banyandb_system_memory_state{job="fodc-proxy",pod_name="c",container_name="data",kind="used_percent"}', values: '0.5x40'}
      - {series: 'banyandb_system_memory_state{job="fodc-proxy",pod_name="d",container_name="data",kind="used_percent"}', values: '0.5x10 0.95x3 0.5x27'}
    alert_rule_test:
      - {eval_time: 4m, alertname: BanyanDBHostMemoryHigh, exp_alerts: []}
      - eval_time: 7m
        alertname: BanyanDBHostMemoryHigh
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: b, container_name: liaison}
            exp_annotations: {summary: "BanyanDB b host memory usage is high", description: "The host memory seen by liaison on b is 95.0% used, above 90% for 5m.", graph: '100 * banyandb_system_memory_state{job="fodc-proxy",kind="used_percent",pod_name="b",container_name="liaison"}'}
      - eval_time: 15m
        alertname: BanyanDBHostMemoryHigh
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a, container_name: data}
            exp_annotations: {summary: "BanyanDB a host memory usage is high", description: "The host memory seen by data on a is 85.0% used, above 80% for 10m.", graph: '100 * banyandb_system_memory_state{job="fodc-proxy",kind="used_percent",pod_name="a",container_name="data"}'}
          - exp_labels: {severity: critical, pod_name: b, container_name: liaison}
            exp_annotations: {summary: "BanyanDB b host memory usage is high", description: "The host memory seen by liaison on b is 95.0% used, above 90% for 5m.", graph: '100 * banyandb_system_memory_state{job="fodc-proxy",kind="used_percent",pod_name="b",container_name="liaison"}'}
          - exp_labels: {severity: warning, pod_name: b, container_name: liaison}
            exp_annotations: {summary: "BanyanDB b host memory usage is high", description: "The host memory seen by liaison on b is 95.0% used, above 80% for 10m.", graph: '100 * banyandb_system_memory_state{job="fodc-proxy",kind="used_percent",pod_name="b",container_name="liaison"}'}

  # BanyanDBQueuePubBacklogGrowing: the in-flight count of liaison l0 to the data nodes sits at 5 for 60m and then rises
  # by 1 per minute. It fires once the lowest value of 30m is above the highest of the 30m before and has held for 15m.
  - name: queue-pub-backlog-rising
    interval: 1m
    input_series:
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="l0",operation="file-sync",remote_role="data",group="g",remote_node="d0"}', values: '100+10x159'}
      - {series: 'banyandb_queue_pub_total_finished{job="fodc-proxy",pod_name="l0",operation="file-sync",remote_role="data",group="g",remote_node="d0"}', values: '95+10x59 695+9x100'}
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="l0",operation="file-sync",remote_role="data",group="h",remote_node="d1"}', values: '100+10x159'}
      - {series: 'banyandb_queue_pub_total_finished{job="fodc-proxy",pod_name="l0",operation="file-sync",remote_role="data",group="h",remote_node="d1"}', values: '95+10x159'}
    alert_rule_test:
      - {eval_time: 95m, alertname: BanyanDBQueuePubBacklogGrowing, exp_alerts: []}
      - eval_time: 115m
        alertname: BanyanDBQueuePubBacklogGrowing
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: l0, operation: file-sync, remote_role: data}
            exp_annotations:
              summary: "BanyanDB l0 file-sync publishes to data nodes are piling up"
              description: "The file-sync publishes of l0 to data nodes that are started and not finished never fell below 35 in the last 30m, above their highest value in the 30m before, for 15m. A data node may be slow or unavailable."
              graph: 'banyandb:queue_pub_inflight{pod_name="l0",operation="file-sync",remote_role="data"}'

  # no finished series at all: every publish is in flight, so a started counter that keeps rising counts as a backlog.
  - name: queue-pub-backlog-no-finished-series
    interval: 1m
    input_series:
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="l0",operation="query",remote_role="data",group="g",remote_node="d0"}', values: '0+10x159'}
    alert_rule_test:
      - {eval_time: 40m, alertname: BanyanDBQueuePubBacklogGrowing, exp_alerts: []}
      - eval_time: 115m
        alertname: BanyanDBQueuePubBacklogGrowing
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: l0, operation: query, remote_role: data}
            exp_annotations:
              summary: "BanyanDB l0 query publishes to data nodes are piling up"
              description: "The query publishes of l0 to data nodes that are started and not finished never fell below 850 in the last 30m, above their highest value in the 30m before, for 15m. A data node may be slow or unavailable."
              graph: 'banyandb:queue_pub_inflight{pod_name="l0",operation="query",remote_role="data"}'

  # quiet: a baseline of 1998 in flight (a leaked count that never returns) with a 3m excursion of 8 every 20m (pod a);
  # a step from 5 to 130 that then stays flat (pod b, a data node restart that cut off publishes); a pod restart at 70m
  # that resets both counters (pod c); the liaison-to-liaison batch-write, whose started counter rises without a
  # finished one (pod d); a rollout where the in-flight count rises for 6m and falls back (pod e).
  - name: queue-pub-backlog-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="a",operation="query",remote_role="data"}', values: '2000+10x159'}
      - {series: 'banyandb_queue_pub_total_finished{job="fodc-proxy",pod_name="a",operation="query",remote_role="data"}', values: '2+10x19 10+10x2 32+10x16 40+10x2 62+10x16 70+10x2 92+10x16 100+10x2 122+10x16 130+10x2 152+10x16 160+10x2 182+10x16 190+10x2 212+10x16 220+10x2 242+10x1'}
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="b",operation="file-sync",remote_role="data"}', values: '105+10x79 905+10x79'}
      - {series: 'banyandb_queue_pub_total_finished{job="fodc-proxy",pod_name="b",operation="file-sync",remote_role="data"}', values: '100+10x59 775+10x99'}
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="c",operation="control",remote_role="data"}', values: '1000+10x69 0+10x89'}
      - {series: 'banyandb_queue_pub_total_finished{job="fodc-proxy",pod_name="c",operation="control",remote_role="data"}', values: '990+10x69 0+10x89'}
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="d",operation="batch-write",remote_role="liaison"}', values: '0+100x159'}
      - {series: 'banyandb_queue_pub_total_started{job="fodc-proxy",pod_name="e",operation="query",remote_role="data"}', values: '0+10x159'}
      - {series: 'banyandb_queue_pub_total_finished{job="fodc-proxy",pod_name="e",operation="query",remote_role="data"}', values: '0+10x79 800+9x6 854+10x1 860+10x79'}
    alert_rule_test:
      - {eval_time: 90m, alertname: BanyanDBQueuePubBacklogGrowing, exp_alerts: []}
      - {eval_time: 115m, alertname: BanyanDBQueuePubBacklogGrowing, exp_alerts: []}
      - {eval_time: 150m, alertname: BanyanDBQueuePubBacklogGrowing, exp_alerts: []}

  # BanyanDBTraceDropSetCeilingReached: the counter of pod a is created at 15m with value 1 (a new series, fires while
  # the series is younger than 30m), the counter of pod b exists at 0 and rises to 1 at 10m, the counter of pod c has
  # existed since the pod's first sample at a flat 5 (an agent that reconnected with its history), pod d has none.
  - name: trace-drop-set-ceiling
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",pod_name="a"}', values: '1000+60x60'}
      - {series: 'banyandb_trace_tst_pipeline_merges_ceiling_reached{job="fodc-proxy",pod_name="a",group="g",lane="fast"}', values: '_x15 1x45'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",pod_name="b"}', values: '1000+60x60'}
      - {series: 'banyandb_trace_tst_pipeline_merges_ceiling_reached{job="fodc-proxy",pod_name="b",group="g",lane="fast"}', values: '0x10 1x50'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",pod_name="c"}', values: '1000+60x60'}
      - {series: 'banyandb_trace_tst_pipeline_merges_ceiling_reached{job="fodc-proxy",pod_name="c",group="g",lane="fast"}', values: '5x60'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",pod_name="d"}', values: '1000+60x60'}
    alert_rule_test:
      - {eval_time: 8m, alertname: BanyanDBTraceDropSetCeilingReached, exp_alerts: []}
      - eval_time: 12m
        alertname: BanyanDBTraceDropSetCeilingReached
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: b}
            exp_annotations: {summary: "BanyanDB b trace merges reached the drop-set ceiling", description: "1 trace merges on b reached the drop-set ceiling in the last 30m, so the traces the plugin asked to drop were retained (threshold: > 0).", graph: 'banyandb_trace_tst_pipeline_merges_ceiling_reached{job="fodc-proxy",pod_name="b"}'}
      - eval_time: 17m
        alertname: BanyanDBTraceDropSetCeilingReached
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a}
            exp_annotations: {summary: "BanyanDB a trace merges reached the drop-set ceiling", description: "1 trace merges on a reached the drop-set ceiling in the last 30m, so the traces the plugin asked to drop were retained (threshold: > 0).", graph: 'banyandb_trace_tst_pipeline_merges_ceiling_reached{job="fodc-proxy",pod_name="a"}'}
          - exp_labels: {severity: warning, pod_name: b}
            exp_annotations: {summary: "BanyanDB b trace merges reached the drop-set ceiling", description: "1 trace merges on b reached the drop-set ceiling in the last 30m, so the traces the plugin asked to drop were retained (threshold: > 0).", graph: 'banyandb_trace_tst_pipeline_merges_ceiling_reached{job="fodc-proxy",pod_name="b"}'}
      - {eval_time: 55m, alertname: BanyanDBTraceDropSetCeilingReached, exp_alerts: []}
