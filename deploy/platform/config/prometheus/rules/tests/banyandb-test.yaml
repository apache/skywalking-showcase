        alertname: BanyanDBNodeMissing
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: l0, container_name: liaison}
            exp_annotations:
              summary: "BanyanDB liaison node l0 is missing"
              description: "The up time of BanyanDB liaison node l0 stopped advancing or its series is gone, although it reported within the last hour, for at least 8m."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="l0",container_name="liaison"}'

  # a cluster without tiers (no node_type label) is treated as hot: the merge latency of an untiered data node (3s per merge)
  # and of a standalone liaison fires, a warm node of the same latency stays quiet.
  - name: merge-latency-untiered-nodes
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="a"}', values: '0+30x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="a"}', values: '0+10x60'}
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="liaison",type="file",pod_name="s"}', values: '0+30x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="liaison",type="file",pod_name="s"}', values: '0+10x60'}
      - {series: 'banyandb_measure_total_merge_latency{job="fodc-proxy",container_name="data",type="file",pod_name="w",node_type="warm"}', values: '0+30x60'}
      - {series: 'banyandb_measure_total_merged{job="fodc-proxy",container_name="data",type="file",pod_name="w",node_type="warm"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 50m
        alertname: BanyanDBMergeLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, engine: measure, tier: hot_or_untiered, pod_name: a}
            exp_annotations:
              summary: "BanyanDB a measure merge latency is high"
              description: "Average duration of one measure file merge on a (hot or untiered node) over the last 30m is 3.00s, above 2s for 15m."
              graph: 'sum(rate(banyandb_measure_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m])) / sum(rate(banyandb_measure_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="a"}[30m]))'
          - exp_labels: {severity: warning, engine: measure, tier: hot_or_untiered, pod_name: s}
            exp_annotations:
              summary: "BanyanDB s measure merge latency is high"
              description: "Average duration of one measure file merge on s (hot or untiered node) over the last 30m is 3.00s, above 2s for 15m."
              graph: 'sum(rate(banyandb_measure_total_merge_latency{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="s"}[30m])) / sum(rate(banyandb_measure_total_merged{job="fodc-proxy",type="file",container_name=~"data|liaison",pod_name="s"}[30m]))'

  # writes stopped while up_time is reported -> WriteStalled and WriteRateDrop both fire.
  - name: write-stop-with-nodes-up
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="d0"}', values: '0+6000x70'}
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="d1"}', values: '0+6000x70 420000x100'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x200'}
    alert_rule_test:
      - {eval_time: 120m, alertname: BanyanDBWriteStalled, exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "BanyanDB has stopped receiving writes", description: "The cluster write rate (measure + stream + trace, without the BanyanDB self-monitoring groups _monitoring and _monitoring_log) is 0.00 points/s, below 0.1 points/s for the last 10m, after writes above 0.1 points/s within the 10 days before.", graph: 'sum(rate({__name__=~"banyandb_(measure|stream_tst|trace_tst)_total_written",job="fodc-proxy",group!~"_monitoring|_monitoring_log"}[5m]))'}}]}
      - {eval_time: 120m, alertname: BanyanDBWriteRateDrop, exp_alerts: [{exp_labels: {severity: warning}, exp_annotations: {summary: "BanyanDB write rate dropped by more than half", description: "The cluster write rate (without the BanyanDB self-monitoring groups _monitoring and _monitoring_log) is 0.00 points/s, below 50% of the median rate of the hour that ended one hour ago, for 15m.", graph: 'sum(rate({__name__=~"banyandb_(measure|stream_tst|trace_tst)_total_written",job="fodc-proxy",group!~"_monitoring|_monitoring_log"}[5m]))'}}]}

  # all metrics are gone (no up_time) -> neither fires; MetricsAbsent covers it.
  - name: write-stop-with-metrics-absent
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="d0"}', values: '0+6000x70'}
    alert_rule_test:
      - {eval_time: 120m, alertname: BanyanDBWriteStalled, exp_alerts: []}
      - {eval_time: 120m, alertname: BanyanDBWriteRateDrop, exp_alerts: []}

  # panic counters of different metrics on the same pod are summed per pod; a quiet pod stays quiet.
  - name: panic-per-pod
    interval: 1m
    input_series:
      - {series: 'banyandb_panic_total{job="fodc-proxy",pod_name="a",container_name="data",component="x"}', values: '5x5 6x30'}
      - {series: 'banyandb_liaison_grpc_total_panic{job="fodc-proxy",pod_name="a",container_name="liaison"}', values: '0x5 1x30'}
      - {series: 'banyandb_measure_scheduler_tasks_panic{job="fodc-proxy",pod_name="b",container_name="data"}', values: '0x5 1x30'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",pod_name="c",container_name="data"}', values: '9x35'}
    alert_rule_test:
      - {eval_time: 4m, alertname: BanyanDBPanic, exp_alerts: []}
      - eval_time: 8m
        alertname: BanyanDBPanic
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: a}
            exp_annotations:
              summary: "BanyanDB a recovered from a panic"
              description: "2 panics were recovered on a in the last 15m (threshold: > 0)."
              graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'
          - exp_labels: {severity: critical, pod_name: b}
            exp_annotations:
              summary: "BanyanDB b recovered from a panic"
              description: "1 panics were recovered on b in the last 15m (threshold: > 0)."
              graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="b"}'
      - {eval_time: 30m, alertname: BanyanDBPanic, exp_alerts: []}

  # no panic series at all -> no alert and no error.
  - name: panic-no-series
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="a"}', values: '1000+60x30'}
    alert_rule_test:
      - {eval_time: 20m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 20m, alertname: BanyanDBForcedRetentionDeletion, exp_alerts: []}
      - {eval_time: 20m, alertname: BanyanDBTracePluginFailures, exp_alerts: []}

  # forced retention per pod.
  - name: forced-retention-per-pod
    interval: 1m
    input_series:
      - {series: 'banyandb_storage_retention_measure_forced_retention_segments_deleted_total{job="fodc-proxy",pod_name="a"}', values: '0x5 1x30'}
      - {series: 'banyandb_storage_retention_stream_forced_retention_segments_deleted_total{job="fodc-proxy",pod_name="a"}', values: '0x5 1x30'}
      - {series: 'banyandb_storage_retention_trace_forced_retention_segments_deleted_total{job="fodc-proxy",pod_name="b"}', values: '0x5 1x30'}
    alert_rule_test:
      - eval_time: 8m
        alertname: BanyanDBForcedRetentionDeletion
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: a}
            exp_annotations:
              summary: "BanyanDB a deleted data early because the disk is nearly full"
              description: "2 segments were deleted by forced retention on a in the last 30m (threshold: > 0); stored data was lost."
              graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="a"}'
          - exp_labels: {severity: critical, pod_name: b}
            exp_annotations:
              summary: "BanyanDB b deleted data early because the disk is nearly full"
              description: "1 segments were deleted by forced retention on b in the last 30m (threshold: > 0); stored data was lost."
              graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="b"}'

  # only failing results count; the three sources of one pod add up; result="success" is ignored.
  - name: trace-plugin-failures-per-pod
    interval: 1m
    input_series:
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",pod_name="a",group="g",plugin_name="p",result="panic"}', values: '0x5 1x30'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",pod_name="a",group="g",plugin_name="p",result="success"}', values: '0+100x35'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",pod_name="a",group="g",result="circuit_open"}', values: '0x5 1x30'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",pod_name="a",group="g",result="success"}', values: '0+100x35'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",pod_name="b",group="g",plugin_name="p",result="success"}', values: '0+100x35'}
    alert_rule_test:
      - eval_time: 8m
        alertname: BanyanDBTracePluginFailures
        exp_alerts:
          - exp_labels: {severity: critical, pod_name: a}
            exp_annotations:
              summary: "BanyanDB a trace sampling plugin failed"
              description: "2 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on a in the last 30m (threshold: > 0)."
              graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="a"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="a"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="a"}, "metric", "sampler_load_failed", "", "")'

  # NodeRestarted keeps container_name: the up time of pod a drops from 1060 to 30 at 2m and the alert is gone when
  # that sample leaves the 15m window; the lifecycle sidecar of pod c restarts as well and is ignored; pod b keeps
  # advancing.
  - name: node-restarted-keeps-container
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="a"}', values: '1000 1060 30 90 150+60x30'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="b"}', values: '1000+60x40'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="lifecycle",pod_name="c"}', values: '1000 1060 30 90 150+60x30'}
    alert_rule_test:
      - eval_time: 4m
        alertname: BanyanDBNodeRestarted
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a, container_name: data}
            exp_annotations:
              summary: "BanyanDB a restarted"
              description: "The up time of data on a became smaller within the last 15m: the process restarted."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="a",container_name="data"}'
      - eval_time: 16m
        alertname: BanyanDBNodeRestarted
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a, container_name: data}
            exp_annotations:
              summary: "BanyanDB a restarted"
              description: "The up time of data on a became smaller within the last 15m: the process restarted."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="a",container_name="data"}'
      - {eval_time: 18m, alertname: BanyanDBNodeRestarted, exp_alerts: []}

  # a liaison whose up time falls from 3000 to 10 is reported, and the alert ends 15m after the drop (the drop is
  # between the samples at 10m and 11m).
  - name: node-restarted-up-time-drops
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '2400+60x10 10+60x40'}
    alert_rule_test:
      - {eval_time: 9m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - eval_time: 12m
        alertname: BanyanDBNodeRestarted
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: l0, container_name: liaison}
            exp_annotations:
              summary: "BanyanDB l0 restarted"
              description: "The up time of liaison on l0 became smaller within the last 15m: the process restarted."
              graph: 'banyandb_system_up_time{job="fodc-proxy",pod_name="l0",container_name="liaison"}'
      - {eval_time: 30m, alertname: BanyanDBNodeRestarted, exp_alerts: []}

  # a pod that appears at 50m with an up time starting at 0 (a scaled-out node) and a first deployment where every node
  # starts from 0 are not restarts, with or without a young up time; a pod whose series is away for 20m and returns
  # with a smaller up time is not reported either (no earlier sample within 15m).
  - name: node-restarted-new-pods-and-first-deploy-quiet
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="old"}', values: '10000+60x100'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="new"}', values: '_x50 0+60x50'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="first0"}', values: '0+60x100'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="first1"}', values: '0+60x100'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="away"}', values: '5000+60x20 _x20 30+60x60'}
    alert_rule_test:
      - {eval_time: 5m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - {eval_time: 52m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - {eval_time: 70m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
      - {eval_time: 90m, alertname: BanyanDBNodeRestarted, exp_alerts: []}
    promql_expr_test:
      - expr: ALERTS{alertname="BanyanDBNodeRestarted"}
        eval_time: 42m
        exp_samples: []

  # CPU against GOMAXPROCS; the 1-core lifecycle sidecar is ignored.
  - name: cpu-high-uses-gomaxprocs
    interval: 1m
    input_series:
      - {series: 'process_cpu_seconds_total{job="fodc-proxy",pod_name="a",container_name="data"}', values: '0+200x40'}
      - {series: 'go_sched_gomaxprocs_threads{job="fodc-proxy",pod_name="a",container_name="data"}', values: '4x40'}
      - {series: 'banyandb_system_cpu_num{job="fodc-proxy",pod_name="a",container_name="data"}', values: '8x40'}
      - {series: 'process_cpu_seconds_total{job="fodc-proxy",pod_name="a",container_name="lifecycle"}', values: '0+10x40'}
      - {series: 'go_sched_gomaxprocs_threads{job="fodc-proxy",pod_name="a",container_name="lifecycle"}', values: '1x40'}
    alert_rule_test:
      - eval_time: 30m
        alertname: BanyanDBCPUHigh
        exp_alerts:
          - exp_labels: {severity: warning, pod_name: a, container_name: data}
            exp_annotations:
              summary: "BanyanDB a CPU usage is high"
              description: "CPU usage of the data container on a is 83.33% of its GOMAXPROCS (go_sched_gomaxprocs_threads), above 80% for 15m. GOMAXPROCS is the CPU quota rounded down (at least 1) or the GOMAXPROCS setting, so it can differ from the container CPU limit."
              graph: 'max(rate(process_cpu_seconds_total{job="fodc-proxy",pod_name="a",container_name="data"}[5m])) / max(go_sched_gomaxprocs_threads{job="fodc-proxy",pod_name="a",container_name="data"})'

  # the Error Rate of the BanyanDB docs: seven error counters as errors/min, summed over the cluster. Each series grows by
  # 1 every 30s (2 errors/min); the liaison sync-loop counter counts only on the liaison, the data container's and
  # another job's series are left out. Fires once the sum has been above 0 for 10m.
  - name: error-rate-sustained
    interval: 30s
    input_series:
      - {series: 'banyandb_liaison_grpc_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '0+1x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0",error_type="retry_exhausted"}', values: '0+1x120'}
      - {series: 'banyandb_measure_total_sync_loop_err{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '0+1x120'}
      - {series: 'banyandb_measure_total_sync_loop_err{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '0+1x120'}
      - {series: 'banyandb_liaison_grpc_total_err{job="other",container_name="liaison",pod_name="l0"}', values: '0+1x120'}
    alert_rule_test:
      - {eval_time: 8m, alertname: BanyanDBErrorRateHigh, exp_alerts: []}
      - eval_time: 14m
        alertname: BanyanDBErrorRateHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "BanyanDB is returning errors"
              description: "The cluster error rate is 6.0 errors/min, above 0 for 10m. The sum of the liaison gRPC, registry, stream-receive, queue-publisher and liaison write-queue sync-loop error counters; one failed request can be counted by more than one of them. Client cancellations of the queue publisher (error_type canceled, stream_canceled) are excluded, but the liaison gRPC counter also counts requests that the client cancelled or that timed out."
              graph: '60 * ((sum(rate({__name__=~"banyandb_liaison_grpc_total_(registry_|stream_msg_received_)?err|banyandb_queue_pub_total_err",job="fodc-proxy",error_type!~"canceled|stream_canceled"}[2m])) or vector(0)) + (sum(rate({__name__=~"banyandb_(measure|stream_tst|trace_tst)_total_sync_loop_err",job="fodc-proxy",container_name="liaison"}[2m])) or vector(0)))'

  # a single burst of errors keeps the rate above 0 for about 2m only; it never reaches 10m.
  - name: error-rate-spike-does-not-fire
    interval: 30s
    input_series:
      - {series: 'banyandb_liaison_grpc_total_err{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '0x10 50x110'}
    alert_rule_test:
      - {eval_time: 6m, alertname: BanyanDBErrorRateHigh, exp_alerts: []}
      - {eval_time: 20m, alertname: BanyanDBErrorRateHigh, exp_alerts: []}
      - {eval_time: 50m, alertname: BanyanDBErrorRateHigh, exp_alerts: []}

  # no error series at all: the sum is 0 and nothing fires.
  - name: error-rate-no-series
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+30x120'}
    alert_rule_test:
      - {eval_time: 40m, alertname: BanyanDBErrorRateHigh, exp_alerts: []}

  # the first event creates the series with value 1 while the pod has been scraped for 20m: counted.
  # 16m after the first sample the series is older than the 15m window, and the alert resolves.
  - name: panic-first-event
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '1000+30x120'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a",component="x"}', values: '_x40 1x80'}
    alert_rule_test:
      - {eval_time: 19m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 20m, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "1 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}
      - {eval_time: 21m, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "1 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}
      - {eval_time: 30m, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "1 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}
      - {eval_time: 40m, alertname: BanyanDBPanic, exp_alerts: []}

  # Prometheus restarted: the counter and up_time appear together (same number of samples): old history, not an event.
  - name: panic-series-appears-with-its-pod
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '_x40 1000+30x80'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a",component="x"}', values: '_x40 7x80'}
    alert_rule_test:
      - {eval_time: 20m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 21m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 30m, alertname: BanyanDBPanic, exp_alerts: []}

  # the series has only 1 or 2 samples while up_time has been there for 30m: counted.
  - name: panic-new-series-few-samples
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '1000+30x120'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a",component="x"}', values: '_x60 1x2 _x20'}
    alert_rule_test:
      - {eval_time: 30m, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "1 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}
      - {eval_time: 30m30s, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "1 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}

  # margin M = 2: a counter that starts 2 samples after up_time is not new, 3 samples after is new.
  - name: panic-margin-two-samples
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '1000+30x20'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a",component="x"}', values: '_x2 1x18'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="b"}', values: '1000+30x20'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="b",component="x"}', values: '_x3 1x17'}
    alert_rule_test:
      - {eval_time: 5m, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: b}, exp_annotations: {summary: "BanyanDB b recovered from a panic", description: "1 panics were recovered on b in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="b"}'}}]}

  # an older series on the pod does not hide the new one: both terms are added (20m-old pod: x grows by 1, y appears as 1 = 2 panics).
  - name: panic-new-series-next-to-old-series
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '1000+30x120'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a",component="x"}', values: '5x40 6x80'}
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a",component="y"}', values: '_x40 1x80'}
    alert_rule_test:
      - {eval_time: 20m30s, alertname: BanyanDBPanic, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a recovered from a panic", description: "2 panics were recovered on a in the last 15m (threshold: > 0).", graph: '{__name__=~"banyandb_.*panic.*",job="fodc-proxy",pod_name="a"}'}}]}

  # no up_time while a counter series is there: the new-series term stays quiet.
  - name: panic-without-fodc-data
    interval: 30s
    input_series:
      - {series: 'banyandb_panic_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a",component="x"}', values: '_x40 1x80'}
    alert_rule_test:
      - {eval_time: 21m, alertname: BanyanDBPanic, exp_alerts: []}
      - {eval_time: 30m, alertname: BanyanDBPanic, exp_alerts: []}

  # QueueRetryExhausted and TracePluginFailures count the event that creates a series; the forced-retention counter exists with value 0 and is counted as an increase.
  - name: first-event-other-rules
    interval: 30s
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '1000+30x120'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",instance="px",container_name="liaison",pod_name="l"}', values: '1000+30x120'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",instance="px",container_name="liaison",pod_name="l",error_type="retry_exhausted"}', values: '_x40 1x80'}
      - {series: 'banyandb_queue_pub_total_err{job="fodc-proxy",instance="px",container_name="liaison",pod_name="l",error_type="other"}', values: '_x40 1x80'}
      - {series: 'banyandb_storage_retention_measure_forced_retention_segments_deleted_total{job="fodc-proxy",instance="px",container_name="data",pod_name="a"}', values: '0x40 1x80'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="a",group="g",result="panic"}', values: '_x40 1x80'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",instance="px",container_name="data",pod_name="a",group="g",result="success"}', values: '_x40 1x80'}
    alert_rule_test:
      - {eval_time: 21m, alertname: BanyanDBQueueRetryExhausted, exp_alerts: [{exp_labels: {severity: critical, pod_name: l}, exp_annotations: {summary: "BanyanDB l exhausted its queue publish retries", description: "l gave up 1 queue publishes after exhausting retries in the last 15m (threshold: > 0).", graph: 'banyandb_queue_pub_total_err{job="fodc-proxy",error_type="retry_exhausted",pod_name="l"}'}}]}
      - {eval_time: 21m, alertname: BanyanDBForcedRetentionDeletion, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a deleted data early because the disk is nearly full", description: "1 segments were deleted by forced retention on a in the last 30m (threshold: > 0); stored data was lost.", graph: '{__name__=~"banyandb_storage_retention_.*_forced_retention_segments_deleted_total",job="fodc-proxy",pod_name="a"}'}}]}
      - {eval_time: 21m, alertname: BanyanDBTracePluginFailures, exp_alerts: [{exp_labels: {severity: critical, pod_name: a}, exp_annotations: {summary: "BanyanDB a trace sampling plugin failed", description: "1 trace plugin failures (panic, length_mismatch, late, circuit_open, sampler_load_failed) on a in the last 30m (threshold: > 0).", graph: 'label_replace(banyandb_trace_tst_pipeline_plugin_executions{job="fodc-proxy",result=~"panic|length_mismatch|late",pod_name="a"}, "metric", "executions", "", "") or label_replace(banyandb_trace_tst_pipeline_plugin_batches{job="fodc-proxy",result="circuit_open",pod_name="a"}, "metric", "batches", "", "") or label_replace(banyandb_trace_pipeline_sampler_load_failed{job="fodc-proxy",pod_name="a"}, "metric", "sampler_load_failed", "", "")'}}]}
      - {eval_time: 40m, alertname: BanyanDBQueueRetryExhausted, exp_alerts: []}
      - {eval_time: 55m, alertname: BanyanDBForcedRetentionDeletion, exp_alerts: []}
      - {eval_time: 55m, alertname: BanyanDBTracePluginFailures, exp_alerts: []}

  # a sustained 5x query rate fires, with a baseline of 20 req/s from the hour that ended one hour ago.
  - name: query-rate-spike-sustained
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",method="query",pod_name="l0"}', values: '0+1200x120 150000+6000x69'}
    alert_rule_test:
      - {eval_time: 125m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}
      - eval_time: 160m
        alertname: BanyanDBQueryRateSpike
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "BanyanDB query rate spiked"
              description: "The query rate is 100.00 group queries/s (a request is counted once per group), above 3x the median rate of the hour that ended one hour ago plus 5 group queries/s, for 15m."
              graph: 'sum(rate(banyandb_liaison_grpc_total_started{job="fodc-proxy",service!="bydbql",method="query"}[5m]))'

  # a 25m dip of the query rate at 120m is not a baseline: the normal rate after it is not a spike (a single-point baseline would fire).
  - name: query-rate-echo-of-a-dip-does-not-fire
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",method="query",pod_name="l0"}', values: '0+1200x120 144180+180x24 149700+1200x114'}
    alert_rule_test:
      - {eval_time: 190m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}
      - {eval_time: 200m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}
      - {eval_time: 210m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}

  # 0.1 -> 0.5 req/s is 5x but only 0.4 req/s more: below the 5 req/s margin.
  - name: query-rate-low-rate-does-not-fire
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",method="query",pod_name="l0"}', values: '0+6x120 750+30x69'}
    alert_rule_test:
      - {eval_time: 180m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}

  # the baseline hour has no queries (rate 0): the threshold is 5 req/s, and 100 req/s fires.
  - name: query-rate-spike-from-zero-baseline
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",method="query",pod_name="l0"}', values: '0x120 0+6000x69'}
    alert_rule_test:
      - {eval_time: 125m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}
      - eval_time: 160m
        alertname: BanyanDBQueryRateSpike
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "BanyanDB query rate spiked"
              description: "The query rate is 100.00 group queries/s (a request is counted once per group), above 3x the median rate of the hour that ended one hour ago plus 5 group queries/s, for 15m."
              graph: 'sum(rate(banyandb_liaison_grpc_total_started{job="fodc-proxy",service!="bydbql",method="query"}[5m]))'

  # the baseline hour has no queries and the rate rises to only 3 req/s: below the 5 req/s margin.
  - name: query-rate-low-rate-from-zero-baseline-does-not-fire
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_total_started{job="fodc-proxy",method="query",pod_name="l0"}', values: '0x120 0+180x69'}
    alert_rule_test:
      - {eval_time: 180m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}

  # no query counter series at all: no baseline and no current value, nothing fires.
  - name: query-rate-no-series
    interval: 1m
    input_series:
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="liaison",pod_name="l0"}', values: '1+60x190'}
    alert_rule_test:
      - {eval_time: 180m, alertname: BanyanDBQueryRateSpike, exp_alerts: []}

  # the write rate drops from 800 to 100 points/s and stays: fires once the baseline hour (median 800) has passed.
  - name: write-rate-drop-sustained
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="d0"}', values: '0+48000x130 6246000+6000x59'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    alert_rule_test:
      - {eval_time: 135m, alertname: BanyanDBWriteRateDrop, exp_alerts: []}
      - eval_time: 175m
        alertname: BanyanDBWriteRateDrop
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "BanyanDB write rate dropped by more than half"
              description: "The cluster write rate (without the BanyanDB self-monitoring groups _monitoring and _monitoring_log) is 100.00 points/s, below 50% of the median rate of the hour that ended one hour ago, for 15m."
              graph: 'sum(rate({__name__=~"banyandb_(measure|stream_tst|trace_tst)_total_written",job="fodc-proxy",group!~"_monitoring|_monitoring_log"}[5m]))'

  # a 25m catch-up burst at 120m is not a baseline: the normal rate after it is not a drop (a single-point baseline would fire).
  - name: write-rate-echo-of-a-burst-does-not-fire
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="d0"}', values: '0+48000x120 5940000+180000x24 10308000+48000x114'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    alert_rule_test:
      - {eval_time: 190m, alertname: BanyanDBWriteRateDrop, exp_alerts: []}
      - {eval_time: 200m, alertname: BanyanDBWriteRateDrop, exp_alerts: []}
      - {eval_time: 210m, alertname: BanyanDBWriteRateDrop, exp_alerts: []}

  # 60 -> 5 points/s is a drop of more than half, but of only 55 points/s: the baseline has to exceed 100 points/s.
  - name: write-rate-drop-low-rate-does-not-fire
    interval: 1m
    input_series:
      - {series: 'banyandb_measure_total_written{job="fodc-proxy",pod_name="d0"}', values: '0+3600x130 468300+300x59'}
      - {series: 'banyandb_system_up_time{job="fodc-proxy",container_name="data",pod_name="d0"}', values: '1000+60x250'}
    alert_rule_test:
      - {eval_time: 175m, alertname: BanyanDBWriteRateDrop, exp_alerts: []}

  # a plugin whose successful executions have a p99 in the 1-5s bucket fires (4.96s by interpolation).
  - name: trace-plugin-latency-success
    interval: 1m
    input_series:
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="0.5"}', values: '0x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="1"}', values: '0x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="5"}', values: '0+60x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="+Inf"}', values: '0+60x120'}
    alert_rule_test:
      - eval_time: 60m
        alertname: BanyanDBTracePluginLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, group: g, plugin_name: p}
            exp_annotations:
              summary: "BanyanDB trace plugin p is slow"
              description: "p99 execution time of plugin p in group g is 4.96s, above 1s for 15m."
              graph: 'histogram_quantile(0.99, sum by (le) (rate(banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",result="success",group="g",plugin_name="p"}[30m])))'

  # executions that ended with `late` (the plugin overran its timeout) are failures reported by
  # BanyanDBTracePluginFailures; they do not count towards the latency of the successful ones.
  - name: trace-plugin-latency-ignores-failed-executions
    interval: 1m
    input_series:
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="0.5"}', values: '0+60x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="5"}', values: '0+60x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="+Inf"}', values: '0+60x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="late",le="0.5"}', values: '0x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="late",le="5"}', values: '0x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="late",le="+Inf"}', values: '0+60x120'}
    alert_rule_test:
      - {eval_time: 60m, alertname: BanyanDBTracePluginLatencyHigh, exp_alerts: []}

  # a plugin that runs every 20m (the counters step) still has a value at every evaluation with a 30m window.
  - name: trace-plugin-latency-sparse-executions
    interval: 1m
    input_series:
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="0.5"}', values: '0x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="1"}', values: '0x120'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="5"}', values: '0x19 60x20 120x20 180x20 240x20 300x20'}
      - {series: 'banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",group="g",plugin_name="p",result="success",le="+Inf"}', values: '0x19 60x20 120x20 180x20 240x20 300x20'}
    alert_rule_test:
      - {eval_time: 70m, alertname: BanyanDBTracePluginLatencyHigh, exp_alerts: [{exp_labels: {severity: warning, group: g, plugin_name: p}, exp_annotations: {summary: "BanyanDB trace plugin p is slow", description: "p99 execution time of plugin p in group g is 4.96s, above 1s for 15m.", graph: 'histogram_quantile(0.99, sum by (le) (rate(banyandb_trace_tst_pipeline_plugin_execution_duration_seconds_bucket{job="fodc-proxy",result="success",group="g",plugin_name="p"}[30m])))'}}]}

  # p99 of the liaison query latency histogram per pod. l0: every request in the (1, 2.5] bucket, p99 2.48 s (warning only);
  # l1: every request in the (5, 10] bucket, p99 9.95 s (warning and critical); l2: all requests in the (0.5, 1] bucket,
  # p99 0.99 s (below the 1 s threshold); l3: 0.05 s requests. Pending 10m, firing at 30m.
  - name: query-latency-p99-thresholds
    interval: 1m
    input_series:
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.05"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.25"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="0.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="2.5"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="5"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="30"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="60"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l0",service="measure",status="ok",le="+Inf"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="0.05"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="0.1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="0.25"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="0.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="2.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="10"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="30"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="60"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l1",service="stream",status="ok",le="+Inf"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="0.01"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="0.025"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="0.05"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="0.1"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="0.25"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="0.5"}', values: '0x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="1"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l2",service="measure",status="ok",le="2.5"}', values: '0+600x40'}
