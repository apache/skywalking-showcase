      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="0.25"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="0.5"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="1"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="2.5"}', values: '0+600x40'}
      - {series: 'banyandb_liaison_grpc_query_latency_seconds_bucket{job="fodc-proxy",pod_name="l3",service="measure",status="ok",le="5"}', values: '0+600x40'}
