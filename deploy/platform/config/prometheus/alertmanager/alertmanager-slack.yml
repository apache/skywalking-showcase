# Alertmanager configuration with the Slack receiver (chat.postMessage); the bot token is read from the file
# /etc/alertmanager-secrets/slack-bot-token. The message comes from slack.tmpl; the platform defines slack.channel,
# slack.prometheus_url and slack.footer in its own template file. Apart from the root receiver, templates and receivers
# this file is identical to alertmanager.yml:
#   diff alertmanager.yml alertmanager-slack.yml
templates:
  - /etc/alertmanager/*.tmpl
route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, pod_name]
  - source_matchers:
      - alertname="BanyanDBWriteStalled"
    target_matchers:
      - alertname="BanyanDBWriteRateDrop"
receivers:
  - name: slack
    slack_configs:
      - api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            credentials_file: /etc/alertmanager-secrets/slack-bot-token
        channel: '{{ template "slack.channel" . }}'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        title_link: ''
        fallback: '{{ template "slack.fallback" . }}'
        text: '{{ template "slack.text" . }}'
