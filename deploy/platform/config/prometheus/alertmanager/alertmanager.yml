# Alertmanager configuration without Slack: alerts are only visible in the Alertmanager UI. The Slack variant is
# alertmanager-slack.yml; apart from the root receiver, templates and receivers the two files are identical:
#   diff alertmanager.yml alertmanager-slack.yml
route:
  receiver: 'null'
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, pod_name]
  - source_matchers:
      - alertname="BanyanDBWriteStalled"
    target_matchers:
      - alertname="BanyanDBWriteRateDrop"
receivers:
  - name: 'null'
