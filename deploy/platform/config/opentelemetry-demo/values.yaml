# @feature: otlp-trace; values for the OpenTelemetry Astronomy Shop chart
# (oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo), installed by the kubernetes Makefile as
# its own release in its own namespace. The image and the OAP address the collector exports to are set there.
#
# The demo's own observability backends and its AI and docs components are off; its collector sends every span to the
# OAP, and accepts and drops the metrics and logs the services also send.

components:
  agent:
    enabled: false
  chatbot:
    enabled: false
  mcp:
    enabled: false
  telemetry-docs:
    enabled: false

jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

opentelemetry-collector:
  # One collector for the whole demo; the chart's default daemonset and its node and cluster metrics need cluster-wide
  # permissions that a trace feed does not.
  mode: deployment
  presets:
    annotationDiscovery:
      metrics:
        enabled: false
    clusterMetrics:
      enabled: false
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
    kubernetesAttributes:
      enabled: false
  command:
    extraArgs: []
  # Replaces the demo's collector config instead of merging into it, which would keep its exporters to the backends
  # turned off above.
  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
            # The storefront page sends its browser spans through frontend-proxy's /otlp-http route.
            cors:
              allowed_origins:
                - "http://*"
                - "https://*"
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # The OAP analyzes only the spans whose resource carries service.layer=OTLP_GENERAL; every service of the demo
      # opts in here, and one that set its own layer keeps it. The chart sets no service.namespace, by which the OAP
      # groups the demo's services, as otel-demo::cart.
      resource/layer:
        attributes:
          - key: service.layer
            value: OTLP_GENERAL
            action: insert
          # Keep it equal to the Makefile's OTEL_DEMO_NAMESPACE: the OAP resolves a host qualified with a namespace,
          # cart.otel-demo, to the service of that group.
          - key: service.namespace
            value: otel-demo
            action: insert
    exporters:
      otlp_grpc/oap:
        # Set by the Makefile to the showcase OAP's gRPC port.
        endpoint: ""
        tls:
          insecure: true
        sending_queue:
          batch: {}
      nop: {}
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    service:
      extensions: [ health_check ]
      pipelines:
        traces:
          receivers: [ otlp ]
          processors: [ memory_limiter, resource/layer ]
          exporters: [ otlp_grpc/oap ]
        metrics:
          receivers: [ otlp ]
          processors: [ memory_limiter ]
          exporters: [ nop ]
        logs:
          receivers: [ otlp ]
          processors: [ memory_limiter ]
          exporters: [ nop ]
