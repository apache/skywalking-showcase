version: '2.1'

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    networks: [ sw ]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../config/prometheus/rules/banyandb.yaml:/etc/prometheus/rules/banyandb.yaml
    ports:
      # 9090 is taken by the app of the agent feature
      - "9091:9090"
    # service_started, because banyandb-tail-sampling disables the healthcheck of banyandb.
    depends_on:
      banyandb:
        condition: service_started

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    networks: [ sw ]
    volumes:
      - ../config/prometheus/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

networks:
  sw:
