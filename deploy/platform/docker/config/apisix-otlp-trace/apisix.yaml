apisix:

# The two routes the page calls, traced by APISIX's opentelemetry plugin; the plugin's default sampler is always_off,
# so each route turns it on. The static page is served by the nginx location in config.yaml and is not traced.
routes:
  - uri: /homepage
    service_id: 1
    plugins:
      opentelemetry:
        sampler:
          name: always_on
  - uri: /test
    service_id: 1
    plugins:
      opentelemetry:
        sampler:
          name: always_on
services:
  - id: 1
    upstream_id: 1
upstreams:
  - id: 1
    nodes:
      "app:80": 1
    type: roundrobin
#END
