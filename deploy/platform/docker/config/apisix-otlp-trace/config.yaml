apisix:

apisix:
  node_listen: 80
  enable_ipv6: false
  enable_admin: false
  config_center: yaml
plugin_attr:
  opentelemetry:
    resource:
      service.name: frontend
      service.namespace: otel-services
    collector:
      address: oap:12800
      request_timeout: 3
plugins:
  - opentelemetry
nginx_config:
  # Two workers rather than one per CPU: the frontend proxies two routes and serves a static page, and APISIX's
  # default sizes the workers by the node, not by the container's memory limit.
  worker_processes: 2
  http_server_configuration_snippet: |
    location ~ \.(gif|jpg|png|js|css|html)$ {
      root /app/build;
      index index.html;
    }
