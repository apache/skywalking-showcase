# @feature: otlp-trace; receives the spans of the OpenTelemetry-instrumented copy of the music application, over
# OTLP/HTTP, the SDKs' default protocol, and hands
# every one to the OAP twice: as OTLP over gRPC, stored natively, and converted to Zipkin for the Zipkin store.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp:
    endpoint: oap:11800
    tls:
      insecure: true
  zipkin:
    endpoint: http://oap:9411/api/v2/spans

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      exporters: [ otlp, zipkin ]
