# @feature: otlp-trace-practices; the untraced-nginx case: an nginx without tracing, listed in gateways.yml.

events {}

http {
    server {
        listen 80;
        proxy_set_header Host $host;   # keep the callers' Host; proxy_pass would send the upstream's name

        location /cart {
            proxy_pass http://cart:8080;
        }
        location /checkout {
            proxy_pass http://checkout:8080;
        }
    }
}
