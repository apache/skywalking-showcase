# @feature: otlp-trace-practices; the traced-nginx case: nginx's OpenTelemetry module reports one SERVER span per
# request; upstream.address names the server that answered, which the nginx block in otlp-trace-practices.yaml (the TAL
# rule) reads.

load_module modules/ngx_otel_module.so;

events {}

http {
    otel_exporter {
        endpoint oap:11800;
    }
    otel_service_name nginx;
    otel_resource_attr service.layer OTLP_GENERAL;
    otel_resource_attr service.namespace traced-nginx;
    otel_resource_attr service.instance.id nginx-0;   # the module names no instance of its own

    # Name the upstream only when one server answered the request.
    map $upstream_addr $otel_upstream {
        "~^(?<otel_single_upstream>[^,\s]+)$" $otel_single_upstream;
        default "";
    }

    upstream cart {
        server cart-1:8080;
        server cart-2:8080;
    }

    server {
        listen 80;
        otel_trace         $otel_parent_sampled;
        otel_trace_context propagate;
        otel_span_attr     upstream.address $otel_upstream;

        location / {
            proxy_pass http://cart;
        }
    }
}
