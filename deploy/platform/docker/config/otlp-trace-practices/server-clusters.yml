# @feature: otlp-trace-practices; one Kafka broker and one PostgreSQL, each reached at two addresses: its Service and
# its own name. Every spelling the clients report is listed, so each shows as one node.
clusters:
  - name: invoices-kafka
    members:
      - kafka-0.kafka-headless:9092   # the broker's own name
    aliases:
      - kafka:9092                    # its Service
  - name: orders-db
    members:
      - pg-0.pg-headless:5432         # the server's own name
    aliases:
      - pg:5432                       # its Service
