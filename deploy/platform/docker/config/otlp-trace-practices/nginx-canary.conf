# @feature: otlp-trace-practices; the canary case's router, which emits no spans: x-canary: v2 goes to b-canary,
# the rest to b, both behind the one address its callers dial, b:8080.

events {}

http {
    # A router that emits no spans: x-canary: v2 goes to the canary, the rest to b.
    map $http_x_canary $b_upstream {
        v2      b-v2:8080;
        default b-v1:8080;
    }
    server {
        listen 8080;
        resolver 127.0.0.11 valid=10s;
        location / {
            proxy_pass http://$b_upstream;
        }
    }
}
