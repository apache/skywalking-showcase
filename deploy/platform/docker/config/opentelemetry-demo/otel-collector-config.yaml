# The Astronomy Shop's collector, in place of the demo's own: every span goes to the OAP over OTLP/gRPC. The demo's
# services also export metrics and logs here; they are accepted and dropped, so no sender logs export errors.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        # The storefront page sends its browser spans through frontend-proxy's /otlp-http route.
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

processors:
  batch:
  # The OAP analyzes only the spans whose resource carries service.layer=OTLP_GENERAL; every service of the demo opts
  # in here, and one that set its own layer keeps it.
  resource/layer:
    attributes:
      - key: service.layer
        value: OTLP_GENERAL
        action: insert
      # The OAP groups the demo by service.namespace; the containers set it, and this covers the storefront's browser
      # spans (frontend-web), which carry no container environment.
      - key: service.namespace
        value: otel-demo
        action: insert

exporters:
  otlp/oap:
    endpoint: oap:11800
    tls:
      insecure: true
  nop:

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ resource/layer, batch ]
      exporters: [ otlp/oap ]
    metrics:
      receivers: [ otlp ]
      exporters: [ nop ]
    logs:
      receivers: [ otlp ]
      exporters: [ nop ]
