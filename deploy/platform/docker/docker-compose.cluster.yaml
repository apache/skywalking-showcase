version: '2.1'

services:
  banyandb:
    extends:
      file: docker-compose.single-node.yaml
      service: banyandb

  zookeeper:
    image: zookeeper:3.5
    expose:
      - 2181
    networks: [ sw ]
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/2181" ]
      interval: 5s
      timeout: 60s
      retries: 120

  oap-init: # @feature: cluster; set up an init container to initialize the storage templates and indices
    image: ${SW_OAP_IMAGE}:${SW_OAP_IMAGE_TAG}
    networks: [ sw ]
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      JAVA_OPTS: "-Dmode=init" # @feature: cluster; set the init container to "init" mode to initialize the storage templates and indices
    depends_on:
      banyandb:
        condition: service_healthy

  oap1: &oap
    image: ${SW_OAP_IMAGE}:${SW_OAP_IMAGE_TAG}
    networks: [ sw ]
    environment:
      SW_CLUSTER: zookeeper # @feature: cluster; set up a cluster coordinator
      SW_CLUSTER_ZK_HOST_PORT: zookeeper:2181 # @feature: cluster; set up the cluster coordinator address
      SW_HEALTH_CHECKER: default # @feature: health-check;
      SW_OTEL_RECEIVER: default # @feature: vm; enable the OC receiver that receives the VM metrics
      SW_OTEL_RECEIVER_ENABLED_OTEL_METRICS_RULES: vm,mysql/*,postgresql/*,apisix,elasticsearch/*,rabbitmq/*,mongodb/*,rocketmq/*,pulsar/*,activemq/*,flink/*,ai-agent/* # @feature: vm; enable the OC rules that analyse the VM metrics
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_TELEMETRY: prometheus # @feature: so11y; expose the metrics of self o11y through prometheus
      SW_PROMETHEUS_FETCHER: default # @feature: so11y; fetch the metrics of self o11y through prometheus
      SW_TRACEQL: default # @feature: grafana; serve the Tempo API (TraceQL) that the Grafana trace dashboards query
      SW_TRACEQL_ENABLE_DATASOURCE_SKYWALKING: "true" # @feature: grafana; the /skywalking datasource, traces from the SkyWalking agents
      SW_TRACEQL_ENABLE_DATASOURCE_OTLP: "true" # @feature: otlp-trace,grafana; the /otlp datasource, OTLP traces stored natively (receiver-otel.otlpTraceStorage: otlp, the default)
      # The Zipkin store is fed by Istio's sidecars, which only the Kubernetes layout runs, so here it stays empty;
      # the receiver and the query are on so the ZipkinTraceQL datasource and its dashboard answer rather than 404.
      SW_RECEIVER_ZIPKIN: default # @feature: grafana; the Zipkin receiver on 9411
      SW_QUERY_ZIPKIN: default # @feature: grafana; the Zipkin query API and the /zipkin datasource
      SW_TRACEQL_ENABLE_DATASOURCE_ZIPKIN: "true" # @feature: grafana; the /zipkin datasource
      JAVA_OPTS: "-Dmode=no-init -Xms2048m -Xmx2048m" # @feature: cluster; start the cluster nodes in no-init mode
      SW_METER_ANALYZER_ACTIVE_FILES: datasource,threadpool,satellite,spring-micrometer,go-runtime,java-agent,go-agent
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/11800"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      oap-init:
        condition: service_completed_successfully # @feature: cluster; wait for init container to complete
      zookeeper:
        condition: service_healthy

  oap:
    <<: *oap

  ui:
    image: ${SW_UI_IMAGE}:${SW_UI_IMAGE_TAG}
    networks: [ sw ]
    ports:
      - "8081:8081"
    depends_on:
      oap:
        condition: service_healthy
    environment:
      # The Horizon image reads these three (its /app/horizon.yaml is fully env-tokenized);
      # the old SW_OAP_ADDRESS of the booster UI is not a Horizon setting. Point at one OAP:
      # each field takes a single URL, not a comma-separated list.
      HORIZON_OAP_QUERY_URL: http://oap:12800
      HORIZON_OAP_ADMIN_URL: http://oap:17128
      HORIZON_OAP_ZIPKIN_URL: http://oap:9412/zipkin # SW_QUERY_ZIPKIN above serves this
      # OAP's Tempo API (SW_TRACEQL above); Horizon probes /skywalking, /zipkin and /otlp under it, OAP's default paths.
      HORIZON_OAP_TRACEQL_URL: http://oap:3200
      # The same two PUBLICLY-KNOWN demo accounts as deploy/platform/kubernetes/values.yaml
      # (passwords `admin` and `skywalking`); the image ships with NO users, so without this
      # the UI serves the login page but every login is refused. Compose interpolates `$`,
      # hence every `$` of the argon2 hashes is doubled here; the container gets single `$`.
      HORIZON_AUTH_LOCAL_USERS: >-
        [{"username":"admin","passwordHash":"$$argon2id$$v=19$$m=65536,t=3,p=4$$eemqy1r72oSXR58y8VpRqw$$Bn/dULrmJTHEi3263KfgWDEwQmUsqNLi3xwyv/DekHM","roles":["admin"]},
        {"username":"skywalking","passwordHash":"$$argon2id$$v=19$$m=65536,t=3,p=4$$Zqj8HhQDqm8d5c2MipHYZw$$BsaCnu4bdd4uadIldx3wwYLsdo47Thxb7Lv1MXpWG2Q","roles":["viewer","maintainer","template-viewer"]}]
      # `template-viewer` is not a built-in role: read-only access to the Dashboard-setup pages,
      # defined as in the Kubernetes values and layered ONTO the built-ins (`keep`).
      HORIZON_RBAC_BUILTIN_ROLES: keep
      HORIZON_RBAC_ROLES: '{"template-viewer":["overview-template:read","layer-template:read","translation:read","alarm-setup:read","infra-3d-setup:read","setup:read"]}'
      HORIZON_RBAC_LANDING_BY_ROLE: '{"template-viewer":"/"}'

networks:
  sw:
