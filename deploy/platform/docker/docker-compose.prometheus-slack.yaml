# Alertmanager posts the alerts to Slack. Use with the `prometheus` feature, in any order in FEATURE_FLAGS; without it the
# alerts are only visible in the Alertmanager UI. The Slack config is mounted at its own path and selected with
# --config.file, so it does not depend on which file is merged last.
#
# The bot token is read from the environment variable PROMETHEUS_SLACK_TOKEN and mounted as a compose secret (it is
# not written to a file or passed as a container environment variable). The channel is PROMETHEUS_SLACK_CHANNEL,
# default #skywalking-demo-notifications; it is mounted as a compose secret too, as channel.tmpl (the template that
# defines slack.channel), built from PROMETHEUS_SLACK_CHANNEL_TMPL in Makefile.in. For example:
#   PROMETHEUS_SLACK_TOKEN=xoxb-... make deploy.docker FEATURE_FLAGS=single-node,prometheus,prometheus-slack
version: '2.1'

services:
  alertmanager:
    command:
      - --config.file=/etc/alertmanager/alertmanager-slack.yml
      - --storage.path=/alertmanager
    volumes:
      - ../config/prometheus/alertmanager/alertmanager-slack.yml:/etc/alertmanager/alertmanager-slack.yml
      - ../config/prometheus/alertmanager/slack.tmpl:/etc/alertmanager/slack.tmpl
      - ./config/prometheus/site.tmpl:/etc/alertmanager/site.tmpl
    secrets:
      - source: slack-channel
        target: /etc/alertmanager/channel.tmpl
        mode: 0444
      - source: slack-bot-token
        target: /etc/alertmanager-secrets/slack-bot-token
        mode: 0444

secrets:
  slack-channel:
    environment: PROMETHEUS_SLACK_CHANNEL_TMPL
  slack-bot-token:
    environment: PROMETHEUS_SLACK_TOKEN
