# @feature: als; the sample services' sidecars report their spans to the mesh-traces pipeline of the showcase's
# OpenTelemetry collector, which sends them to the OAP both as OTLP and as Zipkin. The services themselves are traced
# by the SkyWalking agents over sw8, and the sidecars by W3C trace context, so the two never share a trace.
{{- if .Values.features.als.enabled }}
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-tracing
  namespace: {{ .Values.sampleServices.namespace }}
spec:
  tracing:
    - providers:
        - name: skywalking-mesh-otlp
      randomSamplingPercentage: 100
{{- end }}
