{{- if .Values.features.asz.enabled }}
# The collector's configuration. It lives apart from /asz/data, because `asz scenario build` writes its own
# asz.yaml there and refuses a file it did not write. A file that lists adapters replaces the whole default
# list, so all three are listed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: asz-config
data:
  asz.yaml: |
    storage:
      root: /asz/data
    adapters:
      - name: claude-code-local
        enabled: true
        source_root: /asz/data/_source
        exclude:
          - /private/tmp/**
        collector:
          mode: watch
          interval: 60s
      - name: changes
        enabled: true
        source_root: /asz/data/_source/plugins/data
        exclude:
          - /private/tmp/**
        collector:
          mode: watch
          interval: 60s
    # Derive the metrics from every landed file, whatever its age, so the AI_AGENT metric rules have data.
    metrics:
      enabled: true
      lookback: none
    export:
      otlp:
        protocol: grpc
        endpoint: {{ template "skywalking.oap.address.grpc" . }}
        tls: false
        service_name: Claude Code
        instance_id: Claude Code showcase runner
        layer: AI_AGENT
        logs: true
        metrics: true
{{- end }}
