{{- if .Values.features.asz.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asz
  labels:
    app: asz
spec:
  replicas: 1
  # Each pod has its own emptyDir, so a rollout cannot mix data. Recreate stops the old pod before the new one
  # starts, so two feeds never generate conversations at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: asz
  template:
    metadata:
      labels:
        app: asz
      annotations:
        sidecar.istio.io/inject: "false"
        # The feed reads its scenario set once, at start, so a changed scenario or configuration rolls the pod.
        checksum/config: {{ include (print $.Template.BasePath "/feature-asz/configmaps.yaml") . | sha256sum }}
    spec:
      containers:
        # The feed: one whole conversation every features.asz.every, picked at random, written as Claude Code's
        # own files under /asz/data/_source.
        - name: feed
          image: {{ .Values.features.asz.image }}
          args: ["scenario", "build", "/asz/scenarios", "--format", "claude-code", "--out", "/asz/data",
                 "--every", {{ .Values.features.asz.every | quote }}, "--pick", "random"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /asz/data
            - name: scenarios
              mountPath: /asz/scenarios
              readOnly: true
        # The pipeline: on every interval it lands what is new, parses what moved, and pushes to the OAP.
        - name: collector
          image: {{ .Values.features.asz.image }}
          args: ["collect", "-config", "/asz/conf/asz.yaml"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /asz/data
            - name: config
              mountPath: /asz/conf
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: scenarios
          configMap:
            name: asz-scenarios
        - name: config
          configMap:
            name: asz-config
{{- end }}
