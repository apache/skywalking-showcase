apiVersion: v2
name: skywalking-showcase
home: https://skywalking.apache.org
version: 0.0.0
description: Apache SkyWalking showcase
icon: https://raw.githubusercontent.com/apache/skywalking-kubernetes/master/logo/sw-logo-for-chart.jpg
sources:
  - https://github.com/apache/skywalking-showcase
dependencies:
  - name: skywalking-helm
    alias: skywalking
    version: 0.0.0-1a6a8f5d6229768cc9f0525288047454fe4b66cc
    repository: oci://ghcr.io/apache/skywalking-helm

    # @feature: java-agent-injector; the java agent injector is a component of the swck operator, so we need to deploy the swck operator firstly
    # The operator chart moved out of apache/skywalking-helm and is now released from
    # apache/skywalking-swck itself, under a new name and a new OCI repository.
  - name: skywalking-swck
    alias: swck
    version: 0.0.0-7ce378f6c01a62fd42ff47f4c98e1e95b54a40ca
    repository: oci://ghcr.io/apache/skywalking-swck/helm
    condition: features.javaAgentInjector.enabled
    # NOTE: this chart needs cert-manager in the cluster; the Makefile's `cert-manager`
    # target installs it out of band. See the comment there for why it is not a
    # dependency here.

  - name: kube-state-metrics
    version: 5.0.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-state-metrics.enabled

  - name: prometheus-elasticsearch-exporter
    version: 5.1.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus-elasticsearch-exporter.enabled

  - name: rabbitmq
    version: 12.0.1
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled

  - name: mongodb
    version: 14.10.1
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled

  - name: base
    version: 1.23.2
    repository: https://istio-release.storage.googleapis.com/charts
    condition: istio.enabled

  - name: istiod
    version: 1.23.2
    repository: https://istio-release.storage.googleapis.com/charts
    condition: istio.enabled

  - name: opentelemetry-collector
    version: 0.51.1
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry.enabled
