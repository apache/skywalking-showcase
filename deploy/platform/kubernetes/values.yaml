skywalking:
  fullnameOverride: "sw-demo"
  oap:
    name: oap
    image:
      repository: ~
      tag: ~
      pullPolicy: IfNotPresent
    replicas: 1
    storageType: ~
    ports:
      grpc: 11800
      rest: 12800
      admin: 17128
      promql: 9090
      logql: 3100
      traceql: 3200
      zipkin-receiver: 9411
      zipkin-query: 9412
      metrics: 1234
    env:
      SW_HEALTH_CHECKER: default
      SW_OTEL_RECEIVER: default # @feature: so11y;,mysql;kubernetes-monitor enable OpenTelemetry receiver to receive OpenTelemetry metrics
      # @feature: vm; enable vm rules to analyze VM metrics
      # @feature: so11y; enable oap rules to analyze OAP metrics
      # @feature: kubernetes-monitor; enable rules to analyze Kubernetes Cluster/Node/Service metrics
      # @feature: istiod-monitor; enable rules to analyze Istio control plane metrics
      # @feature: mysql; enable mysql rules to analyze MySQL metrics
      # @feature: apisix-monitor; enable APISIX rules to analyze APISIX metrics
      SW_OTEL_RECEIVER_ENABLED_OTEL_METRICS_RULES: vm,oap,k8s/*,istio-controlplane,mysql/*,postgresql/*,apisix,elasticsearch/*,rabbitmq/*,mongodb/*,nginx/*,rocketmq/*,pulsar/*,activemq/*,flink/*,banyandb/*
      SW_TELEMETRY: prometheus # @feature: so11y; expose the metrics of self o11y through prometheus
      SW_ENVOY_METRIC_ALS_HTTP_ANALYSIS: "mx-mesh,persistence" # @feature: als; enable mesh analyzer (mx-mesh) to analyze ALS logs
      K8S_SERVICE_NAME_RULE: "mesh-svr::${service.metadata.name}.${service.metadata.namespace}"
      SW_CONFIGURATION: k8s-configmap
      SW_ENVOY_METRIC_ALS_TCP_ANALYSIS: "mx-mesh"
      SW_SLOW_DB_THRESHOLD: default:0,mongodb:100
      SW_ENABLE_ON_DEMAND_POD_LOG: "true"
      SW_METER_ANALYZER_ACTIVE_FILES: datasource,threadpool,satellite,network-profiling,go-runtime,python-runtime,spring-micrometer,continuous-profiling,java-agent,go-agent
      SW_STORAGE_ES_RESPONSE_TIMEOUT: "50000"
      SW_STORAGE_ES_INDEX_SHARDS_NUMBER: "6"
      SW_STORAGE_ES_SUPER_DATASET_INDEX_SHARDS_FACTOR: "2"
      SW_RECEIVER_ZIPKIN: default
      SW_QUERY_ZIPKIN: default
      # @feature: r3; some basic settings for R3
      SW_CORE_ENABLE_ENDPOINT_NAME_GROUPING_BY_OPENAPI: "false"
      SW_CORE_MAX_HTTP_URIS_NUMBER_PER_SVR: "3000"
      SW_AI_PIPELINE_URI_RECOGNITION_SERVER_PORT: "17128"
      SW_STORAGE_BANYANDB_RECORDS_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_RECORDS_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_RECORDS_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_TRACE_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_TRACE_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_TRACE_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_ZIPKIN_TRACE_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_ZIPKIN_TRACE_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_ZIPKIN_TRACE_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_LOG_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_LOG_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_LOG_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_BROWSER_ERROR_LOG_SHARD_NUM: "1"
      SW_STORAGE_BANYANDB_BROWSER_ERROR_LOG_WARM_SHARD_NUM: "1"
      SW_STORAGE_BANYANDB_BROWSER_ERROR_LOG_COLD_SHARD_NUM: "1"
      SW_STORAGE_BANYANDB_BROWSER_ERROR_LOG_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_BROWSER_ERROR_LOG_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_BROWSER_ERROR_LOG_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_MINUTE_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_METRICS_MINUTE_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_MINUTE_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_MINUTE_WARM_TTL_DAYS: "7"
      SW_STORAGE_BANYANDB_METRICS_MINUTE_COLD_TTL_DAYS: "30"
      SW_STORAGE_BANYANDB_METRICS_HOUR_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_METRICS_HOUR_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_HOUR_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_HOUR_WARM_TTL_DAYS: "7"
      SW_STORAGE_BANYANDB_METRICS_HOUR_COLD_TTL_DAYS: "30"
      SW_STORAGE_BANYANDB_METRICS_DAY_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_METRICS_DAY_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_DAY_ENABLE_COLD_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_DAY_WARM_TTL_DAYS: "7"
      SW_STORAGE_BANYANDB_METRICS_DAY_COLD_TTL_DAYS: "30"
      SW_STORAGE_BANYANDB_METADATA_TTL_DAYS: "60"
      SW_STORAGE_BANYANDB_COMPATIBLE_SERVER_API_VERSIONS: "0.10,0.11"
      # Trace tail sampling: enabling a group's pipeline is what activates the sampler, since OAP
      # pushes it onto that group as a TracePipelineConfig and the data node loads the matching
      # .so (sw-trace-sampler.so / zipkin-trace-sampler.so). Everything else — the events, the
      # grace windows and the sampler rules — is left at OAP's bydb.yml defaults. Needs
      # skywalking.banyandb.plugins.enabled above, or the config is accepted and never applied.
      SW_STORAGE_BANYANDB_TRACE_PIPELINE_ENABLED: "true"
      SW_STORAGE_BANYANDB_ZIPKIN_TRACE_PIPELINE_ENABLED: "true"
      SW_TRACEQL: default
      SW_TRACEQL_ENABLE_DATASOURCE_ZIPKIN: "true"
      SW_TRACEQL_ENABLE_DATASOURCE_SKYWALKING: "true"
    startupProbe:
      failureThreshold: 10
      tcpSocket:
        port: 12800
      initialDelaySeconds: 120
      periodSeconds: 10

    config:
      metadata-service-mapping.yaml: |
        serviceName: mesh-svr::${LABELS."service.istio.io/canonical-name",LABELS."app.kubernetes.io/name",LABELS.app}.${NAMESPACE}
        serviceInstanceName: ${NAME}
      alarm-settings.yml: |
        rules:
          service_resp_time_rule:
            # 20ms is just for demo
            expression: sum(service_resp_time > 20) >= 1 
            period: 5
            tags:
              level: WARNING
            message: Response time of service {name} is more than 20ms.
      core.default.log4j-xml: |-
        <Configuration status="WARN">
           <Appenders>
             <Console name="Console" target="SYSTEM_OUT">
               <PatternLayout charset="UTF-8" pattern="%d - %c - %L [%t] %-5p %x - %m%n"/>
             </Console>
           </Appenders>
           <Loggers>
             <logger name="org.apache.skywalking.oap.server.storage" level="INFO"/>
             <Root level="INFO">
               <AppenderRef ref="Console"/>
             </Root>
            </Loggers>
        </Configuration>
      cilium-rules:
        exclude.yaml: |
          namespaces:
            - kube-system
            - skywalking-showcase
            - sample-services

          labels:
            - k8s:io.cilium.k8s.namespace.labels.istio-injection: enabled
              k8s:security.istio.io/tlsMode: istio

        metadata-service-mapping.yaml: |
          serviceName: cilium::${LABELS."app.kubernetes.io/name",LABELS.component,LABELS.app,LABELS.k8s-app}.${NAMESPACE}
          serviceInstanceName: ${NAME}
  ui:
    name: ui
    replicas: 1
    image:
      repository: ~
      tag: ~
      pullPolicy: IfNotPresent
    # Commented out on purpose: with the literal-hash users below and SSO off,
    # nothing reads a `${VAR}`, and `envFrom` naming a Secret that does not
    # exist is a HARD pod failure (CreateContainerConfigError) — so leaving it
    # set would break `make deploy.kubernetes` on any cluster without it.
    #
    # Uncomment it, together with either commented block below, to keep every
    # credential out of this repo:
    #   kubectl create secret generic horizon-secrets -n skywalking-showcase \
    #     --from-literal=HORIZON_ADMIN_PASSWORD_HASH='<argon2id hash>' \
    #     --from-literal=HORIZON_SKYWALKING_PASSWORD_HASH='<argon2id hash>' \
    #     --from-literal=HORIZON_GITHUB_CLIENT_ID=<client-id> \
    #     --from-literal=HORIZON_GITHUB_CLIENT_SECRET=<secret> \
    #     --from-literal=HORIZON_GOOGLE_CLIENT_ID=<client-id> \
    #     --from-literal=HORIZON_GOOGLE_CLIENT_SECRET=<secret>
    # Mint a hash with `pnpm --filter bff cli:hash`. Each ref is `${VAR}` with
    # no `:default`, so an unset var expands to empty and the schema rejects
    # the config at boot (passwordHash and clientId are both min(1)) rather
    # than half-configuring auth. Interpolation runs before the YAML parse and
    # substitutes through a replacer function, so the `$` characters in an
    # argon2 hash survive intact.
    # envFromSecret: horizon-secrets
    # The hosted demo environment overrides these via demo-env-installer's
    # demo-values.yaml.
    config:
      server:
        # Used to build the SSO callback, so it must match a redirect URI
        # registered on EACH provider exactly — the string is compared, so
        # 127.0.0.1 and localhost are NOT interchangeable. This is the address
        # NOTES.txt prints for `port-forward svc/<release>-ui 8081:80`; browse
        # that same form so the state cookie and the callback share a host.
        publicUrl: http://127.0.0.1:8081
      auth:
        # Two PUBLICLY-KNOWN demo accounts — the passwords are `admin` and
        # `skywalking`, and the hashes are published in this repo and in
        # chart/skywalking/values.yaml. Fine for the showcase on a trusted
        # network; not credentials. Swap them for the Secret variant below
        # before this is reachable by anyone else.
        #
        # Setting `users: []` disables password login: the BFF still starts
        # and serves the login page with a setup-required banner, and only
        # login is refused. That is the right choice when the SSO block below
        # is enabled and you want the provider buttons to be the only way in.
        backend: local
        local:
          users:
            - username: admin            # password: admin
              passwordHash: "$argon2id$v=19$m=65536,t=3,p=4$eemqy1r72oSXR58y8VpRqw$Bn/dULrmJTHEi3263KfgWDEwQmUsqNLi3xwyv/DekHM"
              roles: [ admin ]
            - username: skywalking       # password: skywalking
              passwordHash: "$argon2id$v=19$m=65536,t=3,p=4$Zqj8HhQDqm8d5c2MipHYZw$BsaCnu4bdd4uadIldx3wwYLsdo47Thxb7Lv1MXpWG2Q"
              roles: [ viewer, maintainer ]
        # Same two users, but with the hashes read from the horizon-secrets
        # Secret instead of committed here. Swap to this (and uncomment
        # `envFromSecret` above) for anything beyond a local demo:
        # backend: local
        # local:
        #   users:
        #     - username: admin
        #       passwordHash: "${HORIZON_ADMIN_PASSWORD_HASH}"
        #       roles: [admin]
        #     - username: skywalking
        #       passwordHash: "${HORIZON_SKYWALKING_PASSWORD_HASH}"
        #       roles: [ viewer, maintainer ]
        # Single sign-on, kept as a REFERENCE — commented out so the showcase
        # ships with password login only. To enable it: uncomment the block,
        # create the horizon-secrets Secret with the four client-credential
        # keys, uncomment `ui.envFromSecret` above, and register
        # `<publicUrl>/api/auth/oidc/callback` on each provider.
        #
        # SSO is ADDITIVE to `backend: local` above — password login keeps
        # working alongside it, so a broken provider never locks anyone out.
        # Both providers share ONE callback; `state` carries which one is
        # returning. GitHub never adopted OIDC, hence `kind: oauth2` and the
        # endpoints configured by hand rather than read from a discovery
        # document; `emailsEndpoint` is required because /user reports
        # `email: null` unless the account publishes an address on its public
        # profile, and it is also what proves the address is verified.
        # Google speaks OIDC, so its endpoints come from
        # <issuer>/.well-known/openid-configuration at runtime and
        # `openid email profile` are added to the scopes automatically.
        #
        # A local username must NOT be an email address — local roles win over
        # SSO, so it would silently answer for the SSO identity at the same
        # address (the BFF drops such users and logs an error).
        #
        # sso:
        #   providers:
        #     - id: github
        #       displayName: GitHub
        #       kind: oauth2
        #       authorizationEndpoint: https://github.com/login/oauth/authorize
        #       tokenEndpoint: https://github.com/login/oauth/access_token
        #       userinfoEndpoint: https://api.github.com/user
        #       emailsEndpoint: https://api.github.com/user/emails
        #       scopes: ["user:email"]
        #       emailPath: email
        #       namePath: login
        #       clientId: "${HORIZON_GITHUB_CLIENT_ID}"
        #       clientSecret: "${HORIZON_GITHUB_CLIENT_SECRET}"
        #       # Empty admits anyone with a GitHub account; list domains to
        #       # confine it to an organisation. Exact match — a subdomain is
        #       # a different domain.
        #       allowedDomains: []
        #     - id: google
        #       displayName: Google
        #       kind: oidc
        #       issuer: https://accounts.google.com
        #       clientId: "${HORIZON_GOOGLE_CLIENT_ID}"
        #       clientSecret: "${HORIZON_GOOGLE_CLIENT_SECRET}"
        #       # Matches the address GOOGLE reports — the account's own
        #       # address, not a domain that merely forwards mail to it.
        #       allowedDomains: []
        #   # A provider says WHO you are, never what you may do here. ONE
        #   # table for every provider — roles re-resolve from the address on
        #   # each request, when there is no record of which provider
        #   # authenticated it. Most specific wins: exact address > domain >
        #   # default, and the first tier that matches WINS OUTRIGHT — tiers
        #   # are not merged, so a domain hit of [admin] does NOT also carry
        #   # defaultRoles.
        #   roles:
        #     defaultRoles: [viewer]
        #     roleByEmail:
        #       "you@example.com": [admin]
        #     # Exact domain, case-insensitive; a leading @ is optional.
        #     # Subdomains do NOT match — eng.example.com needs its own entry,
        #     # because a shared issuer like accounts.google.com serves every
        #     # Workspace tenant without a claim naming which.
        #     roleByDomain:
        #       example.com: [maintainer]
      # Login audit — a durable record of who signed in, on the Admin → Login audit
      # page. NOT set here: the `banyandb` storage feature wires it (see the Makefile),
      # because the liaison address it writes to is derived from $(RELEASE), and the
      # elasticsearch / postgresql features deploy no BanyanDB for it to write to.
      # It lands in this same block as:
      #   audit:
      #     enabled: true
      #     provider: banyandb
      #     banyandb:
      #       address: <release>-banyandb-grpc:17912
      #       allowCleartext: true
      #       retentionDays: 7
  banyandb:
    enabled: false
    image:
      repository: ~
      tag: ~
    # Trace tail sampling: switch the data nodes to the "-plugins" host image, mount the lockstep
    # "-plugins-carrier" .so at /plugins, and pass the two loader flags. Liaison never hosts
    # plugins. This only makes the node capable of filtering; the OAP env below is what activates
    # it per group. Requires a BanyanDB subchart with sampler-plugin support.
    plugins:
      enabled: true
    canopy:
      enabled: true
      podAnnotations: {}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi
    standalone:
      enabled: false
    cluster:
      enabled: true
      liaison:
        replicas: 2
        env:
        - name: GOMEMLIMIT
          value: "3GiB"
        - name: BYDB_DATA_NODE_SELECTOR
          value: "type=hot"
        httpSvc:
          type: ClusterIP
        resources:
          requests:
          - key: cpu
            value: 100m
          - key: memory
            value: 1Gi
          limits:
          - key: cpu
            value: 4
          - key: memory
            value: 4Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        containerSecurityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: [ "ALL" ]
        volumePermissions:
          enabled: true
          chownUser: 1000
          chownGroup: 1000
          image: busybox:1.36
      data:
        nodeTemplate:
          replicas: 2
          resources:
            requests:
            - key: cpu
              value: 100m
            - key: memory
              value: 1Gi
            limits:
            - key: cpu
              value: 4
            - key: memory
              value: 4Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containerSecurityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ "ALL" ]
          volumePermissions:
            enabled: true
            chownUser: 1000
            chownGroup: 1000
            image: busybox:1.36
        roles:
          hot:
            env:
            - name: GOMEMLIMIT
              value: "3GiB"
            lifecycleSidecar:
              schedule: "@daily"
              enabled: true
              resources:
                requests:
                  - key: cpu
                    value: 200m
                  - key: memory
                    value: 128Mi
                limits:
                  - key: cpu
                    value: 500m
                  - key: memory
                    value: 512Mi
            backupSidecar:
              enabled: false
              dest: gcs://banyandb-backup/backup/hot-$(ORDINAL_NUMBER)
              resources:
                requests:
                  - key: cpu
                    value: 200m
                  - key: memory
                    value: 128Mi
                limits:
                  - key: cpu
                    value: 500m
                  - key: memory
                    value: 512Mi
            restoreInitContainer:
              enabled: false
          warm:
            hasMetaRole: false
            env:
            - name: GOMEMLIMIT
              value: "3GiB"
            lifecycleSidecar:
              schedule: "@daily"
              enabled: true
              resources:
                requests:
                  - key: cpu
                    value: 200m
                  - key: memory
                    value: 128Mi
                limits:
                  - key: cpu
                    value: 500m
                  - key: memory
                    value: 512Mi
            backupSidecar:
              enabled: false
              dest: gcs://banyandb-backup/backup/warn-$(ORDINAL_NUMBER)
              resources:
                requests:
                  - key: cpu
                    value: 200m
                  - key: memory
                    value: 128Mi
                limits:
                  - key: cpu
                    value: 500m
                  - key: memory
                    value: 512Mi
            restoreInitContainer:
              enabled: false
          cold:
            hasMetaRole: false
            replicas: 1
            env:
            - name: GOMEMLIMIT
              value: "6GiB"
            resources:
              requests:
              - key: cpu
                value: 100m
              - key: memory
                value: 1Gi
              limits:
              - key: cpu
                value: 8
              - key: memory
                value: 8Gi
            backupSidecar:
              enabled: false
              dest: gcs://banyandb-backup/backup/cold-$(ORDINAL_NUMBER)
              resources:
                requests:
                  - key: cpu
                    value: 200m
                  - key: memory
                    value: 128Mi
                limits:
                  - key: cpu
                    value: 500m
                  - key: memory
                    value: 512Mi
            restoreInitContainer:
              enabled: false
      fodc:
        # FODC (agent + proxy) is enabled by default in the chart; kept explicit so the
        # banyandb-monitor feature always has an aggregated /metrics scrape target.
        enabled: true
        agent:
          resources:
            requests:
              - key: cpu
                value: 200m
              - key: memory
                value: 128Mi
            limits:
              - key: cpu
                value: 500m
              - key: memory
                value: 256Mi
        proxy:
          resources:
            requests:
              - key: cpu
                value: 200m
              - key: memory
                value: 128Mi
            limits:
              - key: cpu
                value: 500m
              - key: memory
                value: 256Mi
          config:
            httpReadTimeout: 60s
            httpWriteTimeout: 60s
          # The otel collector scrapes the proxy pod in-cluster (component=fodc-proxy, port http),
          # so expose it as ClusterIP instead of the chart default LoadBalancer (no external LB).
          httpSvc:
            type: ClusterIP
    storage:
      liaison:
        enabled: true
        persistentVolumeClaims:
        - mountTargets: [ "measure", "stream", "trace" ]
          claimName: liaison-data
          size: 10Gi
          accessModes:
          - ReadWriteOnce
          storageClass: ~
          volumeMode: Filesystem
      data:
        enabled: true
        persistentVolumeClaims:
        - mountTargets: [ "stream" ]
          nodeRole: hot
          claimName: hot-stream-data
          size: 10Gi
          accessModes:
          - ReadWriteOnce
          storageClass: ~
          volumeMode: Filesystem
        - mountTargets: [ "measure" ]
          nodeRole: hot
          claimName: hot-measure-data
          size: 10Gi
          accessModes:
          - ReadWriteOnce
          storageClass: ~
          volumeMode: Filesystem
        - mountTargets: [ "property" ]
          nodeRole: hot
          claimName: hot-property-data
          size: 5Gi
          accessModes:
          - ReadWriteOnce
          storageClass: ~
          volumeMode: Filesystem
        - mountTargets: [ "trace" ]
          nodeRole: hot
          existingClaimName: ~
          claimName: hot-trace-data
          size: 50Gi
          accessModes:
            - ReadWriteOnce
          storageClass: ~
          volumeMode: Filesystem
        - mountTargets: [ "schema-property" ]
          nodeRole: hot
          claimName: hot-schema-property-data
          size: 5Gi
          accessModes:
          - ReadWriteOnce
          storageClass: ~
          volumeMode: Filesystem
        - mountTargets: [ "measure", "stream", "property", "trace" ]
          nodeRole: warm
          claimName: warm-data
          size: 100Gi
          accessModes:
          - ReadWriteOnce
          storageClass: ~
        - mountTargets: [ "measure", "stream", "property", "trace" ]
          nodeRole: cold
          claimName: cold-data
          size: 500Gi
          accessModes:
          - ReadWriteOnce
          storageClass: ~
    etcd:
      enabled: true
      auth:
        rbac:
          create: true
          allowNoneAuthentication: false
          rootPassword: banyandb
      replicaCount: 1
      persistence:
        size: 5Gi
        storageClass: ~
      startupProbe:
        enabled: true
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 60
      livenessProbe:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      readinessProbe:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 4096m
          memory: 1Gi

  elasticsearch:
    enabled: false
    image: ~
    imageTag: ~
    imagePullPolicy: "IfNotPresent"
    antiAffinity: "soft"

  postgresql:
    enabled: false # Whether to start a demo postgresql deployment, don't use this for production.
    config:
      # The hostname of your own postgresql service, this only takes effect when postgresql.enabled is false.
      host: postgresql-service.your-awesome-company.com
    auth:
      username: postgres
      password: "123456"
      postgresPassword: "123456"
      database: skywalking
    containerPorts:
      postgresql: 5432
    primary:
      persistence:
        enabled: false
    readReplicas:
      persistence:
        enabled: false

  satellite:
    name: satellite
    replicas: 1
    enabled: false
    image:
      repository: ~
      tag: ~
      pullPolicy: IfNotPresent
    ports:
      grpc: 11800
      prometheus: 1234
    env:
      SATELLITE_TELEMETRY_EXPORT_TYPE: metrics_service
    podAnnotations:
      sidecar.istio.io/inject: "false"
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 2
        memory: 4Gi

sampleServices:
  hub: ~
  tag: ~
  namespace: sample-services

ciliumServices:
  hub: ~
  tag: ~
  namespace: cilium-services

# @feature: java-agent-injector; the java agent injector is a component of the swck operator, so we need to deploy the swck operator firstly
swck:
  image:
    repository: ~
    tag: ~
  # @feature: java-agent-injector; the swck operator depends on the certificate management of the cert-manager
  cert-manager:
    enabled: true
  fullnameOverride: "swck-demo"

istio:
  enabled: false

base:
  enableCRDTemplates: true
  global:
    istioNamespace: demo

istiod:
  global:
    istioNamespace: demo
  meshConfig:
    accessLogFile: /dev/stdout
    ingressClass: istio
    ingressService: istio-ingressgateway
    ingressSelector: istio-ingressgateway
    enableEnvoyAccessLogService: true
    enableTracing: true
    defaultConfig:
      tracing:
        sampling: 100
        zipkin:
          address: ""
      envoyMetricsService:
        address: ""
      envoyAccessLogService:
        address: ""
      proxyStatsMatcher:
        inclusionRegexps:
        - ".*membership_healthy.*"
        - ".*upstream_cx_active.*"
        - ".*upstream_cx_total.*"
        - ".*upstream_rq_active.*"
        - ".*upstream_rq_total.*"
        - ".*upstream_rq_pending_active.*"
        - ".*lb_healthy_panic.*"
        - ".*upstream_cx_none_healthy.*"

# @feature: kubernetes-monitor; extra resources to install for kubernetes monitoring, standard kube-state-metrics
kube-state-metrics:
  enabled: false

rabbitmq:
  enabled: false
  replicaCount: 1
  persistence:
    enabled: false
  metrics:
    enabled: true
  auth:
    username: guest
    password: guest
    erlangCookie: skywalking-showcase

mongodb:
  enabled: false
  architecture: replicaset
  replicaCount: 2
  auth:
    enabled: false
  persistence:
    enabled: false
  metrics:
    enabled: true
    compatibleMode: true
    collector:
      dbstats: true
      diagnosticdata: true
      replicasetstatus: true

prometheus-elasticsearch-exporter:
  enabled: false
  fullnameOverride: prometheus-elasticsearch-exporter
  service:
    httpPort: 9114
  es:
    uri: "http://elasticsearch-master:9200"

opentelemetry:
  enabled: false

opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  clusterRole:
    create: true
    rules:
    - apiGroups: [ "" ]
      resources:
      # @feature: kubernetes-monitor; permissions to read resources
      - "endpoints"
      - "pods"
      - "services"
      - "nodes"
      - "nodes/metrics"
      - "nodes/proxy"
      verbs: [ "get", "watch", "list" ]
  resources:
    limits:
      cpu: 1024m
      memory: 2Gi
  image:
    repository: ~
    tag: ~

  configMap:
    create: false

  command:
    name: otelcol
    extraArgs: [ "--config=/conf/config.yaml" ]

  extraVolumes:
  - name: otelcol-configmap
    configMap:
      name: otel-collector-config
      defaultMode: 420
  extraVolumeMounts:
  - name: otelcol-configmap
    mountPath: /conf

features:
  kubernetesMonitor:
    enabled: false

  elasticsearchMonitor:
    enabled: false

  rabbitmqMonitor:
    enabled: false

  mongodbMonitor:
    enabled: false

  mysqlMonitor:
    enabled: false

  postgresqlMonitor:
    enabled: false

  event:
    enabled: false
    exporter:
      image: ~

  istiodMonitor:
    enabled: false

  nginxMonitor:
    enabled: false

  apisixMonitor:
    enabled: false

  traceProfiling:
    enabled: false
    swctl:
      image: ~

  rover:
    enabled: false
    image: ~
    swctl:
      image: ~

  vmMonitor:
    enabled: false

  grafana:
    enabled: false
    image: ~

  function:
    enabled: false

  so11y:
    enabled: false

  als:
    enabled: false

  meshWithAgent:
    enabled: false

  agent:
    enabled: false

  # @feature: java-agent-injector; enable java agent injector and set the java agent image
  javaAgentInjector:
    enabled: false
    agentImage: ~

  r3:
    enabled: false
    image: ~

  rocketmqMonitor:
    enabled: false

  pulsarMonitor:
    enabled: false

  activemqMonitor:
    enabled: false

  cilium:
    enabled: false

  flinkMonitor:
    enabled: false

  banyandbMonitor:
    enabled: false
